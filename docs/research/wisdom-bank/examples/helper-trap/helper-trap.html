o\n[5:47] step in and try to help you. And if you\n[5:49] see me doing it,\n[5:51] then just tell me, \"Hey, relax. Like,\n[5:53] you don't need to do this right now.\" Or\n[5:55] you could even say to me, \"You're not\n[5:56] going to get in trouble if you don't\n[5:57] help me. It's fine. I actually want to\n[5:59] do this on my own.\"\n[6:00] And that's the weird thing about being\n[6:02] in that helper mindset. When you're in\n[6:04] the helper mindset, what has happened to\n[6:05] you most likely is that you were in a\n[6:07] relationship with your parents where\n[6:09] your job was to help them emotionally\n[6:11] rather than their job was helping you\n[6:13] emotionally. And when you didn't help\n[6:15] your parents emotionally, what happened\n[6:17] is you got in trouble. So, you're\n[6:19] constantly just trying to avoid trouble\n[6:20] by helping people. That's what's\n[6:22] actually going on. And maybe you feel\n[6:24] guilt if you're not helping people.\n[6:26] Maybe you feel like you're going to get\n[6:27] hit if you don't help people. But\n[6:29] whatever it is, there's a consequence\n[6:31] that you feel like, \"Oh, if I don't help\n[6:32] them, I'm going to get in trouble.\" So,\n[6:34] owning that with the people is really\n[6:36] important, too. \"Oh, I feel guilty when\n[6:38] I'm not helping you.\"\n[6:40] How do you feel about that? Do you want\n[6:42] me to feel guilty if I'm not helping\n[6:44] you? Is that what you want? And you'll\n[6:46] find out most people don't want that.\n[6:48] And they definitely don't want your\n[6:49] action and obligation.\n[6:51] Like, if I was to say to you,\n[6:53] \"I'm helping you cuz I feel obligated,\"\n[6:55] you would probably not want my help. If\n[6:57] I said to you, \"Hey, I invited you to my\n[6:59] party, but it's only cuz I felt\n[7:00] obligated,\" you probably wouldn't want\n[7:02] to come to the party.\n[7:03] Right? So, most people don't even want\n[7:05] you to act in that obligation. And if\ ity to make sure\n[8:37] your child's happy\n[8:39] and learning. As a leader, you have a\n[8:42] responsibility to make sure that the\n[8:43] organization is happy and healthy.\n[8:45] And so you do need some information. Now\n[8:48] you might get some kickback on the\n[8:49] information until they realize, \"Oh,\n[8:51] this means you're not going to be in my\n[8:53] trying to help me all the time.\"\n[8:54] Then they're going to be like, \"This is\n[8:55] great. Yeah, I'll I'll write the\n[8:57] 2-minute report. Happy to do it.\" So\n[9:01] just make sure that your needs are met\n[9:02] at the same time because you're going\n[9:04] from\n[9:06] taking care of yourself by taking care\n[9:07] of others into taking care of yourself\n[9:09] by taking care of yourself, which means\n[9:11] asking for stuff.\n[9:12] And so it's really important that you're\n[9:14] clear on what you need so that you can\n[9:16] let go of constantly, maniacally,\n[9:20] automatically helping people."</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const TX = JSON.parse(document.getElementById('txdata').textContent);
const byId = Object.fromEntries(D.concepts.map(c => [c.id, c]));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const secs = t => t.split(':').reduce((a, b) => a * 60 + Number(b), 0);
const at = t => D.work.url + '&t=' + secs(t) + 's';

document.getElementById('t-title').textContent = D.work.title;
const meta = document.getElementById('t-meta');
meta.append(`${D.work.speaker} · ${D.work.length} · `);
const watch = el('a', null, 'Watch'); watch.href = D.work.url; watch.target = '_blank'; watch.rel = 'noopener';
meta.append(watch);

/* A card that reveals its levels one tap at a time, in place. */
function stepper(box, levels, labels) {
  levels.forEach((L, i) => { if (i > 0) L.hidden = true; box.append(L); });
  let shown = 1;
  const btn = el('button', 'more', labels[0]); btn.type = 'button';
  btn.addEventListener('click', () => {
    levels[shown].hidden = false; shown++;
    if (shown >= levels.length) btn.hidden = true; else btn.textContent = labels[shown - 1];
  });
  box.append(btn);
}

function opener(o) {
  const b = el('div', 'opener');
  if (o.story) { b.append(el('p', 'read', o.story)); return b; }
  b.append(el('p', 'read', '“' + o.text + '”'));
  const a = el('a', null, o.t); a.href = at(o.t); a.target = '_blank'; a.rel = 'noopener';
  b.append(a); return b;
}

function ideaCard(c) {
  const box = el('article', 'concept');
  box.append(el('h3', null, c.name));
  if (c.opener) box.append(opener(c.opener));
  const gem = el('div', 'lvl'); gem.append(el('p', 'read', c.gem));
  const cliff = el('div', 'lvl'); cliff.append(el('p', 'read', c.cliff));
  const full = el('div', 'lvl'); c.full.forEach(p => full.append(el('p', 'read', p)));
  const words = el('div', 'lvl');
  c.quotes.forEach(q => {
    const b = el('div', 'q');
    b.append(el('p', 'read', '“' + q.text + '”'));
    const a = el('a', null, q.t); a.href = at(q.t); a.target = '_blank'; a.rel = 'noopener';
    b.append(a); words.append(b);
  });
  stepper(box, [gem, cliff, full, words], ['More', 'The full reading', 'The exact words']);
  const rel = D.links.filter(l => l[0] === c.id || l[1] === c.id);
  if (rel.length) {
    const lk = el('div', 'links');
    rel.forEach(([from, to, fwd, back]) => {
      const other = from === c.id ? to : from;
      const p = el('p'); p.append((from === c.id ? fwd : back) + ': ');
      const a = el('a', null, byId[other].name); a.href = '#i-' + other;
      a.addEventListener('click', ev => { ev.preventDefault(); const t = document.getElementById('i-' + other); t.scrollIntoView({behavior: 'smooth'}); t.classList.add('flash'); setTimeout(() => t.classList.remove('flash'), 1200); });
      p.append(a); lk.append(p);
    });
    box.append(lk);
  }
  return box;
}

/* The talk itself: gem, cliff note, summary (ideas open inside it), original. */
const talk = document.getElementById('talk');
talk.append(el('h3', null, 'The whole talk'));
if (D.work.opener) talk.append(opener(D.work.opener));
const tGem = el('div', 'lvl'); tGem.append(el('p', 'read', D.work.gem));
const tCliff = el('div', 'lvl'); tCliff.append(el('p', 'read', D.work.cliff));
const tSum = el('div', 'lvl');
D.work.summary.forEach(par => {
  const p = el('p', 'read');
  const slot = el('div', 'inline-idea'); slot.hidden = true;
  par.split(/(\[\[[a-z]+\|[^\]]+\]\])/).forEach(part => {
    const m = part.match(/^\[\[([a-z]+)\|([^\]]+)\]\]$/);
    if (!m) { p.append(part); return; }
    const b = el('button', 'idea-link', m[2]); b.type = 'button';
    b.setAttribute('aria-expanded', 'false');
    b.addEventListener('click', () => {
      if (!slot.firstChild) slot.append(ideaCard(byId[m[1]]));
      slot.hidden = !slot.hidden;
      b.setAttribute('aria-expanded', String(!slot.hidden));
    });
    p.append(b);
  });
  tSum.append(p, slot);
});
const tOrig = el('div', 'lvl');
const pre = el('pre', 'tx'); pre.textContent = TX;
tOrig.append(pre);
stepper(talk, [tGem, tCliff, tSum, tOrig], ['More', 'The summary', 'The original transcript']);

const list = document.getElementById('list');
D.concepts.forEach(c => { const card = ideaCard(c); card.id = 'i-' + c.id; list.append(card); });
</script>
