# A clean setup, build, test and package check on every PR to main.
# GitHub Actions minutes are a metered free-plan service: PRs to main only (never on push),
# one run per ref at a time (a new push cancels the old run), npm cached, hard timeout.
name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Queue trusted runs on Adrian's Mac (mac-ci) while it is online, even when it is busy.
  # Fork PRs and offline/error cases fall back to ubuntu-latest. GitHub has no built-in
  # fallback, and the default token cannot list runners, so this reads RUNNER_STATUS_TOKEN
  # (fine-grained, Administration: read). With no token set, every run goes to ubuntu-latest.
  #
  # The Mac runs the whole suite as one part (about 10 minutes). On ubuntu-latest the suite took
  # about 21 minutes and 10 of 16 runs between 8 and 16 November hit the time limit, so there it
  # is split into four parts that run at the same time (about 6 minutes each).
  pick-runner:
    # Runner discovery only needs curl and jq. The test fallback still uses Ubuntu Latest.
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
      shards: ${{ steps.pick.outputs.shards }}
      total: ${{ steps.pick.outputs.total }}
    steps:
      - id: pick
        env:
          TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          CAN_USE_SELF_HOSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          choice='"ubuntu-latest"'
          if [ "$CAN_USE_SELF_HOSTED" = true ] && [ -n "$TOKEN" ]; then
            online=$(curl -fsS --max-time 15 -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runners" \
              | jq '[.runners[] | select(.status == "online" and any(.labels[]; .name == "mac-ci"))] | length' || echo 0)
            [ "${online:-0}" -gt 0 ] && choice='["self-hosted","mac-ci"]'
          fi
          if [ "$choice" = '"ubuntu-latest"' ]; then shards='[1,2,3,4]'; total=4; else shards='[1]'; total=1; fi
          echo "runs_on=$choice" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "Running on: $choice in $total part(s)"

  tests:
    # Not named `ci`: the release script and branch protection read the `ci` job below, which
    # passes only when every part passes (scripts/lib/release-gates.mjs matches names starting `ci`).
    name: tests ${{ matrix.shard }} of ${{ needs.pick-runner.outputs.total }}
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs_on) }}
    # The Mac runs the whole suite two files at a time: 19-20 minutes in three runs on 16 November,
    # so it gets 35. Each GitHub-hosted part took 4-9 minutes, so 25 is ample there.
    timeout-minutes: ${{ needs.pick-runner.outputs.total == '1' && 35 || 25 }}
    strategy:
      # Every part reports its own failures, so one run shows the whole list.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.pick-runner.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The npm cache is GitHub storage; the Mac keeps its own, so it skips the upload that pushed runs past the limit.
          cache: ${{ needs.pick-runner.outputs.runs_on == '"ubuntu-latest"' && 'npm' || '' }}
          cache-dependency-path: |
            runtime/package-lock.json
            mcp/study/package-lock.json

      - name: Setup
        run: npm run setup

      - name: Build
        run: npm run build

      - name: Test
        id: test
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.pick-runner.outputs.total }}
          # The daily-driver Mac also runs real Chromium, servers and JSDOM fixtures. At node's
          # default (9 files at once on its 10 cores) 24 of 28 Mac runs between 8 and 16 November
          # failed, each on a different heavy test ("workspace is offline", "did not mount"),
          # while the same suite passed on GitHub's machine. Two files at once bounds that
          # contention. Hosted Linux keeps node's default.
          CONCURRENCY: ${{ runner.os == 'macOS' && '--test-concurrency=2' || '' }}
        run: |
          set -o pipefail
          # Same files as `npm test`, called directly because node only reads --test-* options
          # placed BEFORE the file list; `npm test -- --flag` puts them after, where they are
          # silently ignored.
          node --test $CONCURRENCY --test-shard="$SHARD" tests/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/test-output.log"

      - name: Verify package
        if: ${{ matrix.shard == 1 && !cancelled() && steps.test.outcome != 'skipped' }}
        run: npm run verify:package

      - name: Summary
        if: ${{ !cancelled() }}
        run: node tests/helpers/ci-summary.mjs "$RUNNER_TEMP/test-output.log" "$RUNNER_TEMP/ci-summary.json"

      - name: Upload summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-summary.json
          retention-days: 30

  ci:
    # The one result everything reads: branch protection requires a check named `ci`, and the
    # release script installs only a commit whose newest `ci` check succeeded.
    name: ci
    needs: [pick-runner, tests]
    if: ${{ !cancelled() }}
    # A successful Mac run reports locally. The summary job needs only jq and
    # artifact access, so keep hosted reporting available on Ubuntu Slim.
    runs-on: ${{ fromJSON(needs.tests.result == 'success' && needs.pick-runner.outputs.total == '1' && needs.pick-runner.outputs.runs_on || '"ubuntu-slim"') }}
    timeout-minutes: 3
    steps:
      - name: Create a fresh summary directory
        id: summaries
        run: |
          directory="$(mktemp -d "$RUNNER_TEMP/ar-create-ci.XXXXXX")"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ci-summary-*
          path: ${{ steps.summaries.outputs.directory }}/summaries

      - name: Merge summaries
        env:
          TOTAL: ${{ needs.pick-runner.outputs.total }}
          DIRECTORY: ${{ steps.summaries.outputs.directory }}
        run: |
          cd "$DIRECTORY"
          mkdir -p out
          files=$(ls summaries/*/ci-summary.json 2>/dev/null || true)
          if [ -n "$files" ]; then
            # A part that did not finish has null counts; then the whole run's counts are null.
            jq -s --argjson total "${TOTAL:-0}" '
              def sum(k): if (length < $total or any(.[]; .[k] == null)) then null else (map(.[k]) | add) end;
              {tests: sum("tests"), pass: sum("pass"), fail: sum("fail"), skipped: sum("skipped"),
               sha: .[0].sha, at: (now | todate), parts: length}' $files > out/ci-summary.json
          else
            echo '{"tests":null,"pass":null,"fail":null,"skipped":null,"parts":0}' > out/ci-summary.json
          fi
          cat out/ci-summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: ci-summary
          path: ${{ steps.summaries.outputs.directory }}/out/ci-summary.json
          retention-days: 30

      - name: Result
        run: |
          echo "Test parts: ${{ needs.tests.result }}"
          [ "${{ needs.tests.result }}" = "success" ]

      - name: Remove temporary summaries
        if: always() && steps.summaries.outputs.directory != ''
        env:
          DIRECTORY: ${{ steps.summaries.outputs.directory }}
        run: rm -rf -- "$DIRECTORY"
