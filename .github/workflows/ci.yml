# One lane: a clean setup, build, test and package check on every PR to main.
# GitHub Actions minutes are a metered free-plan service: PRs to main only (never on push),
# one run per ref at a time (a new push cancels the old run), npm cached, hard timeout.
name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            runtime/package-lock.json
            mcp/study/package-lock.json

      - name: Setup
        run: npm run setup

      - name: Build
        run: npm run build

      - name: Test
        id: test
        shell: bash
        run: |
          set -o pipefail
          # The private-repo runner has 2 vCPUs, where node:test defaults to running one file at a
          # time (~30 min serial). Most files wait on local servers, so 4 at once fits the timeout.
          npm test -- --test-concurrency=4 2>&1 | tee "$RUNNER_TEMP/test-output.log"

      - name: Verify package
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: npm run verify:package

      - name: Summary
        if: ${{ !cancelled() }}
        run: node tests/helpers/ci-summary.mjs "$RUNNER_TEMP/test-output.log" "$RUNNER_TEMP/ci-summary.json"

      - name: Upload summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary
          path: ${{ runner.temp }}/ci-summary.json
          retention-days: 30
