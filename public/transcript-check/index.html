<html lang="en"><head><meta charset="utf-8">

<title>Check the transcript · AR Create</title>

 <div class="finish" id="finish"><p>Everything is checked. The corrected transcript is saved with the recording.</p><a class="btn main" id="open-view" href="#">Open the full transcript</a></div>
</div></main>
