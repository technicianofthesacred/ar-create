<title>Wisdom bank at full size</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style>
/* Mock-up only. The wisdom bank as one zoomable map: a canvas fills the screen, a trail and the honing controls sit above it,
   and one reading panel rises from the bottom (phone) or sits at the right (computer). Colours and type are the first mock-ups' own. */
:root{--bg:#efede6;--paper:#fffefb;--ink:#2d302a;--dim:#686c61;--line:#e2e0d8;--warm:#7a5a30;--ink2:#51564b;--line2:#cfcdc3;--sel:#e9e4d7;--good:#3f6146;--warn:#94600f;--shadow:0 18px 50px rgba(40,35,25,.18);
 --l0:#7a5a30;--l1:#3f6146;--l2:#a4502f;--l3:#3d5f8a;--l4:#74508a;--l5:#2f6f68;--l6:#6f6a1e;--l7:#9a4560;
 --ui:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;--speech:Lora,Georgia,serif;
 --t12:12px;--t13:13px;--t14:14px;--t15:15px;--t18:18px;--t22:22px;
 --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141310;--paper:#1d1b16;--ink:#e7e1d3;--dim:#a39e8e;--line:#2d2a23;--warm:#c9a874;--ink2:#c3bdad;--line2:#423e34;--sel:#2c2a22;--good:#8fb08a;--warn:#d9a95a;--shadow:0 18px 50px rgba(0,0,0,.55);
 --l0:#c9a874;--l1:#8fb08a;--l2:#d08a6e;--l3:#8aa6c9;--l4:#b99ac4;--l5:#7fb5ad;--l6:#c2b56a;--l7:#cf8f9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141310;--paper:#1d1b16;--ink:#e7e1d3;--dim:#a39e8e;--line:#2d2a23;--warm:#c9a874;--ink2:#c3bdad;--line2:#423e34;--sel:#2c2a22;--good:#8fb08a;--warn:#d9a95a;--shadow:0 18px 50px rgba(0,0,0,.55);
 --l0:#c9a874;--l1:#8fb08a;--l2:#d08a6e;--l3:#8aa6c9;--l4:#b99ac4;--l5:#7fb5ad;--l6:#c2b56a;--l7:#cf8f9f;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--t15)/1.5 var(--ui);-webkit-text-size-adjust:100%;overflow:hidden;overflow-wrap:break-word;overscroll-behavior:none}
h1,h2,h3,p,ul,ol,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--warm);outline-offset:2px;border-radius:4px}
#app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}

/* top: hone in, narrow, concepts or works */
.top{display:flex;align-items:center;gap:8px;height:52px;padding-left:var(--gl);padding-right:var(--gr);border-bottom:1px solid var(--line);background:var(--bg)}
.ask{flex:1 1 0;min-width:0;display:flex;align-items:center;height:38px;padding:0 14px;border-radius:19px;background:var(--paper);border:1px solid var(--line2)}
.ask input{flex:1 1 auto;min-width:0;width:100%;height:36px;border:0;background:transparent;color:var(--ink);font:400 var(--t15)/1.3 var(--speech);outline:0}
.ask input::placeholder{color:var(--dim)}
.tbtn{flex:none;display:inline-flex;align-items:center;height:38px;padding:0 10px;border-radius:8px;font:500 var(--t13)/1 var(--ui);color:var(--ink2)}
.tbtn[aria-expanded="true"],.tbtn.on{background:var(--sel);color:var(--ink)}
.seg{flex:none;display:inline-flex;padding:3px;border-radius:10px;background:var(--sel)}
.seg button{height:32px;padding:0 10px;border-radius:7px;font:500 var(--t13)/1 var(--ui);color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600}
@media (max-width:600px){.top:focus-within .seg,.top:focus-within .tbtn{display:none}}

/* where am I */
.trailrow{display:flex;align-items:flex-start;gap:8px;min-height:44px;padding-left:var(--gl);padding-right:var(--gr);border-bottom:1px solid var(--line);background:var(--bg)}
.trail{flex:1 1 0;min-width:0;display:flex;flex-wrap:wrap;align-items:center;margin-left:-8px;font-size:var(--t13);color:var(--dim)}
.trail button{min-height:44px;max-width:46vw;padding:0 8px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trail button[aria-current]{color:var(--ink);font-weight:600}
.trail i{font-style:normal;opacity:.6}
.sample{flex:none;margin-top:12px;display:inline-flex;align-items:center;height:20px;padding:0 7px;border:1px dashed var(--line2);border-radius:10px;font:500 var(--t12)/1 var(--ui);color:var(--dim);letter-spacing:.02em}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;margin:8px 6px 8px 8px;padding:0 6px 0 10px;border-radius:14px;background:var(--sel);color:var(--ink);font:500 var(--t12)/1 var(--ui)}
.chip b{font-weight:500;opacity:.6;font-size:15px;padding:0 4px}

/* the map */
#stage{position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;transition:opacity .25s}
#cv.swap{opacity:0}
.float{position:absolute;z-index:3}
#zoom{right:var(--gr);top:12px;display:grid;gap:6px}
#zoom button{width:40px;height:40px;border-radius:10px;background:var(--paper);border:1px solid var(--line2);display:grid;place-items:center;font:500 20px/1 var(--ui);color:var(--ink2)}
#back{left:var(--gl);display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:20px;background:var(--ink);color:var(--bg);font:600 var(--t13)/1 var(--ui);box-shadow:var(--shadow)}
#shape{left:var(--gl);right:calc(var(--gr) + 52px);top:14px;font-size:var(--t12);color:var(--dim);font-variant-numeric:tabular-nums;pointer-events:none}
#results,#narrow{left:var(--gl);right:var(--gr);top:8px;max-width:440px;max-height:calc(100% - 16px);overflow:auto;border-radius:12px;background:var(--paper);border:1px solid var(--line2);box-shadow:var(--shadow);z-index:6}
#narrow{left:auto;width:min(440px,calc(100% - var(--gl) - var(--gr)));padding:16px}
@media (max-width:600px){#narrow{left:var(--gl);width:auto;top:auto;bottom:10px;max-height:50%}}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 14px;border-top:1px solid var(--line);font-size:var(--t15)}
.row:first-child{border-top:0}
.row span{flex:1 1 0;min-width:0}
.row small{flex:none;max-width:45%;font-size:var(--t12);color:var(--dim);text-align:right}
.rh{padding:12px 14px 4px;border-top:1px solid var(--line)}
.rh:first-child{border-top:0}
.dot{display:block;border-radius:50%;flex:none;width:10px;height:10px;background:color-mix(in srgb,var(--ink) calc(12% + var(--r)*17.6%),var(--bg))}
.dot[data-r="5"]{background:var(--warm);box-shadow:0 0 0 4px color-mix(in srgb,var(--warm) 22%,transparent)}
.lab{font:500 var(--t12)/1.3 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}

/* reading panel: groups set apart by space, their words on their own surface from edge to edge */
#panel{position:absolute;z-index:4;left:0;right:0;bottom:0;max-height:60%;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;background:var(--paper);border-top:1px solid var(--line2);border-radius:16px 16px 0 0;padding:14px var(--gr) calc(18px + env(safe-area-inset-bottom,0px)) var(--gl);box-shadow:var(--shadow)}
#panel[data-level="2"]{max-height:66%}
#panel[data-level="3"]{max-height:80%}
#panel>*+*{margin-top:12px}
#panel>.lab{margin-top:24px}
#panel>header+.lab{margin-top:16px}
#panel>.lab+*{margin-top:8px}
#panel>header{display:flex;align-items:flex-start;gap:10px}
#panel>header>div{flex:1 1 0;min-width:0}
h2{font:600 var(--t18)/1.25 var(--ui);letter-spacing:-.01em;text-wrap:balance}
h3{font:600 var(--t15)/1.3 var(--ui)}
.meta{font-size:var(--t13);color:var(--dim);margin-top:2px}
.res{display:inline-flex;flex:none;margin:-10px -6px 0 0}
.res button{width:22px;height:44px;display:grid;place-items:center}
.res button::before{content:"";width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line2)}
.res button.f::before{background:var(--warm);box-shadow:none}
.depth{display:flex;padding:3px;border-radius:10px;background:var(--bg)}
.depth button{flex:1 1 0;height:34px;border-radius:7px;text-align:center;font:500 var(--t13)/1 var(--ui);color:var(--dim)}
.depth button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line2)}
.dist{display:grid;gap:10px;font-size:var(--t15);color:var(--ink);max-width:68ch}
.dist h3{font-size:var(--t15)}
#panel>.dist.sec{margin-top:26px}
.voice{display:inline-flex;align-items:center;gap:8px;min-height:40px;font:500 var(--t13)/1 var(--ui);color:var(--warm)}
.voice::before{content:"+";font-size:18px}
.mine{padding:10px 12px;border:1.5px solid var(--warm);border-radius:10px;font:400 var(--t15)/1.55 var(--speech)}
.mine small{display:block;margin-top:4px;font:500 var(--t12)/1.3 var(--ui);color:var(--warm)}
.vf{display:flex;gap:8px;align-items:center}.vf .field{flex:1 1 0;min-width:0;padding:8px 12px}
blockquote.say{margin-inline:calc(var(--gl)*-1) calc(var(--gr)*-1);padding:14px var(--gr) 14px var(--gl);background:var(--bg);font:400 var(--t15)/1.6 var(--speech)}
blockquote.say+.who{margin-top:6px}
.who{font-size:var(--t13);color:var(--dim)}
.who+blockquote.say{margin-top:18px}
.kin{display:grid;gap:0;margin-top:20px}
.kinh{display:flex;align-items:center;gap:10px;padding-bottom:4px;font:500 var(--t13)/1.3 var(--ui);color:var(--dim)}
.mk{display:block;flex:none;width:24px;border-top:2px solid var(--ink2)}
.mk[data-k="0"]{border-top-width:3px;border-color:var(--lc,var(--warm))}
.mk[data-k="2"]{border-top-style:dotted}
.mk[data-k="3"]{border-top-style:dashed}
.mk[data-k="4"]{border-top-style:dashed;border-color:var(--warm)}
.go{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;border-top:1px solid var(--line);font-size:var(--t15)}
.go span{flex:1 1 0;min-width:0}
.go small{flex:none;font-size:var(--t12);color:var(--dim)}
.go::after{content:"›";flex:none;color:var(--dim);font-size:18px}
.why{padding:0 0 10px;font-size:var(--t13);color:var(--ink2)}
.knot{flex:none;width:36px;height:44px;display:grid;place-items:center}
.knot::before{content:"";width:11px;height:11px;transform:rotate(45deg);border:2px solid var(--warm);border-radius:2px}
.gorow{display:flex;align-items:center;border-top:1px solid var(--line)}
.gorow .go{border-top:0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border-radius:20px;font:600 var(--t13)/1 var(--ui);white-space:nowrap;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.main,.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.x{flex:none;width:36px;height:36px;margin:-6px -8px 0 0;border-radius:8px;display:grid;place-items:center;color:var(--dim);font-size:20px}
textarea,.field{width:100%;padding:12px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);color:var(--ink);font:400 var(--t15)/1.5 var(--speech)}
textarea{min-height:88px;resize:vertical}
.good{font-size:var(--t13);color:var(--good)}
.tog{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;font-size:var(--t14)}
.tog[aria-pressed="false"]{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:34px;padding:0 12px;border-radius:17px;font:500 var(--t13)/1 var(--ui);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line2)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
#narrow>*+*{margin-top:8px}
#narrow>.lab{margin-top:20px}
#narrow>.lab:first-child{margin-top:0}
#narrow .res{margin:0}
@media (min-width:900px){
 .top,.trailrow{padding-left:28px;padding-right:28px}
 .ask{max-width:420px}.top{gap:12px}.top .grow{flex:1 1 0}
 #panel{left:auto;top:0;bottom:0;width:420px;max-height:none!important;border-radius:0;border-top:0;border-left:1px solid var(--line2);padding:22px 24px 30px;--gl:24px;--gr:24px}
 #zoom{right:auto;left:28px}
 #shape{left:84px}
 #results{left:28px}
}
@media (prefers-reduced-motion:reduce){#cv{transition:none}}
</style>
<div id="app">
 <header class="top">
  <form class="ask" id="askf" autocomplete="off"><input id="q" type="search" enterkeyhint="go" placeholder="A feeling or a name" aria-label="Say or type a feeling or a name"></form>
  <span class="grow"></span>
  <button class="tbtn" id="narrowBtn" aria-expanded="false" aria-controls="narrow">Narrow</button>
  <div class="seg" id="mode" role="group" aria-label="Browse by"><button data-m="0" aria-pressed="true">Concepts</button><button data-m="1" aria-pressed="false">Works</button></div>
 </header>
 <div class="trailrow"><nav class="trail" id="trail" aria-label="Where you are"></nav><span class="sample">Sample</span></div>
 <main id="stage">
  <canvas id="cv" aria-label="Map of the bank"></canvas>
  <div class="float" id="zoom"><button id="zin" aria-label="Closer">+</button><button id="zout" aria-label="Further">&minus;</button></div>
  <div class="float" id="results" hidden></div>
  <div class="float" id="narrow" hidden></div>
  <div class="float" id="shape"></div>
  <button class="float" id="back" hidden>&#8617; Back to where I was</button>
  <aside id="panel" hidden></aside>
 </main>
</div>
<script>
'use strict';
/* ---------- the invented bank, generated from a fixed seed ---------- */
const X=Math.max(1,+(new URLSearchParams(location.search).get('x'))||1); // ?x=10 grows the bank ten times, for measuring only
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const PREP=0,EXPL=1,ECHO=2,CONTR=3,MINE=4,REV=8,G=100;
const TRADS=['Stillwater','Ember Path','Hollow Reed','Northlight','Salt Road','Open Hand','Lantern','Riverstone','Quiet Orchard','Windward','Deep Field','Ashgrove'];
const WA='Resting Borrowed Open Quiet Unfinished Ordinary Returning Listening Unguarded Patient Small Honest Wordless Shared Steady Bare Slow Given Unforced Tender Wide Plain Inner Empty Whole Loosened Remembered Forgotten Hidden Daily First Last Clear Warm Fierce Soft Unbroken Passing Lasting Falling Rising Waiting Carried Unnamed Welcomed Unhurried Undivided Simple Secret Common Living Still Moving Near Late Early Humble Bright Perfect'.split(' ');
const WB='attention,breath,silence,effort,longing,doubt,refuge,grief,joy,fear,rest,practice,welcome,surrender,discipline,devotion,emptiness,presence,wholeness,habit,desire,anger,kindness,trust,patience,courage,wonder,shame,pride,hunger,stillness,gratitude,release,listening,speech,work,play,sleep,solitude,company,belonging,perfection,honesty,tenderness,forgiveness,humility,generosity,restlessness,boredom,envy,loneliness,comfort,pain,pleasure,memory,hope,despair,curiosity,clarity,confusion,strength,weakness,freedom,duty,love,loss,peace,struggle,acceptance,resistance,faith,certainty,ambition,contentment,sorrow,laughter,prayer,study,service,ritual,routine,change,beginning,ending,waiting,letting go,holding on,forgetting,remembering,giving,receiving,asking,knowing,not knowing,feeling,thinking,willpower,softness,steadiness,openness'.split(',');
/* a concept is named as a plain statement a person would say */
const PAT=['{A} comes before {b}','{A} is not {b}','{A} without {b}','{A} grows from {b}','{A} and {b} are not the same','{A} can be welcomed','Start with {a}','{A} is already here','You cannot force {a}','Let {a} be seen'];
const HAND=['Everything is perfect as it is','You are already whole','Nothing needs to be added','Kindness comes first','Feeling everything is the way through','The body knows before the mind','Rest is not laziness','You cannot think your way there','What you resist stays','Ordinary life is the practice','Being seen is part of healing','Love does not need a reason'];
const PLACES='Harrowmere,Tessel Bay,Oldwick,Sennet Hill,Varrow,Calder Fen,Ilmont,Brask,Orrin Cross,Lowen,Pell Harbour,Quillon,Marrow Field,Eastling,Thornby Lake,Usk Hollow'.split(',');
const ROLES='The elder,The gardener,The cook,The ferryman,The night teacher,The visiting teacher,The letter writer,The bell ringer,The old student,The translator,The doorkeeper,The weaver'.split(',');
const cap=s=>s[0].toUpperCase()+s.slice(1), lc=s=>s[0].toLowerCase()+s.slice(1);

function generate(){
 const R=rng(20261111),ri=n=>Math.floor(R()*n),pick=a=>a[ri(a.length)];
 const NT=12,NL=300*X,NC=20000*X,NW=2000*X,RB=3000*Math.sqrt(X),SP=RB*2.5;
 const B={X,NT,NL,NC,NW,RB,SP};
 // traditions: regions of unequal size on a staggered three by four field
 let w=[],sum=0;for(let i=0;i<NT;i++){w[i]=.55+R()*1.1;sum+=w[i]}
 const T=B.T=[];let accC=0,accL=0;
 for(let i=0;i<NT;i++){const sh=w[i]/sum,col=i%3,row=i/3|0;
  const nC=i<NT-1?Math.round(NC*sh):NC-accC,nL=i<NT-1?Math.round(NL*sh):NL-accL;accC+=nC;accL+=nL;
  T.push({id:i,name:TRADS[i],sh,nC,nL,r:RB*Math.sqrt(sh*NT),cx:Math.round(((col+.5+(row%2?.13:-.13))*SP+(R()-.5)*RB*.2)/G)*G,cy:Math.round(((row+.5)*SP*.95+(R()-.5)*RB*.2)/G)*G,ph:R()*6.28,ph2:R()*6.28,stops:[],lines:[],works:[],nW:0,nStops:0})}
 B.w=3*SP;B.h=4*SP*.95;
 const cx=B.cx=new Float32Array(NC),cy=B.cy=new Float32Array(NC),ctr=B.ctr=new Uint8Array(NC),cres=B.cres=new Uint8Array(NC),cpar=B.cpar=new Int32Array(NC).fill(-1),nLines=B.nLines=new Uint8Array(NC);
 let n=0;const made=new Int32Array(NT);
 const mk=(x,y,t)=>{cx[n]=x;cy[n]=y;ctr[n]=t;made[t]++;return n++};
 // research topics: lines that walk a grid in eight directions; a grid point two lines visit is an intersection
 const DX=[1,1,0,-1,-1,-1,0,1],DY=[0,1,1,1,0,-1,-1,-1],stopAt=new Map();
 const toward=(x,y,t)=>{let b=0,bd=1e30;for(let d=0;d<8;d++){const q=Math.hypot(x+DX[d]*G-t.cx,y+DY[d]*G-t.cy);if(q<bd){bd=q;b=d}}return b};
 const L=B.L=[],ea=[],eb=[],ek=[],el=[];
 for(const A of T)for(let j=0;j<A.nL;j++){
  const cross=R()<.14;let home=A,x,y,dir,Bt=null,ang=0,jumped=false,px=0,py=0;
  if(cross){const c=A.id%3,r=A.id/3|0,opts=[];if(c>0)opts.push(A.id-1);if(c<2)opts.push(A.id+1);if(r>0)opts.push(A.id-3);if(r<3)opts.push(A.id+3);
   Bt=T[pick(opts)];ang=Math.atan2(Bt.cy-A.cy,Bt.cx-A.cx);const off=(R()-.5)*.5;px=-Math.sin(ang)*off;py=Math.cos(ang)*off;const d0=.45+R()*.2;
   x=A.cx+Math.cos(ang)*A.r*d0+px*A.r;y=A.cy+Math.sin(ang)*A.r*d0+py*A.r;dir=(Math.round(ang/(Math.PI/4))+8)%8}
  else if(A.stops.length&&R()<.8){const c=pick(A.stops);x=cx[c];y=cy[c];dir=ri(8)}
  else{const a=R()*6.28,rr=Math.sqrt(R())*.7*A.r;x=A.cx+Math.cos(a)*rr;y=A.cy+Math.sin(a)*rr;dir=ri(8)}
  x=Math.round(x/G)*G;y=Math.round(y/G)*G;
  const len=8+Math.floor(Math.pow(R(),1.5)*17),stops=[],own=new Set();
  for(let k=0;k<len;k++){
   const key=(x/G)*100000+(y/G);if(own.has(key))break;
   let c=stopAt.get(key);if(c===undefined){c=mk(x,y,home.id);stopAt.set(key,c);home.stops.push(c)}
   own.add(key);stops.push(c);
   if(cross&&!jumped){if(Math.hypot(x-A.cx,y-A.cy)>A.r*.86){x=Math.round((Bt.cx-Math.cos(ang)*Bt.r*.86+px*Bt.r)/G)*G;y=Math.round((Bt.cy-Math.sin(ang)*Bt.r*.86+py*Bt.r)/G)*G;home=Bt;jumped=true;continue}}
   else{if(R()<.28)dir=(dir+(R()<.5?1:7))%8;if(Math.hypot(x+DX[dir]*G-home.cx,y+DY[dir]*G-home.cy)>home.r*.9)dir=toward(x,y,home)}

function search(q){const tk=q.toLowerCase().split(/[^a-z]+/).filter(w=>w.length>1&&!STOP.has(w)).map(w=>w.length>5?w.slice(0,w.length-2):w);if(!tk.length)return null;
 const sc=s=>{let m=0;for(const t of tk)if(s.includes(t))m++;return m},top=(n,arr)=>arr.sort((a,b)=>b[0]-a[0]).slice(0,n);
 const cs=[],low=B.low;for(let c=0;c<B.NC;c++){const m=sc(low[c]);if(m)cs.push([m*10+cres[c]-low[c].length*.02,c])}
 const ls=[];for(const l of L){const m=sc(l.name.toLowerCase());if(m)ls.push([m*10+l.res,l.id])}
 const ws=[];for(const w of W){const m=sc(w.name.toLowerCase());if(m)ws.push([m*10+w.res+w.n*.01,w.id])}
 const ts=[];for(const t of T){const m=sc(t.name.toLowerCase());if(m)ts.push([m,t.id])}
 return{c:top(6,cs),l:top(3,ls),w:top(3,ws),t:ts,n:cs.length}}
let found=null;
$('q').oninput=()=>{const q=$('q').value,el=$('results');found=search(q);$('narrow').hidden=true;$('narrowBtn').setAttribute('aria-expanded',false);
 if(!found||!(found.c.length+found.l.length+found.w.length+found.t.length)){el.hidden=!q.trim();el.innerHTML=q.trim()?'<p class="rh meta">Nothing by that name yet</p>':'';return}
 let h='';if(found.t.length)h+=found.t.map(x=>'<button class="row" data-go="t:'+x[1]+'"><span>'+esc(T[x[1]].name)+'</span><small>Tradition</small></button>').join('');
 if(found.c.length)h+='<p class="rh lab">Concepts · '+fmt(found.n)+'</p>'+found.c.map(x=>'<button class="row" data-go="c:'+x[1]+'"><i class="dot" data-r="'+cres[x[1]]+'" style="--r:'+cres[x[1]]+'"></i><span>'+esc(NM[x[1]])+'</span><small>'+esc(T[ctr[x[1]]].name)+'</small></button>').join('');
 if(found.l.length)h+='<p class="rh lab">Lines</p>'+found.l.map(x=>'<button class="row" data-go="l:'+x[1]+'"><i class="mk" data-k="0" style="--lc:var(--l'+L[x[1]].col+')"></i><span>'+esc(L[x[1]].name)+'</span><small>'+L[x[1]].stops.length+' stops</small></button>').join('');
 if(found.w.length)h+='<p class="rh lab">Works</p>'+found.w.map(x=>'<button class="row" data-go="w:'+x[1]+'"><span>'+esc(W[x[1]].name)+'</span><small>'+W[x[1]].n+' concepts</small></button>').join('');
 el.innerHTML=h;el.hidden=false};
$('askf').onsubmit=e=>{e.preventDefault();const b=$('results').querySelector('[data-go]');if(b)go(b.dataset.go,true)};
$('results').onclick=e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go,true)};
function closeSearch(){$('results').hidden=true;$('q').value='';$('q').blur()}

/* ---------- going places ---------- */
function setMode(m,quiet){if(mode===m)return;mode=m;for(const b of $('mode').children)b.setAttribute('aria-pressed',+b.dataset.m===m);sig='';if(!quiet){cv.classList.add('swap');setTimeout(()=>cv.classList.remove('swap'),140)}}
function go(g,fromSearch){const[k,a,b]=g.split(':'),id=+a;if(fromSearch)closeSearch();
 if(k==='bank'){nar.line=-1;nar.work=-1;setMark();fly(BX,BY,sAll())}
 else if(k==='t'){nar.line=-1;nar.work=-1;setMark();sig='';const A=T[id];fly(A.cx,A.cy,sTrad(A))}
 else if(k==='l'){if(mode)setMode(0);narrowLine(id)}
 else if(k==='w'){if(!mode)setMode(1);const w=W[id];lastWork=id;fly(w.x,w.y,Math.min(fw(1),fh(1))/(2*w.r*1.22),{pulse:true,max:1e3})}
 else if(k==='ch'){const o=layout(id),i=+b;fly(o.X[i],o.Y[i],Math.min(fw(1),fh(1))/(2*o.R[i]*1.3),{max:1e3})}
 else if(k==='wc'){if(!mode)setMode(1);lastWork=id;goConcept(+b,{w:id})}
 else if(k==='c'){if(pathFrom>=0&&pathFrom!==id){setPath(id);return}if(id===focus&&!fromSearch){knotOpen=false;sig='';derive();return}if(!mode&&mark&&!mark[id]){nar.line=-1;nar.work=-1;setMark();sig=''}goConcept(id,{lv:level>1?LV[level]:0})}}
function toggleMode(m){if(m===mode)return;remember();const c=focus,w=focusW,lv=level;setMode(m);
 if(c>=0)goConcept(c,{jump:false,instant:true,lv:LV[lv],w:m?workFor(c):undefined});
 else if(!m&&w>=0){nar.work=w;nar.line=-1;setMark();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(let i=B.wOff[w];i<B.wOff[w+1];i++){const k=B.wConc[i];if(ctr[k]!==W[w].t)continue;x0=Math.min(x0,cx[k]);y0=Math.min(y0,cy[k]);x1=Math.max(x1,cx[k]);y1=Math.max(y1,cy[k])}fitBox(x0-100,y0-100,x1+100,y1+100,{jump:false,instant:true})}
 else{nar.work=-1;if(m)nar.line=-1;setMark();cam.s=Math.min(cam.s,sF()*.9);changed()}}
$('mode').onclick=e=>{const b=e.target.closest('button');if(b)toggleMode(+b.dataset.m)};
$('trail').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.clear)clearNar(b.dataset.clear);else if(b.hasAttribute('aria-current')&&b.dataset.go[0]==='c')return;else go(b.dataset.go)};
$('back').onclick=()=>{const p=backs.pop();if(!p)return;$('back').hidden=!backs.length;setMode(p.m);nar.line=p.line;nar.work=p.work;setMark();sig='';fly(p.x,p.y,p.s,{jump:false,max:1e3})};
$('zin').onclick=()=>fly(cam.x,cam.y,cam.s*1.9,{jump:false});$('zout').onclick=()=>fly(cam.x,cam.y,cam.s/1.9,{jump:false});
panel.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.go){go(d.go);return}if(d.clear){clearNar(d.clear);return}
 if(d.lv){fly(cam.x,cam.y,sF()*LV[+d.lv]*1.03,{jump:false});return}
 if(d.res){const v=+d.res;if(d.id[0]==='l'){L[+d.id.slice(1)].res=v}else{cres[+d.id]=v;myRes[d.id]=v;restar()}pulses.push({sx:ax,sy:ay,t:performance.now()});sig='';changed();return}
 const slot=$('slot');
 if(d.act==='respond')slot.innerHTML='<p class="lab" style="margin-top:20px">Your response</p><textarea id="resp" aria-label="Your response" style="margin-top:8px"></textarea><div class="acts" style="margin-top:10px"><button class="btn main" data-act="keep">Keep</button></div>',$('resp').focus();
 else if(d.act==='keep'){const c=focus;cres[c]=Math.min(5,cres[c]+1);myRes[c]=cres[c];restar();slot.innerHTML='<p class="good" style="margin-top:14px">Kept. It shines a little brighter.</p>';dirty=true;kick()}
 else if(d.act==='addline'){const ls=new Set();for(let i=off[focus];i<off[focus+1];i++){const n=adj[i];for(let j=off[n];j<off[n+1];j++)if(al[j]>=0)ls.add(al[j])}
  slot.innerHTML='<div class="kin">'+[...ls].slice(0,3).map(l=>'<button class="go" data-act="added"><i class="mk" data-k="0" style="--lc:var(--l'+L[l].col+')"></i><span>'+esc(L[l].name)+'</span></button>').join('')+'<button class="go" data-act="added"><span>A new line</span></button></div>'}
 else if(d.act==='voice'){const k=d.sec;b.outerHTML='<form class="vf" data-sec="'+k+'"><input class="field" id="voice'+k+'" aria-label="Your voice" placeholder="Say or type it"><button class="btn main">Keep</button></form>';$('voice'+k).focus()}
 else if(d.act==='added')slot.innerHTML='<p class="good" style="margin-top:14px">Added to '+esc(b.textContent)+'</p>';
 else if(d.act==='question')b.outerHTML='<p class="good">Kept as a question</p>';
 else if(d.act==='pathfrom'){path=null;pathMark=null;pathFrom=pathFrom===focus?-1:focus;sig='';if(pathFrom>=0)fly(cam.x,cam.y,cam.s*.45,{jump:false});else changed()}
 else if(d.act==='pathclear'){path=null;pathMark=null;pathFrom=-1;sig='';changed()}
 else if(d.act==='toworks')toggleMode(1);else if(d.act==='tomap')toggleMode(0);else if(d.act==='workonmap')toggleMode(0);
 else if(d.act==='knot'){knotOpen=true;sig='';derive()}else if(d.act==='knotclose'){knotOpen=false;sig='';derive()}
 measure()};

panel.addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=f.querySelector('input').value.trim();if(!v||!f.dataset.sec)return;const k=focus+':'+f.dataset.sec;voices.set(k,(voices.get(k)||[]).concat(v));renderPanel()});
/* ---------- touch: drag, pinch, wheel, momentum, and an answer to every tap ---------- */
const pts=new Map();let moved=0,downT=0,lastTap=0,samples=[],pinch=0;
function ptDown(e){if(e.target===cv)cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});anim=null;vel=null;if(pts.size===1){moved=0;downT=e.timeStamp;samples=[]}else pinch=0;$('results').hidden=true;if(document.activeElement===$('q'))$('q').blur()}
function ptMove(e){const p=pts.get(e.pointerId);if(!p)return;const r=cv.getBoundingClientRect(),dx=e.clientX-p.x,dy=e.clientY-p.y;
 if(pts.size===1&&e.target===cv){moved+=Math.abs(dx)+Math.abs(dy);cam.x-=dx/cam.s;cam.y-=dy/cam.s;samples.push([e.timeStamp,dx,dy]);if(samples.length>6)samples.shift();p.x=e.clientX;p.y=e.clientY;changed()}
 else if(pts.size===2){p.x=e.clientX;p.y=e.clientY;const[a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;moved=99;
  if(pinch){if(e.target===cv){cam.x-=(mx-pinch.mx)/cam.s;cam.y-=(my-pinch.my)/cam.s;zoomAt(mx,my,d/pinch.d)}else zoomAt(ax,ay,d/pinch.d)}pinch={d,mx,my}}}
function ptUp(e){const p=pts.get(e.pointerId);if(!p)return;const n=pts.size;pts.delete(e.pointerId);pinch=0;if(n!==1||e.target!==cv)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 if(moved<9&&e.timeStamp-downT<400){if(e.timeStamp-lastTap<300){lastTap=0;anim=null;const wx=cam.x+(x-ax)/cam.s,wy=cam.y+(y-ay)/cam.s;fly(wx,wy,cam.s*2.4,{jump:false})}else{lastTap=e.timeStamp;tap(x,y)}return}
 const rec=samples.filter(s=>e.timeStamp-s[0]<90);if(rec.length>1&&!reduced){let vx=0,vy=0;for(const s of rec){vx+=s[1];vy+=s[2]}const dt=Math.max(16,rec[rec.length-1][0]-rec[0][0]+8);vel={x:vx/dt*16,y:vy/dt*16};kick()}}
cv.addEventListener('pointerdown',ptDown);cv.addEventListener('pointermove',ptMove);cv.addEventListener('pointerup',ptUp);cv.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);pinch=0});
panel.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){pts.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch=0}});panel.addEventListener('pointermove',e=>{if(pts.size===2)ptMove(e)});for(const t of['pointerup','pointercancel','pointerleave'])panel.addEventListener(t,e=>{pts.delete(e.pointerId);pinch=0});
stage.addEventListener('wheel',e=>{if(e.target!==cv)return;e.preventDefault();anim=null;vel=null;const r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*(e.ctrlKey?.012:.0016)))},{passive:false});
addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;const k=e.key,st=80/cam.s;if(k==='+'||k==='=')$('zin').click();else if(k==='-')$('zout').click();else if(k==='ArrowLeft'){cam.x-=st;changed()}else if(k==='ArrowRight'){cam.x+=st;changed()}else if(k==='ArrowUp'){cam.y-=st;changed()}else if(k==='ArrowDown'){cam.y+=st;changed()}
 else if(k==='Escape'){const b=$('trail').querySelectorAll('button[data-go]');if(b.length>1)b[b.length-2].click()}});
function tap(x,y){pulses.push({sx:x,sy:y,t:performance.now()});kick();const wx=cam.x+(x-ax)/cam.s,wy=cam.y+(y-ay)/cam.s,s=cam.s;
 for(const h of edgeHits)if(Math.abs(h.x-x)<70&&Math.abs(h.y-y)<16){if(h.w!==undefined)go('w:'+h.w);else go('c:'+h.c);return}
 if(knotAt&&Math.hypot(knotAt.x-x,knotAt.y-y)<20){knotOpen=true;sig='';derive();return}
 if(mode){let b=null,bd=24*24;for(const h of hits){const d=(h.x-x)**2+(h.y-y)**2;if(d<bd){bd=d;b=h}}if(b){lastWork=b.w;go('wc:'+b.w+':'+b.c);return}
  for(const i of seenW){const w=W[i];if(Math.hypot(w.x-wx,w.y-wy)<Math.max(w.r,10/s)){if(w.r*s<Math.min(Wd-padR,Hd-padB)*.3){go('w:'+i);return}
    const o=layout(i);for(let k=0;k<o.R.length;k++)if(Math.hypot(o.X[k]-wx,o.Y[k]-wy)<o.R[k]&&o.R[k]*s<Math.min(Wd-padR,Hd-padB)*.3){go('ch:'+i+':'+k);return}return}}}
 else{if(s>.2){let b=-1,bd=24*24;for(let i=0;i<nv;i++){const c=vis[i],d=(sx(cx[c])-x)**2+(sy(cy[c])-y)**2;if(d<bd&&(cpar[c]<0||s>.5)){bd=d;b=c}}if(b>=0){go('c:'+b);return}}
  if(s>sAll()*2.4){let b=-1,bd=14/s;for(const l of L){const q=l.box;if(wx<q[0]-bd||wx>q[2]+bd||wy<q[1]-bd||wy>q[3]+bd)continue;for(let k=1;k<l.stops.length;k++){const a=l.stops[k-1],c=l.stops[k],d=segD(wx,wy,cx[a],cy[a],cx[c],cy[c]);if(d<bd){bd=d;b=l.id}}}
   if(b>=0){if(nar.line===b){fly(wx,wy,Math.max(s*2,.5),{jump:false})}else narrowLine(b);return}}}
 const A=tradAt(wx,wy);if(A&&s<sTrad(A)*.7)go('t:'+A.id)}
function segD(px,py,ax_,ay_,bx,by){const dx=bx-ax_,dy=by-ay_,t=clamp(((px-ax_)*dx+(py-ay_)*dy)/(dx*dx+dy*dy||1),0,1);return Math.hypot(px-ax_-dx*t,py-ay_-dy*t)}

/* ---------- size, start ---------- */
function measure(){const wd=wide(),nb=panel.hidden||wd?0:panel.offsetHeight,nr=!panel.hidden&&wd?420:0;if(nb!==padB||nr!==padR){padB=nb;padR=nr;ax=(Wd-padR)/2;ay=(Hd-padB)/2;dirty=true;kick()}
 $('back').style.bottom=(padB+14)+'px'}
function resize(){const r=stage.getBoundingClientRect();Wd=r.width;Hd=r.height;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(Wd*dpr);cv.height=Math.round(Hd*dpr);ax=(Wd-padR)/2;ay=(Hd-padB)/2;measure();changed()}
for(const t of T){const p=new Path2D();for(let k=0;k<=48;k++){const a=k/48*6.2832,r=t.r*(1.05+.035*Math.sin(a*3+t.ph)+.025*Math.sin(a*5+t.ph2));k?p.lineTo(t.cx+Math.cos(a)*r,t.cy+Math.sin(a)*r):p.moveTo(t.cx+Math.cos(a)*r,t.cy+Math.sin(a)*r)}p.closePath();t.path=p}
for(const l of L){const p=new Path2D();l.stops.forEach((c,k)=>{if(!k||k-1===l.gap)p.moveTo(cx[c],cy[c]);else p.lineTo(cx[c],cy[c])});l.path=p;if(l.gap>=0){const g=new Path2D();g.moveTo(cx[l.stops[l.gap]],cy[l.stops[l.gap]]);g.lineTo(cx[l.stops[l.gap+1]],cy[l.stops[l.gap+1]]);l.gapPath=g}}
new ResizeObserver(measure).observe(panel);addEventListener('resize',resize);
new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);
shape();theme();
{const r=stage.getBoundingClientRect();Wd=r.width;Hd=r.height;ax=Wd/2;ay=Hd/2}
if(saved.s){if(saved.m)setMode(1,true);cam.x=saved.x;cam.y=saved.y;cam.s=saved.s;if(saved.line>=0&&saved.line<L.length){nar.line=saved.line;setMark()}}
else{let b=B.isect[0];for(const c of B.isect)if(nLines[c]*10+cres[c]>nLines[b]*10+cres[b])b=c;cam.x=cx[b];cam.y=cy[b];cam.s=.95}
resize();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw.now);
</script>
