let tq=0,focus={name:'the whole bank',id:null,w:null};
function queueTrail(){if(!tq)tq=requestAnimationFrame(()=>{tq=0;const el=document.elementFromPoint(vw/2,TOP+(vh-TOP)*.3),wk=el&&el.closest&&el.closest('.work'),tp=el&&el.closest&&el.closest('.tp.open');
 const parts=[['Everything','far']];if(wk&&s>=.45)parts.push([W[wk.dataset.w].t,'w:'+wk.dataset.w]);if(tp&&s>=.7)parts.push([T[tp.dataset.id].n,'t:'+tp.dataset.key]);
 focus=tp&&s>=.7?{name:T[tp.dataset.id].n,id:tp.dataset.id,key:tp.dataset.key}:wk&&s>=.45?{name:W[wk.dataset.w].t,w:wk.dataset.w}:{name:'the whole bank'};
 const h=parts.map(([t,k])=>`<button data-tr="${k}">${esc(t)}</button>`).join('<span>›</span>')+(parts.length===1?`<em>${WORKS.length} works · ${TOTAL} topics · Sample</em>`:'');
 if($('#trail').dataset.h!==h){$('#trail').dataset.h=h;$('#trail').innerHTML=h}})}
$('#trail').addEventListener('click',e=>{const k=e.target.closest('button')?.dataset.tr;if(!k)return;if(k==='far')far();else flyTo(world.querySelector(k[0]==='w'?`[data-w="${k.slice(2)}"]`:`[data-key="${k.slice(2)}"]`))});

/* ---------- lights ---------- */
function applyLight(){world.querySelectorAll('.work').forEach(el=>{const w=W[el.dataset.w];let on=true;
  if(light){if(light.t==='s')on=w.s.includes(light.v);else on=w.ids.some(id=>lit(id))}el.classList.toggle('dimw',!on)});
 world.querySelectorAll('.tp').forEach(el=>{const l=light&&light.t!=='s';el.classList.toggle('hit',!!l&&lit(el.dataset.id)&&!el.hasAttribute('data-lm'));el.classList.toggle('dimt',!!l&&!lit(el.dataset.id)&&!el.hasAttribute('data-lm'))})}
const lit=id=>light.t==='k'?T[id].k===light.v:light.t==='r'?res(id)>=4:light.t==='q'?light.ids.has(id):true;
const lightName=()=>!light?'Light':'Light: '+(light.t==='s'?COLS[light.v]:light.t==='k'?KIND[light.v]:light.t==='r'?'what resonates most':'"'+light.q+'"');
function lightPanel(){const it=(t,v,l)=>`<button class="it" data-l="${t}:${v}" aria-pressed="${!!light&&light.t===t&&String(light.v)===String(v)}">${l}</button>`;
 $('#lightp').innerHTML=`<button class="it" data-l="off" aria-pressed="${!light}">Everything, evenly</button><p class="lab">A subject</p>`+COLS.map((c,i)=>it('s',i,c)).join('')+'<p class="lab">A kind</p>'+Object.keys(KIND).map(k=>it('k',k,KIND[k])).join('')+'<p class="lab">Yours</p>'+it('r',1,'What resonates most')}
function closePanels(){for(const[p,b]of[['#lightp','#lightb'],['#micp','#micb']]){$(p).hidden=true;$(b).setAttribute('aria-expanded','false')}}
$('#lightb').addEventListener('click',()=>{const open=$('#lightp').hidden;closePanels();if(open){lightPanel();$('#lightp').hidden=false;$('#lightb').setAttribute('aria-expanded','true')}});
$('#lightp').addEventListener('click',e=>{const l=e.target.closest('button')?.dataset.l;if(!l)return;if(l==='off')light=null;else{const[t,v]=l.split(':');light={t,v:t==='s'?+v:v}}applyLight();$('#lightb').textContent=lightName();closePanels()});

/* ---------- voice, notes and expressing, from wherever he is ---------- */
function micPanel(msg){$('#micp').innerHTML=`<p class="lab">On ${esc(focus.name)}</p><form id="sayf"><input id="sayi" placeholder="Say or type it" aria-label="Say or type it" autocomplete="off"></form>
 <div class="two"><button data-do="note">Keep as my note here</button><button data-do="gather">Gather what the bank holds on this</button></div>${msg?`<p class="lab" style="margin-bottom:8px">${msg}</p>`:''}
 ${NOTES.length?'<p class="lab">All your notes</p>'+NOTES.map((n,i)=>`<button class="note" data-n="${i}">${esc(n.t)}<small>On ${esc(n.on)} · 11 November</small></button>`).join(''):''}`}
$('#micb').addEventListener('click',()=>{const open=$('#micp').hidden;closePanels();if(open){micPanel();$('#micp').hidden=false;$('#micb').setAttribute('aria-expanded','true')}});
$('#micp').addEventListener('submit',e=>e.preventDefault());
$('#micp').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const v=$('#sayi').value.trim();
 if(b.dataset.n!=null){const n=NOTES[+b.dataset.n];closePanels();if(n.key){const[w,id]=n.key.split(':');w==='lm'?flyTo(world.querySelector(`[data-key="${n.key}"]`)):go(w,id)}else if(n.w)flyTo(world.querySelector(`[data-w="${n.w}"]`));return}
 if(!v){$('#sayi').focus();return}
 if(b.dataset.do==='note'){NOTES.unshift({t:v,on:focus.name,id:focus.id,key:focus.key,w:focus.w});if(focus.key){const tp=world.querySelector(`[data-key="${focus.key}"]`);if(tp)redraw(tp)}micPanel('Kept.')}
 else{const words=v.toLowerCase().split(/[^a-z']+/).filter(w=>w.length>3),ids=new Set(Object.values(T).filter(t=>words.some(w=>(t.n+' '+t.d).toLowerCase().includes(w))).map(t=>t.id));
  if(!ids.size){micPanel('Nothing in this sample uses those words. The real bank would match by meaning.');return}
  light={t:'q',q:v,ids};applyLight();$('#lightb').textContent=lightName();closePanels();far()}});

function size(){vw=innerWidth;vh=innerHeight;document.documentElement.style.setProperty('--cw',Math.max(280,Math.min(400,vw-32))+'px')}
size();s=fitS();x=(vw-world.offsetWidth*s)/2;y=TOP;clamp();apply();
addEventListener('resize',()=>{size();clamp();apply();drawTies()});
</script>
