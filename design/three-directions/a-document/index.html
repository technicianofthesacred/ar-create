<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Create — The Document</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#141310;--paper:#1d1b16;--ink:#e7e1d3;--dim:#a39e8e;--line:#2d2a23;--warm:#c9a874;--rail:#191813;--lift:#191813;--sel:#2c2a22;--good:#8fb08a;--warnc:#d9a95a;--bad:#e08a74;--scrim:rgba(8,7,5,.55);--hl:rgba(201,168,116,.22);--prot:rgba(143,176,138,.16)}
[data-theme=light]{--bg:#efede6;--paper:#fffefb;--ink:#2d302a;--dim:#686c61;--line:#e2e0d8;--warm:#7a5a30;--rail:#f7f5ef;--lift:#f7f5ef;--sel:#e9e4d7;--good:#3f6146;--warnc:#94600f;--bad:#a23b2a;--scrim:rgba(40,38,30,.32);--hl:rgba(122,90,48,.16);--prot:rgba(63,97,70,.12)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font:14px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--warm);outline-offset:2px;border-radius:4px}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--warm) 45%,transparent) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--warm) 45%,transparent);border-radius:8px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dim{color:var(--dim)}
.tag{font-size:11px;letter-spacing:.02em;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--dim);white-space:nowrap}
.tag.warm{color:var(--warm);border-color:color-mix(in srgb,var(--warm) 40%,transparent)}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:6px;color:var(--dim);font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sel);color:var(--ink)}
.btn.solid{background:var(--sel);color:var(--ink)}
.btn.solid:hover{background:color-mix(in srgb,var(--warm) 22%,var(--sel))}
.honest{font-size:12px;color:var(--warnc);display:inline-flex;align-items:center;gap:6px}

/* ---------- top line ---------- */
#top{height:44px;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid var(--line);background:var(--rail);position:relative;z-index:30}
#menuBtn{display:none}
#projBtn{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:6px;min-width:0;max-width:280px;font-weight:600;font-size:14px}
#projBtn:hover{background:var(--sel)}
#projBtn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#projBtn kbd{font:11px "Plus Jakarta Sans";color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
#pieces{display:flex;align-items:center;gap:2px;min-width:0}
#pieces .from{font-size:12px;color:var(--dim);margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptab{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:6px;color:var(--dim);font-size:13px;font-weight:500;white-space:nowrap}
.ptab:hover{color:var(--ink);background:var(--sel)}
.ptab[aria-selected=true]{color:var(--ink);background:var(--sel);box-shadow:inset 0 -2px 0 var(--warm)}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{height:28px;padding:0 10px;font-size:12px;font-weight:500;color:var(--dim)}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--ink)}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:6px;color:var(--dim)}
.icon-btn:hover{background:var(--sel);color:var(--ink)}

/* ---------- frame ---------- */
#frame{display:grid;grid-template-columns:232px minmax(0,1fr) 336px;height:calc(100vh - 44px);height:calc(100dvh - 44px)}
body.rail-collapsed #frame{grid-template-columns:44px minmax(0,1fr) 336px}
body.focus #frame{grid-template-columns:232px minmax(0,1fr) 0}
body.focus.rail-collapsed #frame{grid-template-columns:44px minmax(0,1fr) 0}
body.home #frame,body.home.focus #frame,body.home.rail-collapsed #frame{grid-template-columns:minmax(0,1fr)}
body.home #wordsBtn,body.home #marginSeg,body.home #focusBtn{visibility:hidden}

/* rail */
#rail{background:var(--rail);border-right:1px solid var(--line);overflow:auto;padding:10px 8px 24px;min-width:0}
body.home #rail{display:none}
.rail-h{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:6px 8px 4px}
.rail-h .icon-btn{width:26px;height:26px}
body.rail-collapsed #rail .rail-body{display:none}
body.rail-collapsed #rail .rail-h span{display:none}
.ol a,.sec a{display:flex;align-items:baseline;gap:8px;padding:5px 8px;border-radius:6px;color:var(--dim);text-decoration:none;font-size:13px;cursor:pointer}
.ol a:hover,.sec a:hover{background:var(--sel);color:var(--ink)}
.ol a.lo{color:var(--warm)}
.sec{margin-top:14px}
.sec .g{font-size:11px;color:var(--dim);padding:8px 8px 2px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.sec a .n{font-variant-numeric:tabular-nums;font-size:11px;opacity:.7;width:16px}
.sec a.on{color:var(--ink);background:var(--sel)}
.rail-foot{display:none}

/* document */
#docScroll{overflow:auto;position:relative;background:var(--bg)}
#page{max-width:740px;margin:0 auto;padding:48px 20px 40vh}
.doc-meta{font-size:12px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.doc h1{font-size:32px;line-height:1.2;font-weight:600;margin:0 0 6px;letter-spacing:-.01em;outline:none}
.doc .dek{font-size:17px;color:var(--dim);margin:0 0 34px;outline:none}
.doc h2{font-size:20px;font-weight:600;margin:40px 0 10px;outline:none}
.doc p{font:16.5px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0 0 18px;outline:none}
.doc [contenteditable]:focus{outline:none}
.doc .body{outline:none}
.anc{border-radius:3px;transition:background .2s;cursor:pointer;box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--warm) 45%,transparent)}
.anc.lit{background:var(--hl);box-shadow:inset 0 -2px 0 var(--warm)}
body.focus .anc,body.reading .anc{box-shadow:none;cursor:auto}
.prot{border-radius:3px}
body.show-prot .prot{background:var(--prot);box-shadow:inset 0 -2px 0 var(--good)}
.leftoff{display:flex;align-items:center;gap:10px;margin:0 -12px 14px;padding:8px 12px;border-left:2px solid var(--warm);background:color-mix(in srgb,var(--warm) 8%,transparent);font:13px/1.4 "Plus Jakarta Sans",sans-serif;color:var(--ink);user-select:none;border-radius:0 6px 6px 0}
.leftoff b{font-weight:600;color:var(--warm)}
.leftoff .x{margin-left:auto}
body.reading .leftoff{display:none}
.reading-bar{display:none;font-size:12px;color:var(--dim);margin-bottom:18px;align-items:center;gap:8px}
body.reading .reading-bar{display:flex}
body.reading .doc p{font-size:18px}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--hl)}100%{background:transparent}}

/* carousel */
.strip{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:6px}
.slide{position:relative;width:min(420px,100%);aspect-ratio:4/5;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:26px 26px 22px;display:flex;flex-direction:column;gap:10px}
.slide.dark{background:#0f0e0c;color:#e7e1d3}
[data-theme=light] .slide.dark{background:#2d302a;color:#f4f1ea}
.slide .no{position:absolute;top:10px;left:12px;font-size:11px;color:var(--dim)}
.slide .handle{position:absolute;top:6px;right:6px;width:32px;height:32px;display:grid;place-items:center;color:var(--dim);cursor:grab;touch-action:none;border-radius:6px}
.slide .handle:hover{background:var(--sel)}
.slide .hd{font-size:26px;line-height:1.15;font-weight:600;margin-top:auto;outline:none}
.slide .tx{font:16px/1.5 system-ui,sans-serif;color:inherit;opacity:.85;outline:none}
.slide .ph{flex:1;min-height:90px;border-radius:6px;background:var(--sel);display:grid;place-items:center;color:var(--dim);font-size:12px;text-align:center}
.slide.lit{box-shadow:0 0 0 2px var(--warm)}
.dragging{opacity:.55}
.drop-hint{font-size:12px;color:var(--dim);text-align:center;margin:0 0 10px}

/* listing */
.listing .price{font-size:18px;font-weight:600;margin:0 0 20px}
.listing dl{display:grid;grid-template-columns:130px 1fr;gap:8px 16px;font-size:15px;margin:0 0 20px}
.listing dt{color:var(--dim)}
.listing dd{margin:0;outline:none}

/* margin */
#margin{border-left:1px solid var(--line);background:var(--rail);display:flex;flex-direction:column;min-width:0;overflow:hidden}
body.focus #margin,body.home #margin,body.reading #margin{display:none}
#mHead{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line)}
#mHead .grab{display:none}
.mtab{height:30px;padding:0 10px;border-radius:6px;color:var(--dim);font-size:13px;font-weight:500}
.mtab[aria-selected=true]{color:var(--ink);background:var(--sel)}
.mtab .ct{font-size:11px;opacity:.7;margin-left:4px}
#mBody{overflow:auto;padding:10px 12px 40px;flex:1}
.since{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.since .t{flex:1}
.since a{color:var(--warm);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.note{border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;border:1px solid transparent}
.note:hover{background:var(--sel)}
.note.on{border-color:color-mix(in srgb,var(--warm) 55%,transparent);background:var(--sel)}
.note .who{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);margin-bottom:4px}
.note .who b{font-weight:600;color:var(--ink)}
.note .q{font-size:12px;color:var(--dim);border-left:2px solid var(--line);padding-left:8px;margin:4px 0 6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.note .tx{font-size:13.5px}
.note.mine{border-left:3px solid var(--warm);border-radius:2px 8px 8px 2px;background:color-mix(in srgb,var(--warm) 6%,transparent)}
.note.mine .tx{font-family:Lora,Georgia,serif;font-size:14.5px}
.note.machine .tx{color:color-mix(in srgb,var(--ink) 82%,var(--dim))}
.note.new{animation:flash 2.4s ease}
.mh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:16px 2px 8px;display:flex;align-items:center;justify-content:space-between}
.mh:first-child{margin-top:4px}
.dec{font-size:13.5px;padding:7px 8px;border-radius:6px}
.dec .by{font-size:11.5px;color:var(--dim)}
.dec.rej .w{text-decoration:line-through;color:var(--dim)}
.dec.pp .w{font-family:Lora,serif;background:var(--prot);box-shadow:inset 0 -2px 0 var(--good);border-radius:2px}
.dec.cor .from{text-decoration:line-through;color:var(--dim)}
.srcq{padding:10px 12px;border-radius:8px;margin-bottom:8px;border:1px solid var(--line)}
.srcq blockquote{margin:0 0 6px;font:14.5px/1.5 Lora,Georgia,serif}
.srcq .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:11.5px;color:var(--dim);align-items:center}
.srcq .meta a{color:var(--warm);cursor:pointer}
.composer{border:1px solid color-mix(in srgb,var(--warm) 50%,transparent);border-radius:8px;padding:10px;margin-bottom:12px;background:var(--paper)}
.composer textarea{width:100%;min-height:80px;resize:vertical;background:transparent;border:0;outline:none;font:14.5px/1.5 Lora,Georgia,serif}
.composer .row{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.empty{font-size:13px;color:var(--dim);padding:10px 4px}
.empty b{color:var(--ink);font-weight:500}

/* floating your-words */
#selBtn{position:fixed;z-index:40;display:none;background:var(--paper);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.35);color:var(--ink)}
#selBtn.show{display:inline-flex}

/* home */
#home{display:none;max-width:820px;margin:0 auto;padding:48px 20px 80px}
body.home #home{display:block}
body.home #page{display:none}
#home h1{font-size:26px;font-weight:600;margin:0 0 4px}
.hrow{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:16px 12px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.hrow:hover{background:var(--sel)}
.hrow .nm{font-size:16px;font-weight:600}
.hrow .lo{font-size:13.5px;color:var(--ink)}
.hrow .lo em{font-style:normal;color:var(--warm)}
.hrow .ps{font-size:12px;color:var(--dim)}
.hrow .when{font-size:12px;color:var(--dim);text-align:right}

/* palette */
#palWrap{position:fixed;inset:0;z-index:60;background:var(--scrim);display:none;align-items:flex-start;justify-content:center;padding-top:9vh}
#palWrap.open{display:flex}
#pal{width:min(640px,calc(100vw - 24px));background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.45);overflow:hidden}
#palIn{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 16px;font-size:16px;outline:none}
#palList{max-height:60vh;overflow:auto;padding:6px}
.pi{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 10px;border-radius:8px;cursor:pointer}
.pi[aria-selected=true]{background:var(--sel)}
.pi .nm{font-weight:600}
.pi .lo{font-size:12.5px;color:var(--dim)}
.pi .ps{font-size:12px;color:var(--dim);grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.pi .w{font-size:12px;color:var(--dim)}
.pgroup{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:10px 10px 4px}

/* sheet */
#scrim{position:fixed;left:0;right:0;bottom:0;top:44px;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .22s;z-index:45}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;top:44px;bottom:0;width:min(1000px,94vw);background:var(--bg);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .26s ease;z-index:50;display:flex;flex-direction:column}
#sheet.open{transform:none;box-shadow:24px 0 60px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){#sheet,#scrim{transition:none}}
#shHead{display:flex;align-items:flex-start;gap:12px;padding:18px 22px 14px;border-bottom:1px solid var(--line)}
#shHead .g{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
#shHead h2{margin:2px 0 2px;font-size:22px;font-weight:600}
#shHead p{margin:0;color:var(--dim);font-size:13.5px}
#shBody{overflow:auto;padding:18px 22px 60px;flex:1}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--paper)}
.box h3{margin:0 0 8px;font-size:14px;font-weight:600}
.drop{border:1.5px dashed color-mix(in srgb,var(--warm) 45%,var(--line));border-radius:10px;padding:22px;text-align:center;color:var(--dim);margin-bottom:16px}
.drop.over{background:var(--hl);color:var(--ink)}
.topics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.topic{border:1px solid var(--line);border-radius:10px;padding:8px;min-height:120px;background:var(--lift)}
.topic.over{border-color:var(--warm)}
.topic h4{margin:2px 4px 8px;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between}
.mat{display:flex;gap:8px;align-items:center;padding:7px;border-radius:7px;background:var(--paper);border:1px solid var(--line);margin-bottom:6px;font-size:12.5px;cursor:grab;touch-action:none;user-select:none}
.mat .th{width:34px;height:34px;border-radius:5px;background:var(--sel);display:grid;place-items:center;color:var(--dim);flex:none}
.mat .t{min-width:0}
.mat .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat.pick{outline:2px solid var(--warm)}
.preview{min-height:120px}
.line{display:grid;grid-template-columns:64px 70px 1fr;gap:10px;padding:8px 8px;border-radius:6px;cursor:text}
.line:hover{background:var(--sel)}
.line .ts{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.line .sp{font-size:12.5px;font-weight:600}
.line .tx{font:15px/1.55 Lora,Georgia,serif}
.line .was{text-decoration:line-through;color:var(--dim);font-size:13px;display:block}
.line.lit{background:var(--hl)}
.line textarea{width:100%;font:15px/1.55 Lora,Georgia,serif;background:var(--paper);border:1px solid var(--warm);border-radius:6px;padding:6px 8px;resize:vertical}
.player{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;background:var(--paper)}
.player .bar{flex:1;height:4px;background:var(--line);border-radius:2px}
.plist a{display:block;padding:9px 10px;border-radius:7px;cursor:pointer}
.plist a:hover{background:var(--sel)}
.plist a.on{background:var(--sel);box-shadow:inset 2px 0 0 var(--warm)}
.plist .u{font-size:11.5px}
.u-sure{color:var(--good)}.u-unsure{color:var(--warnc)}.u-disputed{color:var(--bad)}
.ev{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:0 0 12px}
.ev blockquote{margin:0 0 4px;font:15px/1.55 Lora,Georgia,serif}
.ev .m{font-size:12px;color:var(--dim)}
.thread .msg{padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:13.5px}
.thread .msg.me{background:color-mix(in srgb,var(--warm) 8%,transparent);border-left:3px solid var(--warm);font-family:Lora,serif}
.thread .msg.sys{color:var(--warnc);font-size:12.5px}
.inrow{display:flex;gap:8px;margin-top:8px}
.inrow input{flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:0 10px}
.mine-box textarea{width:100%;min-height:150px;border:1px solid color-mix(in srgb,var(--warm) 50%,var(--line));border-radius:8px;background:var(--paper);padding:12px 14px;font:16px/1.6 Lora,Georgia,serif;resize:vertical}
.prov{border:1px dashed var(--line);border-radius:10px;padding:14px;margin-top:18px}
.prov p{color:color-mix(in srgb,var(--ink) 80%,var(--dim));margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.asset{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.asset .pic{aspect-ratio:4/3;background:var(--sel);display:grid;place-items:center;color:var(--dim);position:relative}
.asset .pic .dur{position:absolute;right:8px;bottom:8px;font-size:11px;background:var(--bg);padding:1px 6px;border-radius:4px}
.asset .cap{padding:10px 12px;font-size:13px}
.asset .used{font-size:12px;color:var(--dim);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 8px}
.asset .used a{color:var(--warm);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.arr{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--paper);user-select:none}
.arr .handle{cursor:grab;touch-action:none;color:var(--dim);width:32px;height:32px;display:grid;place-items:center;border-radius:6px}
.arr .handle:hover{background:var(--sel)}
.arr .x{font-size:12px;color:var(--dim);margin-left:auto}
.frames{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.phone{width:340px;max-width:100%;border:1px solid var(--line);border-radius:22px;padding:14px;background:var(--paper)}
.phone .scr{height:560px;overflow:auto;border-radius:12px;background:var(--bg);padding:18px 16px}
.webf{flex:1;min-width:280px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.webf .bar{height:30px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 10px;font-size:11.5px;color:var(--dim)}
.webf .scr{height:560px;overflow:auto;padding:28px 34px}
.rv h1{font-size:24px;margin:0 0 6px}.rv h2{font-size:18px;margin:24px 0 6px}.rv p{font:16px/1.65 system-ui,sans-serif;margin:0 0 14px}

 <div class="reading-bar">${ic('doc')} Reading view — nothing here is editable. <button class="btn" data-go-write>Back to writing</button></div>
 <div class="doc-meta"><span class="tag warm">Article</span><span>from Conversation with Mei Lin · 14 Oct</span><span id="wc"></span></div>
 <h1 contenteditable="true" spellcheck="true">Porcelain and Tea</h1>
 <p class="dek" contenteditable="true">A restorer in a room above a hardware shop, and the cups people carry up her stairs.</p>
 <div class="body" contenteditable="true" spellcheck="true">
 <section data-block data-title="The workshop" id="sec1"><h2>The workshop</h2>
 <p data-p="1">Mei Lin’s workshop is one room above a hardware shop, and most of the room is a table. On the table there is a lamp with a green shade, a bow drill strung with fishing line, and a shallow tray of broken cups that people have carried up the stairs wrapped in newspaper.</p>
 <p data-p="2"><span class="anc" data-a="a1">She started mending porcelain in 1998</span>, after three years cleaning kilns in Jingdezhen. “I was not good at making,” she says. “I was good at looking at what was already made.”</p></section>
 <section data-block data-title="Riveting" id="sec2"><h2>Riveting</h2>
 <p data-p="3">The method is old and plain. She fits the pieces dry, marks both sides of each crack, and drills shallow holes that never pass through the wall of the cup. Then she bends <span class="prot">a staple of brass, warm from the hand</span>, and taps it home so it pulls the two edges together.</p>
 <p data-p="4"><span class="anc" data-a="a2">A cup takes a day if it broke cleanly and a week if it didn’t.</span> She doesn’t hurry the second kind. The drill moves maybe a millimetre a minute through glaze.</p>
 <p data-p="5"><span class="anc" data-a="a3">It is slow work, and it cannot be rushed, because the porcelain decides how fast it goes.</span></p></section>
 <section data-block data-title="What the crack keeps" id="sec3"><h2>What the crack keeps</h2>
 <p data-p="6">Most of the cups that come to her are not valuable. They are the cup a grandfather drank from, the one a child knocked off a shelf, the one that went through a move. People don’t want them to look new. “They want to know it happened,” Mei says, “and that it is finished happening.”</p>
 <p data-p="7">She turns a mended cup under the lamp so the staples catch the light. <span class="prot">The crack is part of the cup now.</span></p></section>
 <section data-block data-title="Tea in a mended cup" id="sec4"><h2>Tea in a mended cup</h2>
 <div class="leftoff" contenteditable="false" id="leftoff"><span><b>Left off here</b> · 2 days ago — next: tighten the ending</span><button class="icon-btn x" aria-label="Dismiss left-off marker">${ic('x',14)}</button></div>
 <p data-p="8"><span class="anc" data-a="a4">A riveted cup holds tea again, and it holds it differently, and there is something about that which is hard to say but we feel it when we drink, a kind of continuity, a sense of the past still being present in the hands.</span></p>
 <p data-p="9"><span class="anc" data-a="a5">Mei pours a thin oolong</span> into the cup with four staples and passes it across the table. It does not leak. It is warm all the way around except where the brass is, which is a little warmer.</p></section>
 </div>`;

}

function getPieceEl(){
 const key=S.project+':'+S.piece;
 if(!pieceEls[key]){
  const p=proj();
  pieceEls[key]=!p.full?genericEl(p,S.piece):S.piece==='article'?articleEl():S.piece==='carousel'?carouselEl():listingEl();
  wirePiece(pieceEls[key]);
 }
 return pieceEls[key];
}
function wirePiece(el){
 el.addEventListener('click',e=>{
  const x=e.target.closest('.leftoff .x');if(x){x.closest('.leftoff').remove();S.leftOffShown=false;renderOutline();return;}
  if(e.target.closest('[data-go-write]')){setMode('write');return;}
  const a=e.target.closest('[data-a]');
  if(a&&!document.body.classList.contains('focus')&&!document.body.classList.contains('reading')){
   const n=(notes[S.piece]||[]).find(n=>n.a===a.dataset.a);if(n&&!window.getSelection().toString()){S.mtab='notes';activateNote(n.id,false);}
  }
 });
 el.addEventListener('input',()=>{updateWC();renderOutline();});
 const strip=$('#strip',el);
 if(strip)sortable({container:strip,item:'.slide',handle:'.handle',onEnd:()=>{renumberSlides(strip);renderOutline();toast('Order changed · Prototype — nothing is saved');}});
}
function renumberSlides(strip){$$('.slide',strip).forEach((s,i)=>{const n=$('.no',s);if(n)n.textContent=(i+1)+' / '+$$('.slide',strip).length;});}
function proj(){return projects.find(p=>p.id===S.project);}
function curEl(){return pieceEls[S.project+':'+S.piece];}
function updateWC(){const el=curEl();if(!el)return;const w=$('#wc',el);if(!w)return;const n=($('.body',el)||el).innerText.trim().split(/\s+/).filter(Boolean).length;w.textContent=n+' words · '+Math.max(1,Math.round(n/220))+' min read';}

}

$('#mHead').addEventListener('click',e=>{

function renderMargin(newSrc){
 $$('.mtab').forEach(t=>t.setAttribute('aria-selected',t.dataset.mt===S.mtab));
 const list=notes[S.piece]||[],full=proj().full;
 $('#ctNotes').textContent=full?list.length:'';$('#ctSrc').textContent=full?sources.length:'';
 const b=$('#mBody');let h='';
 if(!full){b.innerHTML=`<div class="empty"><b>No notes on this sample project.</b><br>Select any text and choose “Your words” to start one, or open Porcelain and Tea to see a full margin.</div>`+composerHTML();wireComposer();return;}
 if(S.mtab==='notes'){
  if(S.since&&S.piece==='article')h+=`<div class="since"><span class="t">Since you left: <b>Claude added 3 source notes</b> · 2 days ago. <a data-since>Show them</a></span><button class="icon-btn" data-since-x aria-label="Dismiss" style="width:24px;height:24px">${ic('x',13)}</button></div>`;
  h+=S.composer?composerHTML():`<button class="btn" data-words style="margin:0 0 8px">${ic('pen')} Add your words</button>`;
  h+=list.map(n=>{const el=curEl();const anc=el&&el.querySelector('[data-a="'+n.a+'"]');const q=anc?(anc.querySelector('.hd')||anc).innerText.trim():'';
   return `<div class="note ${n.kind==='mine'?'mine':'machine'}${S.activeNote===n.id?' on':''}${n.fresh?' new':''}" data-n="${n.id}" tabindex="0"><div class="who">${n.kind==='mine'?'<b>Your words</b> · Adrian':'<b>'+n.by+'</b> · agent note'} · ${n.when}</div>${q?`<div class="q">${esc(q)}</div>`:''}<div class="tx">${esc(n.t)}</div></div>`;}).join('')||'<div class="empty">No notes on this piece yet.</div>';
 } else if(S.mtab==='decisions'){
  h+=`<div class="mh">Decisions</div>`+decisions.made.map(d=>`<div class="dec"><div class="w">${esc(d.w)}</div><div class="by">${esc(d.by)}</div></div>`).join('');
  h+=`<div class="mh">Protected phrases <button class="btn" id="protToggle" style="height:24px;font-size:11.5px">${document.body.classList.contains('show-prot')?'Hide in text':'Show in text'}</button></div>`+decisions.protectedP.map(d=>`<div class="dec pp"><span class="w">${esc(d.w)}</span><div class="by">${esc(d.by)} · ${presentIn(d.w)}</div></div>`).join('');
  h+=`<div class="mh">Corrections</div>`+decisions.corrections.map(d=>`<div class="dec cor"><span class="from">${esc(d.from)}</span> → ${esc(d.to)}<div class="by">${esc(d.by)}</div></div>`).join('');
  h+=`<div class="mh">Rejected angles</div>`+decisions.rejected.map(d=>`<div class="dec rej"><span class="w">${esc(d.w)}</span><div class="by">${esc(d.by)}</div></div>`).join('');
  h+=`<p class="empty">These carry into every piece from this origin. Change them in <a data-open="direction" style="color:var(--warm);cursor:pointer">Direction</a>.</p>`;
 } else {
  h+=sources.map(s=>`<div class="srcq${s.isNew&&newSrc?' note new':''}"><blockquote>“${esc(s.q)}”</blockquote><div class="meta">${s.isNew?'<span class="tag warm">Claude · 2 days ago</span>':''}<span>${esc(s.from)}</span><span>Used: ${s.anchor?`<a data-jp="${s.anchor}">${esc(s.used)}</a>`:esc(s.used)}</span>${s.line?`<a data-src="${s.line}">Open in Source</a>`:`<a data-res="${s.research}">Open in Research</a>`}</div></div>`).join('');
 }
 b.innerHTML=h;wireComposer();
}
function presentIn(w){const el=pieceEls['porcelain:article'];if(!el)return'';return el.innerText.includes(w)?'<span class="ok">intact in Article</span>':'<span class="warn">changed in Article</span>';}
$('#mBody').addEventListener('click',e=>{
 const n=e.target.closest('.note[data-n]');if(n){activateNote(n.dataset.n,true);return;}
 if(e.target.closest('[data-words]')){openComposer(null);return;}
 if(e.target.closest('[data-since-x]')){S.since=false;renderMargin();return;}
 if(e.target.closest('[data-since]')){S.mtab='sources';S.since=false;renderMargin(true);return;}
 if(e.target.closest('#protToggle')){document.body.classList.toggle('show-prot');renderMargin();return;}
 const o=e.target.closest('[data-open]');if(o){openSheet(o.dataset.open);return;}
 const s=e.target.closest('[data-src]');if(s){openSheet('source',s.dataset.src);return;}

function activateNote(id,scroll){
 const n=(notes[S.piece]||[]).find(x=>x.id===id);if(!n)return;

 const card=$('.note[data-n="'+id+'"]');if(card&&!scroll)card.scrollIntoView({block:'nearest'});

/* ---- Your words ---- */
function composerHTML(){
 if(!S.composer)return'';
 return `<div class="composer"><div class="who" style="font-size:11.5px;color:var(--dim);margin-bottom:4px"><b style="color:var(--ink)">Your words</b> · Adrian${S.composer.quote?' · on “'+esc(S.composer.quote.slice(0,60))+(S.composer.quote.length>60?'…':'')+'”':''}</div><textarea id="cmpTx" placeholder="A thought, a doubt, a feeling about this…"></textarea><div class="row"><span class="honest">Prototype — nothing is saved</span><button class="btn" id="cmpCancel">Cancel</button><button class="btn solid" id="cmpSave">Add to margin</button></div></div>`;
}
function wireComposer(){const t=$('#cmpTx');if(!t)return;if(S.composer&&S.composer.fresh){S.composer.fresh=false;t.focus();}$('#cmpCancel').onclick=()=>{S.composer=null;renderMargin();};$('#cmpSave').onclick=saveComposer;t.onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))saveComposer();};}
function saveComposer(){
 const t=$('#cmpTx').value.trim();if(!t){$('#cmpTx').focus();return;}
 let aid=null;const c=S.composer;
 if(c.range){try{const sp=document.createElement('span');sp.className='anc';aid='u'+Date.now();sp.dataset.a=aid;c.range.surroundContents(sp);}catch(err){aid=null;}}
 if(!aid&&c.anchorEl){aid='u'+Date.now();c.anchorEl.dataset.a=aid;}
 if(!notes[S.piece])notes[S.piece]=[];
 const n={id:'n'+Date.now(),a:aid||'none',by:'Adrian',kind:'mine',when:'just now',t,fresh:true};
 notes[S.piece].unshift(n);S.composer=null;S.mtab='notes';S.activeNote=n.id;renderMargin();
 if(aid){const a=curEl().querySelector('[data-a="'+aid+'"]');if(a)a.classList.add('lit');}
 toast('Added to the margin · Prototype — nothing is saved');
}
function openComposer(range){
 if(document.body.classList.contains('home'))return;
 setFocus(false);if(document.body.classList.contains('reading'))setMode('write');
 let quote='',anchorEl=null;
 if(range){quote=range.toString().trim();}
 else{const el=curEl();anchorEl=$('.leftoff',el)?$('.leftoff',el).nextElementSibling:null;if(anchorEl)quote=anchorEl.innerText.trim();}
 S.composer={range,quote,anchorEl,fresh:true};S.mtab='notes';renderMargin();
 if(window.innerWidth<=760)document.body.classList.add('msheet-open');
}
$('#wordsBtn').addEventListener('mousedown',e=>e.preventDefault());
$('#wordsBtn').onclick=()=>{const r=currentDocRange();openComposer(r);};
const selBtn=$('#selBtn');let selRange=null;
function currentDocRange(){const s=window.getSelection();if(!s.rangeCount||s.isCollapsed)return null;const r=s.getRangeAt(0);const el=curEl();if(!el||!el.contains(r.commonAncestorContainer))return null;return r.cloneRange();}
document.addEventListener('selectionchange',()=>{
 const r=currentDocRange();
 if(!r||document.body.classList.contains('reading')){selBtn.classList.remove('show');selRange=null;return;}
 const rect=r.getBoundingClientRect();if(!rect.width){selBtn.classList.remove('show');return;}

 const top=Math.max(50,rect.top-42),left=Math.min(window.innerWidth-130,Math.max(8,rect.left+rect.width/2-60));
 selBtn.style.top=top+'px';selBtn.style.left=left+'px';
});
selBtn.addEventListener('mousedown',e=>e.preventDefault());
selBtn.onclick=()=>{const r=selRange;selBtn.classList.remove('show');openComposer(r);};

function openPalette(){$('#palWrap').classList.add('open');$('#palIn').value='';palIx=0;renderPal();$('#palIn').focus();}
function closePalette(){$('#palWrap').classList.remove('open');}

/* ================= SHEETS ================= */
const SEC={};SECTIONS.forEach(([g,l])=>l.forEach(s=>SEC[s[2]]={g,n:s[0],t:s[1],p:s[3]}));
function openSheet(k,arg){
 if(document.body.classList.contains('home'))hideHome();
 if(!S.sheet){S.returnScroll=$('#docScroll').scrollTop;S.returnFocus=document.activeElement;}
 S.sheet=k;S.sheetArg=arg||null;
 const m=SEC[k];$('#shGroup').textContent=m.g+' · '+m.n;$('#shTitle').textContent=m.t;$('#shPurpose').textContent=m.p;
 $('#shClose').firstChild.textContent='Back to the '+(KIND[S.piece]?KIND[S.piece].l.toLowerCase():'piece')+' ';
 const body=$('#shBody');body.onclick=null;body.innerHTML='';body.scrollTop=0;
 (RENDER[k]||(()=>{}))(body,arg);
 $('#sheet').classList.add('open');$('#sheet').setAttribute('aria-hidden','false');$('#scrim').classList.add('open');
 markSection();setTimeout(()=>$('#shClose').focus(),30);
}
function closeSheet(silent){
 if(!S.sheet)return;S.sheet=null;
 $('#sheet').classList.remove('open');$('#sheet').setAttribute('aria-hidden','true');$('#scrim').classList.remove('open');
 markSection();
 if(!silent){$('#docScroll').scrollTop=S.returnScroll;if(S.returnFocus&&S.returnFocus.focus&&document.contains(S.returnFocus))S.returnFocus.focus({preventScroll:true});}
}
$('#shClose').onclick=()=>closeSheet();$('#scrim').onclick=()=>closeSheet();
function jumpTo(piece,anchor){
 closeSheet(true);
 const go=()=>{const el=curEl();const t=el.querySelector('[data-p="'+anchor.replace('p','')+'"]')||el.querySelector('#'+CSS.escape(anchor))||el.querySelector('[data-a="'+anchor+'"]');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash');}};
 if(S.project!=='porcelain'){openProject('porcelain',piece);requestAnimationFrame(go);return;}
 if(S.piece!==piece)openPiece(piece,go);else{setMode('write');go();}
}

/* ================= DRAG & DROP (pointer, works with touch) ================= */
function sortable(o){
 o.container.addEventListener('pointerdown',e=>{
  const h=e.target.closest(o.handle);if(!h||e.button>0)return;
  const it=h.closest(o.item);if(!it||!o.container.contains(it))return;
  const sx=e.clientX,sy=e.clientY;let moved=false;
  const mv=ev=>{
   if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;
   if(!moved){moved=true;it.classList.add('dragging');it.style.pointerEvents='none';}
   ev.preventDefault();
   let parent=it.parentNode;
   if(o.containers){const under=document.elementFromPoint(ev.clientX,ev.clientY);const c=under&&under.closest(o.containers);$$(o.containers,o.container).forEach(x=>x.classList.toggle('over',x===c));if(c)parent=c;}
   const sibs=$$(o.item,parent).filter(x=>x!==it&&x.parentNode===parent);
   let before=null;for(const s of sibs){const r=s.getBoundingClientRect();if(ev.clientY<r.top+r.height/2){before=s;break;}}
   if(before)parent.insertBefore(it,before);else parent.appendChild(it);
   const sc=it.closest('#docScroll,#shBody');if(sc){const r=sc.getBoundingClientRect();if(ev.clientY<r.top+40)sc.scrollTop-=12;else if(ev.clientY>r.bottom-40)sc.scrollTop+=12;}
  };
  const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
   if(moved){it.classList.remove('dragging');it.style.pointerEvents='';let c=null;if(o.containers){c=it.closest(o.containers);$$(o.containers,o.container).forEach(x=>x.classList.remove('over'));}o.onEnd&&o.onEnd(it,c);}
   else if(o.onTap)o.onTap(it);};
  document.addEventListener('pointermove',mv,{passive:false});document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
 });
}

/* ================= KEYS ================= */
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#palWrap').classList.contains('open')?closePalette():openPalette();return;}
 if(e.key==='Escape'){
  if($('#palWrap').classList.contains('open')){closePalette();$('#projBtn').focus();}
  else if(S.sheet)closeSheet();
  else if(S.composer){S.composer=null;renderMargin();}
  else if(document.body.classList.contains('rail-open'))document.body.classList.remove('rail-open');
  else if(document.body.classList.contains('msheet-open'))document.body.classList.remove('msheet-open');
 }
});
