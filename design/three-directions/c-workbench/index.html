<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Create — The Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<!-- template fonts: used ONLY inside rendered 1080x1350 template artwork (.tplr), exempt from the app type scale -->
<link href="https://fonts.googleapis.com/css2?family=Caudex:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Instrument+Sans:wght@400;500&family=Shippori+Mincho:wght@400;700&family=Source+Serif+4:wght@400;600&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<link href="scale.css" rel="stylesheet">
<link href="media.css" rel="stylesheet">
<style>
/* ================================================================
   ONE type system for every screen (Revision 2).
   Sizes are rem, and the root size is 100% x --z, so the A− / A+
   control scales every token at once. Only these five sizes and
   three weights (400 / 500 / 600) appear anywhere in the file.
   ================================================================ */
:root{
 --z:1;
 --t-label:.8125rem;   /* 13px  quiet labels, metadata, controls, counts */
 --t-body:.9375rem;    /* 15px  interface text, rows, list items */
 --t-reading:1rem;     /* 16px  Read and Write prose — identical */
 --t-head:.9375rem;    /* 15px / 600  section and card headings */
 --t-title:1.0625rem;  /* 17px / 600  the one page title per screen */
 --lh:1.5;--lh-read:1.65;
 --measure:40rem;      /* the reading column, same in Read and Write */
 --gut:32px;--top:24px;/* every screen starts at the same left edge and top */
 --railw:66px;--pw:0px;--rackw:calc(var(--railw) + var(--pw));--drw:380px
}
html{font-size:calc(100% * var(--z))}
:root,[data-theme="dark"]{--bg:#141310;--paper:#1d1b16;--ink:#e7e1d3;--dim:#a39e8e;--line:#2d2a23;--warm:#c9a874;--rail:#191813;--lift:#191813;--sel:#2c2a22;--good:#8fb08a;--warnc:#d9a95a;--bad:#e08a74;--hl:rgba(201,168,116,.28)}
[data-theme="light"]{--bg:#efede6;--paper:#fffefb;--ink:#2d302a;--dim:#686c61;--line:#e2e0d8;--warm:#7a5a30;--rail:#f7f5ef;--lift:#f7f5ef;--sel:#e9e4d7;--good:#3f6146;--warnc:#94600f;--bad:#a23b2a;--hl:rgba(122,90,48,.2)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:var(--t-body);font-weight:400;line-height:var(--lh);-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4,p,blockquote{margin:0}
h1{font-size:var(--t-title);font-weight:600}
h2,h3,h4{font-size:var(--t-head);font-weight:600}
b,strong{font-weight:600}
small{font-size:var(--t-label)}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--warm);outline-offset:2px;border-radius:4px}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--warm) 45%,transparent) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--warm) 45%,transparent);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--warm) 70%,transparent)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:15px;height:15px}
kbd{font-family:inherit;font-size:var(--t-label);font-weight:400;line-height:1;border:1px solid var(--line);border-radius:4px;padding:2px 5px;color:var(--dim)}
.dim{color:var(--dim)}.warm{color:var(--warm)}
.lab{font-size:var(--t-label);font-weight:500;color:var(--dim)}
.sub{font-weight:400;color:var(--dim)}
.honest{display:inline-block;margin:4px 0 0 10px;font-size:var(--t-label);color:var(--warnc)}
.honest::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;border:1.5px solid currentColor;margin-right:6px;vertical-align:1px}
.tag{font-size:var(--t-label);font-weight:400;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 6px;white-space:nowrap}
.tag.agent{color:var(--warm);border-color:color-mix(in srgb,var(--warm) 40%,var(--line))}
.btn{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:7px;font-size:var(--t-label);font-weight:500;color:var(--ink);background:var(--paper)}
.btn:hover{border-color:color-mix(in srgb,var(--warm) 50%,var(--line))}
.btn.primary{background:var(--warm);color:var(--bg);border-color:var(--warm);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.quiet{background:none;border-color:transparent;color:var(--dim)}.btn.quiet:hover{color:var(--ink)}
.btn.on{border-color:var(--warm);color:var(--ink)}
.btn[aria-disabled="true"]{opacity:.55}
.lnk{color:var(--warm);font-weight:500;font-size:var(--t-label)}.lnk:hover{text-decoration:underline}
.flash{animation:fl 1.8s ease-out}
@keyframes fl{0%,30%{background:var(--hl)}100%{background:transparent}}

/* ---------- frame: two columns only — the rack and the work ---------- */
/* Revision 5: rail + (only when a section has something to navigate) its panel + the work */
.app{display:grid;height:100dvh;grid-template-columns:var(--railw) var(--pw) minmax(0,1fr);grid-template-rows:48px minmax(0,1fr)}
body.has-panel{--pw:15rem}
body.focus{--railw:0px;--pw:0px}
#top{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--rail)}
#switch{display:flex;align-items:center;gap:9px;height:34px;padding:0 10px 0 8px;border-radius:7px;min-width:0;max-width:340px;font-weight:600}
#switch:hover{background:var(--sel)}
#switch .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#switch .dot{width:9px;height:9px;border-radius:2px;background:var(--warm);flex:none}
#switch .dot.all{background:none;border:1.5px solid var(--warm)}
.top-sp{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 9px;border-radius:7px;color:var(--dim);font-size:var(--t-label);font-weight:500}
.tbtn:hover,.tbtn.on{color:var(--ink);background:var(--sel)}
.tbtn:disabled{opacity:.4;cursor:default;background:none}
.sizer{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px;height:32px}
.sizer .tbtn{height:30px;padding:0 8px}
.sizer .pct{font-size:var(--t-label);color:var(--dim);min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums}
#rack{grid-row:2;grid-column:1;border-right:1px solid var(--line);background:var(--rail);overflow-y:auto;overflow-x:hidden;padding:8px 4px;display:flex;flex-direction:column;gap:1px;scrollbar-width:none;padding:6px 3px}
#rack::-webkit-scrollbar{display:none}
body.has-panel #rack{border-right:0}
body.focus #rack,body.focus #spanel{display:none}
.rl{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:100%;min-height:46px;padding:5px 0 4px;letter-spacing:-.01em;border-radius:8px;color:var(--dim);font-size:var(--t-label);line-height:1.15;flex:none}
.rl .rlb{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl:hover{color:var(--ink);background:var(--sel)}
.rl.on{color:var(--ink);background:var(--sel)}
.rl.on::before{content:"";position:absolute;left:-3px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--warm)}
.rl .cnt{position:absolute;top:2px;left:calc(50% + 10px);min-width:17px;padding:0 4px;line-height:1.3}
.rdiv{height:1px;background:var(--line);margin:6px 10px;flex:none}
#spanel{grid-row:2;grid-column:2;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
#spanel[hidden]{display:none}
.sph{display:flex;align-items:center;gap:6px;height:40px;padding:0 6px 0 14px;flex:none;font-size:var(--t-label);font-weight:500;color:var(--dim)}
.sph .sp{flex:1}
.spb{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 6px 16px}
.pnlbtn{flex:none}
body:not(.v-write):not(.v-read) #pull{display:none}
body.has-panel .pnlbtn{display:none}
.rk{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:0 9px;border-radius:7px;color:var(--dim);text-align:left;white-space:nowrap;font-size:var(--t-body)}
.rk:hover{color:var(--ink);background:var(--sel)}
.rk.on{color:var(--ink);background:var(--sel);box-shadow:inset 2px 0 0 var(--warm)}
.rk .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.rk .pm{color:var(--dim);opacity:.7}
.cnt{min-width:20px;padding:0 6px;border-radius:5px;background:color-mix(in srgb,var(--warm) 22%,transparent);color:var(--warm);font-size:var(--t-label);font-weight:500;line-height:1.5;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.rk-gl{font-size:var(--t-label);font-weight:500;color:var(--dim);padding:14px 9px 4px}
.rk-foot{margin-top:auto;padding-top:10px}
body.rack-min .rk .lbl,body.rack-min .rk .pm,body.rack-min .rk-gl span{display:none}
body.rack-min .rk{justify-content:center;padding:0;position:relative}
body.rack-min .rk .cnt{position:absolute;top:6px;right:8px;min-width:0;width:7px;height:7px;padding:0;border-radius:50%;background:var(--warm);color:transparent;overflow:hidden}
body.rack-min .rk-gl{height:1px;padding:0;border-top:1px solid var(--line);margin:10px 6px}
main{grid-row:2;grid-column:3;overflow-y:auto;overflow-x:hidden;min-width:0;background:var(--bg)}
.wrap{padding:var(--top) var(--gut) 96px;max-width:1120px}
body.focus .wrap{margin:0 auto}
.thead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;min-height:34px}
.thead h1{margin:0}
.thead .sp{flex:1}
.pstrip{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--t-label);margin:-8px 0 20px;color:var(--dim)}
.pstrip button{color:var(--dim);padding:3px 0;border-bottom:1.5px solid transparent}
.pstrip button.on{color:var(--ink);border-color:var(--warm)}
.pstrip button:hover{color:var(--ink)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px 24px;color:var(--dim)}
.empty h3{color:var(--ink);margin:0 0 6px}
h2.sec{font-size:var(--t-label);font-weight:500;color:var(--dim);margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.block{margin-top:32px}
.small{font-size:var(--t-label)}

/* ---------- the one side drawer (understanding, check, used in, history) ---------- */
#drawer{position:fixed;top:48px;right:0;bottom:0;width:min(var(--drw),100vw);background:var(--rail);border-left:1px solid var(--line);box-shadow:-18px 0 40px rgba(0,0,0,.3);transform:translateX(102%);visibility:hidden;transition:transform .2s ease,visibility 0s linear .2s;z-index:46;display:flex;flex-direction:column}
#drawer.on{transform:none;visibility:visible;transition:transform .2s ease}
.dr-head{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line);min-height:52px}
.dr-head h2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-tabs{display:flex;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);font-size:var(--t-label);overflow-x:auto;scrollbar-width:none}
.dr-tabs button{color:var(--dim);padding:9px 0;border-bottom:1.5px solid transparent;white-space:nowrap}
.dr-tabs button.on{color:var(--ink);border-color:var(--warm)}
.dr-body{overflow-y:auto;padding:16px 18px 48px;flex:1}
#pull{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:20;width:22px;height:72px;border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;background:var(--rail);color:var(--dim);display:grid;place-items:center}
#pull:hover{color:var(--ink);width:26px}
body.dr-open #pull,body.focus #pull{display:none}
.u-sec{border-top:1px solid var(--line);padding:14px 0}
.u-sec:first-child{border-top:0;padding-top:0}
.u-sec h4{margin:0 0 6px;font-size:var(--t-label);font-weight:500;color:var(--dim)}
.u-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.u-list .w{display:block;font-size:var(--t-label);color:var(--dim)}
.mine{border:1px solid color-mix(in srgb,var(--warm) 45%,var(--line));border-radius:9px;background:var(--paper);padding:10px 12px}
.mine .who{font-size:var(--t-label);color:var(--warm);font-weight:500;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mine .who .dim{font-weight:400}
.mine textarea{width:100%;min-height:74px;resize:vertical;border:0;background:none;outline:none;padding:4px 0 0;line-height:var(--lh)}
.addt{display:flex;gap:6px;margin-top:8px}
.addt input{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:0 9px}
.thoughts{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.thoughts li{border-left:2px solid var(--warm);padding-left:8px}
.thoughts li span{display:block;font-size:var(--t-label);color:var(--dim)}
.foot-note{font-size:var(--t-label);color:var(--dim);margin-top:12px}
.finds{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.find{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;width:100%;text-align:left;padding:9px 8px;border-radius:7px}
.find:hover,.find.on{background:var(--sel)}
.find.on{box-shadow:inset 2px 0 0 var(--warm)}
.find i{width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--good)}
.find i.miss{background:var(--warnc)}.find i.risk{background:var(--bad)}
.find .w{display:block;font-size:var(--t-label);color:var(--dim)}
.status{border:1px dashed var(--line);border-radius:9px;padding:14px}
.status h3{margin:0 0 4px}
.status p{color:var(--dim);margin:0 0 12px}
.usedrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}

/* ---------- bench (one column) ---------- */
.pickup{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 24px;max-width:calc(var(--measure) + 16rem)}
.pickup h2{margin:4px 0 2px}
.pickup .meta{font-size:var(--t-label);color:var(--dim)}
.pickup blockquote{margin:14px 0 16px;padding:0 0 0 14px;border-left:2px solid var(--warm);font-size:var(--t-reading);line-height:var(--lh-read);max-width:var(--measure)}
.pickup .acts{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.since{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.since ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.since li{display:grid;grid-template-columns:8px 1fr;gap:10px}
.since li i{width:7px;height:7px;border-radius:50%;margin-top:8px;background:var(--dim)}
.since li i.agent{background:var(--warm)}
.since li small{display:block;color:var(--dim)}
.oac{display:inline-flex;align-items:center;gap:6px;color:var(--warm);font-size:var(--t-label);font-weight:500;text-decoration:none;white-space:nowrap}
.oac:hover{text-decoration:underline}
.oac-note{font-size:var(--t-label);color:var(--dim)}
.moves{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);max-width:calc(var(--measure) + 16rem)}
.moves li{border-bottom:1px solid var(--line)}
.move{display:grid;grid-template-columns:22px minmax(0,1fr) 18px;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 6px;border-radius:6px}
.move:hover{background:var(--sel)}
.move .t{font-weight:500}
.move .w{font-size:var(--t-label);color:var(--dim)}
.move .ic{color:var(--dim)}
.search{display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--line);border-radius:7px;padding:0 9px;background:var(--paper);margin-bottom:6px;max-width:calc(var(--measure) + 16rem)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none}
.alist{list-style:none;margin:0;padding:0;max-width:calc(var(--measure) + 16rem)}
.alist li{display:flex;align-items:center;gap:10px;border-radius:6px}
.alist li:hover{background:var(--sel)}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;flex:1;min-width:0;text-align:left;padding:8px 8px;border-radius:6px}
.arow.sel{background:var(--sel);box-shadow:inset 2px 0 0 var(--warm)}
.arow b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .k{font-size:var(--t-label);color:var(--dim);white-space:nowrap}
.arow .s{grid-column:1/-1;font-size:var(--t-label);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alist .oac{padding:0 10px 0 0}

/* ---------- material ---------- */
.drop{border:1.5px dashed color-mix(in srgb,var(--warm) 40%,var(--line));border-radius:11px;padding:18px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.drop.over{background:var(--hl)}
.drop .t{flex:1;min-width:200px}
.drop b{display:block}
.mrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:start;padding:12px 4px;border-bottom:1px solid var(--line)}
.thumb{width:44px;height:44px;border-radius:7px;background:var(--sel);display:grid;place-items:center;color:var(--dim)}
.mrow .m{font-size:var(--t-label);color:var(--dim)}
.mrow .pv{margin-top:8px;background:var(--paper);border-radius:7px;padding:9px 11px;border:1px solid var(--line);max-width:var(--measure)}
.mrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:300px}
.state{font-weight:500}
.state.new{color:var(--warm)}.state.processed,.state.transcribed{color:var(--good)}
.review{margin-top:28px;border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--lift)}
.review p{color:var(--dim);margin:6px 0 0}
.review .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}

/* ---------- source: serif only for what people said, at body size ---------- */
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tline{display:grid;grid-template-columns:48px 64px minmax(0,1fr);gap:10px;padding:8px;border-radius:7px;cursor:pointer;align-items:baseline;max-width:calc(var(--measure) + 10rem)}
.tline:hover{background:var(--sel)}
.tline .tm{font-size:var(--t-label);color:var(--dim);font-variant-numeric:tabular-nums}
.tline .who{font-size:var(--t-label);font-weight:500;color:var(--dim)}
.quote{font-family:Lora,Georgia,serif;font-size:var(--t-body);line-height:var(--lh-read)}
.unc{text-decoration:underline dotted var(--warnc) 2px;text-underline-offset:4px}
.tline .fx{font-size:var(--t-label);color:var(--good);margin-left:8px}
.fix{grid-column:3;margin-top:8px}
.fix textarea{width:100%;min-height:62px;border:1px solid var(--warm);border-radius:7px;background:var(--paper);padding:8px 10px;font-family:Lora,Georgia,serif;font-size:var(--t-body);line-height:var(--lh-read);outline:none}
.fix .row{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}

/* ---------- research: one column, the open point expands in place ---------- */
.plist{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-width:calc(var(--measure) + 6rem)}
.pbtn{display:grid;grid-template-columns:10px 1fr auto;gap:10px;width:100%;text-align:left;padding:10px;border-radius:7px}
.pbtn:hover,.pbtn.on{background:var(--sel)}
.pbtn.on{box-shadow:inset 2px 0 0 var(--warm)}
.pbtn .w{font-size:var(--t-label);color:var(--dim);white-space:nowrap}
.lv{width:9px;height:9px;border-radius:50%;margin-top:7px}
.lv.settled{background:var(--good)}.lv.likely{background:var(--dim)}.lv.unsure{background:var(--warnc)}.lv.disputed{background:var(--bad)}
.pdet{padding:6px 10px 22px 30px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{padding:6px 11px;font-size:var(--t-label);color:var(--dim);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--sel);color:var(--ink);font-weight:500}
.ev{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.ev li{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.ev q{display:block;quotes:none}

/* ---------- Write and Read: the SAME document column ---------- */
.doc .dt{margin:0 0 2px;outline:none;max-width:var(--measure)}

body.focus .margin{display:none}
.para{font-size:var(--t-reading);line-height:var(--lh-read);font-weight:400;margin:0 0 1em;outline:none;border-radius:4px;padding:1px 4px;margin-left:-4px}
.para[contenteditable]:focus{background:color-mix(in srgb,var(--sel) 35%,transparent)}
.para mark{background:var(--hl);color:inherit;border-radius:3px;box-shadow:0 0 0 2px var(--hl)}
.para.last{box-shadow:-10px 0 0 -8px var(--warm)}
.prot{border-bottom:1.5px solid color-mix(in srgb,var(--good) 70%,transparent)}
.margin{display:grid;gap:8px;padding-top:3px}

/* ---------- media ---------- */

.asset.new{border-color:color-mix(in srgb,var(--warm) 55%,var(--line))}

.lblock .x{color:var(--dim);font-size:var(--t-label)}

 fillPSheet();ps.classList.add('on');$('.scrim.p').classList.add('on');}

function paraWith(p,ph){const d=DOCS[p];if(!d||!ph)return null;const x=d.paras.find(q=>q.text.includes(ph));return x?x.id:null;}
function checkFindings(p){
 const u=U[p],f=[];
 u.protected.forEach(x=>{const pid=paraWith(p,x.t);f.push({id:'pr'+f.length,kind:'Protected phrase',t:x.t,ph:x.t,pid,st:pid?'ok':'miss',w:pid?`Present in ¶${DOCS[p].paras.findIndex(q=>q.id===pid)+1}`:'Not in this piece — was it cut?'});});
 u.corrections.filter(x=>x.to).forEach(x=>{const pid=paraWith(p,x.to);f.push({id:'co'+f.length,kind:'Correction',t:x.t,ph:x.to,pid,st:pid?'ok':'miss',w:pid?`Corrected wording is in ¶${DOCS[p].paras.findIndex(q=>q.id===pid)+1}`:'Corrected wording not found here'});});
 (RES[p]||[]).filter(r=>(r.level==='unsure'||r.level==='disputed')&&r.ph).forEach(r=>{const pid=paraWith(p,r.ph);if(pid)f.push({id:'re'+f.length,kind:`Research point marked ${r.level}`,t:r.claim,ph:r.ph,pid,st:'risk',w:`This passage leans on it · ¶${DOCS[p].paras.findIndex(q=>q.id===pid)+1}`});});
 return f;
}

/* ---------------- main render ---------------- */
let prevView=null;
function render(keepScroll){
 const main=$('#main');const st=main.scrollTop;
 const rw=['read','write'];if(rw.includes(S.view)&&rw.includes(prevView)&&prevView!==S.view){keepScroll=true;S.target=null;}prevView=S.view;
 document.body.className=document.body.className.replace(/\bv-\S+/g,'').trim();document.body.classList.add('v-'+S.view);
 renderTop();renderRack();renderDrawer();
 main.innerHTML=(V[S.view]||V.bench)();
 if(keepScroll)main.scrollTop=st;else main.scrollTop=0;
 afterRender();
}
function afterRender(){
 const x=S.target;S.target=null;
 if(x){
  let el=null;
  if(x==='first-unclear'&&S.view==='source'){const p=resolveProj('source');const i=SRC[p].lines.findIndex(l=>l.unclear&&!l.fixed);if(i>=0)el=$('#ln-'+i);}
  else if(x==='notes'){el=document.querySelector('.note.agent');}
  else if(S.view==='source'){const p=resolveProj('source');const i=SRC[p].lines.findIndex(l=>l.t===x);if(i>=0)el=$('#ln-'+i);}
  else el=$('#pa-'+x)||$('#sl-'+x)||$('#it-'+x)||$('#as-'+x);
  if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('flash');if(el.classList.contains('para')&&el.isContentEditable){placeCaretEnd(el);}}
 }
 const drop=$('#drop');
 if(drop){
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');addFiles(e.dataTransfer.files);});
 }
}
function placeCaretEnd(el){try{el.focus({preventScroll:true});const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);}catch(e){}}
function addFiles(files){
 const p=S.scope==='all'?resolveProj('material'):S.scope;
 [...files].forEach((f,i)=>{const k=/audio/.test(f.type)?'audio':/image/.test(f.type)?'image':/video/.test(f.type)?'video':/pdf/.test(f.type)?'doc':'text';
  MAT.unshift({id:'u'+Date.now()+i,p,name:f.name,kind:k,meta:`${Math.max(1,Math.round(f.size/1024))} KB · kept in this page only — nothing uploaded`,by:'You · just now',state:'new',preview:'Preview of new files isn’t connected in this prototype.'});});
 if(files.length){toast(`${files.length} added to ${PN(p)} — prototype, nothing uploaded`);render(true);}
}
let toastT;
function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}t.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600);}
function honest(btn,msg){
 const host=btn.closest('.acts,.row,.thead,.tbar,.x,.status,p,.empty,div')||btn.parentElement;
 let s=host.querySelector(':scope > .honest');
 if(!s){s=document.createElement('span');s.className='honest';s.setAttribute('role','status');host.appendChild(s);}
 s.textContent=msg;
}

/* ---------------- navigation ---------------- */
function go(tool,p,x){
 closeSheets();closePSheet();S.open=null;
 if(tool==='material'){S.libInbox=true;tool='library';x=x||null;}
 // Check is not a page: it pulls out beside the text you are reading or writing
 if(T(tool)&&T(tool).pull){
  if(S.view!=='write'&&S.view!=='read'){go('write',p);}
  openDrawer(tool);return;
 }
 S.drawer=null;S.find=null;
 if(S.view==='write'&&tool!=='write'){const wp=resolveProj('write');const d=DOCS[wp];if(d){const i=d.paras.findIndex(q=>q.id===d.last);S.ret={p:wp,pid:d.last,n:i+1};}}
 if(p){ if(S.scope!=='all'&&S.scope!==p)S.scope=p; if(S.scope==='all')S.toolProj={[tool]:p}; S.work=p; }
 if(tool==='write'&&!x){const d=DOCS[p||resolveProj('write')];if(d&&d.last)x=d.last;}
 if(tool==='write'||tool==='read')S.ret=null;
 S.view=tool;S.target=x||null;S.fixing=null;S.activeNote=null;
 if(tool!=='write')document.body.classList.remove('focus');
 render();
}
function setScope(p){S.scope=p;if(p!=='all')S.work=p;S.sel=0;closeSheets();render();}
function closeSheets(){$('#gsheet').classList.remove('on');$('.scrim.f').classList.remove('on');}

/* ---------------- finder ---------------- */
let fsel=0,fitems=[];
function openFinder(){$('#finder').classList.add('on');$('.scrim.f').classList.add('on');const q=$('#fq');q.value='';fsel=0;fillFinder();q.focus();}
function closeFinder(){$('#finder').classList.remove('on');$('.scrim.f').classList.remove('on');}
function fillFinder(){
 const q=$('#fq').value.trim().toLowerCase();
 /* Revision 3: pinned and recent first, then the rest; at fifty projects the search narrows it */
 const PIN=['porc','harb'],REC=['oolong','ancha'];const ord=P.slice().sort((x,y)=>{const r=v=>PIN.includes(v.id)?0:REC.includes(v.id)?1:2;return r(x)-r(y);});
 const pr=[{type:'scope',id:'all',label:'All projects',sub:'Everything active, one bench'}].concat(ord.map(p=>({type:'scope',id:p.id,label:p.name,sub:(PIN.includes(p.id)?'Pinned · ':REC.includes(p.id)?'Recent · ':'')+stateLine(p.id)})));
 const tl=[{type:'tool',id:'bench',label:'The bench',sub:'Pick up and next moves'}].concat(TOOLS.map(t=>({type:'tool',id:t.id,label:t.label,sub:t.pull?t.g+' · pulls out beside your work':t.g})));
 const f=a=>a.filter(x=>!q||(x.label+' '+x.sub).toLowerCase().includes(q));
 const a=f(pr),b=f(tl);fitems=a.concat(b);if(fsel>=fitems.length)fsel=0;
 let i=0;const row=x=>{const k=i++;return `<li><button class="${k===fsel?'sel':''}" data-act="fpick" data-k="${k}">${x.type==='scope'?`<span style="width:9px;height:9px;border-radius:2px;${x.id==='all'?'border:1.5px solid var(--warm)':'background:var(--warm)'}"></span>`:ic(x.id)}<span><b>${esc(x.label)}</b><br><span class="s">${esc(x.sub)}</span></span>${x.type==='scope'&&x.id===S.scope?'<span class="tag">current</span>':''}</button></li>`;};
 $('#flist').innerHTML=(a.length?`<li class="gh">Projects</li>`+a.map(row).join(''):'')+(b.length?`<li class="gh">Tools</li>`+b.map(row).join(''):'')+(!fitems.length?'<li class="dim" style="padding:12px">Nothing matches.</li>':'');
}
function pickFinder(k){const x=fitems[k];if(!x)return;closeFinder();if(x.type==='scope')setScope(x.id);else go(x.id);}

/* ---------------- drag reorder (pointer, works with touch) ---------------- */
let drag=null;
document.addEventListener('pointerdown',e=>{
 const h=e.target.closest('[data-handle]');if(!h)return;
 const item=h.closest('[data-idx]');if(!item)return;
 e.preventDefault();drag={item,box:item.parentElement};item.classList.add('dragging');
});
document.addEventListener('pointermove',e=>{
 if(!drag)return;
 const el=document.elementFromPoint(e.clientX,e.clientY);const over=el&&el.closest('[data-idx]');
 if(!over||over===drag.item||over.parentElement!==drag.box)return;
 const kids=[...drag.box.children];const oi=kids.indexOf(over),di=kids.indexOf(drag.item);
 drag.box.insertBefore(drag.item,oi>di?over.nextSibling:over);
});
function endDrag(){
 if(!drag)return;
 const order=[...drag.box.children].map(c=>+c.dataset.idx);const key=drag.box.dataset.sortable;
 drag.item.classList.remove('dragging');drag=null;
 const p=resolveProj('arrange');
 if(key==='car'){const s=CAR[p].slides;CAR[p].slides=order.map(i=>s[i]);}
 if(key==='art'){const s=DOCS[p].paras;DOCS[p].paras=order.map(i=>s[i]);}
 render(true);
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

 finder:()=>openFinder(),

 closeall:()=>{closeFinder();closeSheets();},
 und:()=>toggleUnd(),
 thought:()=>openThought(),

 focus:()=>{document.body.classList.toggle('focus');if(document.body.classList.contains('focus')){S.drawer=null;S.find=null;}render(true);},
 ptog:()=>togglePanel(),
 pshow:()=>togglePanel(),
 closepsheet:()=>closePSheet(),
 gsheet:el=>{const g=el.dataset.g;const sh=$('#gsheet');if(sh.classList.contains('on')&&sh.dataset.g===g){sh.classList.remove('on');return;}sh.dataset.g=g;sh.innerHTML=`<div class="rk-gl"><span>${g}</span></div>`+shown().filter(t=>t.g===g).map(rackBtn).join('');sh.classList.add('on');},
 honest:el=>honest(el,el.dataset.msg),
 addthought:()=>{const q=$('#quickT');const v=q&&q.value.trim();if(!v){q&&q.focus();return;}U[curProj()].thoughts.unshift({t:v,w:'You · just now (not saved)'});renderDrawer();setTimeout(()=>{const n=$('#quickT');n&&n.focus();},0);},
 size:el=>{zi=Math.max(0,Math.min(SIZES.length-1,zi+(+el.dataset.d)));applySize();renderTop();},
 drawer:el=>{const k=el.dataset.k;if(S.drawer&&S.drawer.k===k&&(k!=='used'||S.drawer.id===el.dataset.id)){closeDrawer();return;}if(k==='check'&&S.view!=='write'&&S.view!=='read'){go('check');return;}openDrawer(k,el.dataset.id?{id:el.dataset.id}:null);},
 closedrawer:()=>closeDrawer(),
 find:el=>{S.find=el.dataset.id;document.querySelectorAll('.find.on').forEach(x=>x.classList.remove('on'));el.classList.add('on');if(!findPassage(el.dataset.ph,el.dataset.pid))toast('That wording isn’t in the text — nothing to highlight');},
 pickfile:()=>$('#filein').click(),
 processed:el=>{const m=MAT.find(x=>x.id===el.dataset.id);if(m)m.state='processed';render(true);},
 pv:el=>{S.openPv[el.dataset.id]=!S.openPv[el.dataset.id];render(true);},
 fixline:el=>{const i=+el.dataset.i;if(S.fixing===i)return;S.fixing=i;render(true);const b=$('#fixBox');if(b){b.focus();b.select();}},
 cancelfix:()=>{S.fixing=null;render(true);},
 savefix:el=>{const p=resolveProj('source');const l=SRC[p].lines[+el.dataset.i];const v=$('#fixBox').value.trim();
  if(v&&v!==l.text){U[p].corrections.unshift({t:`${l.t} “${l.text.slice(0,40)}${l.text.length>40?'…':''}” → “${v.slice(0,40)}${v.length>40?'…':''}”`,w:'From Source · carries into Research, Write and outputs'});l.text=v;}
  l.fixed=true;S.fixing=null;render(true);},
 rpoint:el=>{S.research[resolveProj('research')]=el.dataset.id;render(true);},
 level:el=>{const p=resolveProj('research');const r=RES[p].find(x=>x.id===el.dataset.id);r.level=el.dataset.l;S.research[p]=r.id;render(true);},
 discuss:el=>{const p=resolveProj('research');const r=RES[p].find(x=>x.id===el.dataset.id);const v=$('#discuss').value.trim();if(!v)return;
  r.thread.push({who:'you',text:v,when:'just now'});r.thread.push({who:'sys',text:'AI isn’t connected here yet — no answer was generated. Your question is kept with this point.'});S.research[p]=r.id;render(true);},
 choose:el=>{const p=resolveProj('direction');const d=DIR[p];d.chosen=el.dataset.id;const a=d.angles.find(x=>x.id===d.chosen);
  U[p].decisions.unshift({t:`Angle: ${a.title}`,w:'Just now · Direction'});
  d.angles.filter(x=>x.id!==d.chosen).forEach(x=>{if(!U[p].rejected.some(r=>r.t===x.title))U[p].rejected.unshift({t:x.title,w:'Every piece in this project'});});
  render(true);},
 unchoose:()=>{const p=resolveProj('direction');DIR[p].chosen=null;render(true);},
 newdir:()=>{const p=resolveProj('direction');DIR[p]={mine:'',chosen:null,angles:[]};render(true);},
 newdoc:()=>{const p=resolveProj('write');DOCS[p]={title:'Untitled',kind:'Piece',last:'x1',paras:[{id:'x1',text:'Start here.'}],notes:[]};S.target='x1';render();},
 note:(el,e)=>{
  if(e&&e.target.closest('[data-act="resolve"]'))return;
  const p=resolveProj('write');const n=DOCS[p].notes.find(x=>x.id===el.dataset.id);if(!n)return;
  clearMarks();
  document.querySelectorAll('.note.on').forEach(x=>x.classList.remove('on'));el.classList.add('on');S.activeNote=n.id;
  const para=$('#pa-'+n.pid);if(!para)return;
  if(!wrapPhrase(para,n.phrase))para.classList.add('flash');
  para.scrollIntoView({block:'center',behavior:'smooth'});
 },
 resolve:el=>{const p=resolveProj('write');const n=DOCS[p].notes.find(x=>x.id===el.dataset.id);if(n)n.done=1;render(true);},
 mfilt:el=>{S.mediaF=el.dataset.f;render(true);},
 keepasset:el=>{const m=MEDIA.find(x=>x.id===el.dataset.id);if(m){m.isNew=0;m.by=m.by.replace('imported','imported')+' · kept by you';}render(true);},
 setaside:el=>{const i=MEDIA.findIndex(x=>x.id===el.dataset.id);if(i>=0)MEDIA.splice(i,1);toast('Set aside — still in the Library, not in this project (prototype)');render(true);},
 keepall:()=>{MEDIA.forEach(m=>{if(m.isNew&&(S.scope==='all'||m.p===S.scope)){m.isNew=0;m.by+=' · kept by you';}});render(true);},
 amode:el=>{S.arrangeMode[resolveProj('arrange')]=el.dataset.m;render(true);},
 aumode:el=>{S.audMode[resolveProj('audience')]=el.dataset.m;render(true);},
 accept:el=>{const s=CAR[resolveProj('arrange')].slides.find(x=>x.id===el.dataset.id);if(s){delete s.draft;delete s.prev;}render(true);},
 discard:el=>{const s=CAR[resolveProj('arrange')].slides.find(x=>x.id===el.dataset.id);if(s){s.text=s.prev||'';delete s.draft;delete s.prev;}render(true);},
 addslide:()=>{const c=CAR[resolveProj('arrange')];c.slides.push({id:'s'+Date.now(),text:'New slide — type here'});render(true);}
};
function wrapPhrase(el,phrase){
 const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let node;
 while((node=walker.nextNode())){const i=node.nodeValue.indexOf(phrase);if(i>=0){const r=document.createRange();r.setStart(node,i);r.setEnd(node,i+phrase.length);const m=document.createElement('mark');try{r.surroundContents(m);}catch(e){return false;}return true;}}
 // phrase may span a protected-phrase span: fall back to whole-text search
 if(el.textContent.includes(phrase)){el.classList.add('flash');return true;}
 return false;
}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 if(e.target.closest('[data-stop]')&&el.dataset.act==='fixline')return;
 if(el.dataset.act==='honest'||el.getAttribute('aria-disabled')==='true'){e.preventDefault();honest(el,el.dataset.msg||'Not connected yet.');return;}
 const f=A[el.dataset.act];if(f){if(el.tagName==='A')e.preventDefault();f(el,e);}
});

/* ---------------- editing binds (no re-render while typing) ---------------- */
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='mineBox'){U[curProj()].mine=t.value;return;}
 if(t.id==='aq'){S.q=t.value;S.sel=0;const pos=t.selectionStart;render(true);const n=$('#aq');if(n){n.focus();n.setSelectionRange(pos,pos);}return;}
 if(t.id==='fq'){fsel=0;fillFinder();return;}
 if(t.dataset.bind==='dir'){DIR[resolveProj('direction')].mine=t.value;return;}
 if(t.dataset.bind==='title'){DOCS[resolveProj('write')].title=t.textContent;return;}
 if(t.dataset.pid){const p=resolveProj('write');const x=DOCS[p].paras.find(q=>q.id===t.dataset.pid);if(x){x.text=t.innerText.replace(/\n+$/,'');DOCS[p].last=x.id;}return;}
 if(t.dataset.sid){const s=CAR[resolveProj('arrange')].slides.find(q=>q.id===t.dataset.sid);if(s)s.text=t.innerText;return;}
});
document.addEventListener('focusin',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.pid&&S.view==='write'){const d=DOCS[resolveProj('write')];if(d)d.last=t.dataset.pid;}});
$('#filein').addEventListener('change',e=>{addFiles(e.target.files);e.target.value='';});

/* ---------------- keyboard ---------------- */
const typing=t=>t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
document.addEventListener('keydown',e=>{
 const k=e.key;
 if((e.metaKey||e.ctrlKey)&&k.toLowerCase()==='k'){e.preventDefault();$('#finder').classList.contains('on')?closeFinder():openFinder();return;}
 if($('#finder').classList.contains('on')){
  if(k==='Escape'){closeFinder();return;}
  if(k==='ArrowDown'){e.preventDefault();fsel=Math.min(fitems.length-1,fsel+1);fillFinder();return;}
  if(k==='ArrowUp'){e.preventDefault();fsel=Math.max(0,fsel-1);fillFinder();return;}
  if(k==='Enter'){e.preventDefault();pickFinder(fsel);return;}
  return;
 }
 if(k==='Escape'&&S.drawer){closeDrawer();return;}
 if(k==='Escape'){if(document.body.classList.contains('focus')){document.body.classList.remove('focus');render(true);}closeSheets();if(S.fixing!=null){S.fixing=null;render(true);}return;}
 if(e.target.id==='quickT'&&k==='Enter'){e.preventDefault();A.addthought();return;}
 if(e.target.id==='aq'&&(k==='ArrowDown'||k==='ArrowUp'||k==='Enter')){e.preventDefault();benchKey(k==='ArrowDown'?'j':k==='ArrowUp'?'k':'Enter');return;}
 if(e.target.classList&&e.target.classList.contains('tline')&&k==='Enter'){A.fixline(e.target);return;}
 if(typing(e.target)||e.metaKey||e.ctrlKey||e.altKey)return;
 if(k==='t'||k==='T'){e.preventDefault();openThought();return;}
 if(k==='['){togglePanel();return;}
 if(k===']'){toggleUnd();return;}
 if(k==='/'&&S.view==='bench'){e.preventDefault();const a=$('#aq');a&&a.focus();return;}
 if(S.view==='bench'&&(k==='j'||k==='k'||k==='Enter'))benchKey(k);
});
function benchKey(k){
 const rows=[...document.querySelectorAll('#alist .arow')];if(!rows.length)return;
 if(k==='j')S.sel=Math.min(rows.length-1,S.sel+1);
 else if(k==='k')S.sel=Math.max(0,S.sel-1);
 else if(k==='Enter'){rows[S.sel]&&setScope(rows[S.sel].dataset.p);return;}
 rows.forEach((r,i)=>r.classList.toggle('sel',i===S.sel));rows[S.sel].scrollIntoView({block:'nearest'});
}

window.ARC={PANEL,renderPanel,panelBtn,railId,hasPanel,panelOpen,setPanel,closePSheet,openPSheet,SRC,S,V,A,DR,DR_TABS,DR_TITLE,NOTABS,DR_SUB,TOOLS,GROUPS,I,P,PN,T,HAS,COUNT,CROSS,DOCS,CAR,RES,U,MEDIA,MAT,OUT,DIR,esc,ic,render,renderDrawer,renderRack,renderTop,openDrawer,closeDrawer,go,toast,head,emptyFor,resolveProj,curProj,docProj,isPhone,honest,setScope,fillFinder,stateLine,moves,resume};
render();
})();
