<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Create — The Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{--bg:#141310;--paper:#1d1b16;--ink:#e7e1d3;--dim:#a39e8e;--line:#2d2a23;--warm:#c9a874;--rail:#191813;--lift:#191813;--sel:#2c2a22;--good:#8fb08a;--warnc:#d9a95a;--bad:#e08a74;--hl:rgba(201,168,116,.28)}
[data-theme="light"]{--bg:#efede6;--paper:#fffefb;--ink:#2d302a;--dim:#686c61;--line:#e2e0d8;--warm:#7a5a30;--rail:#f7f5ef;--lift:#f7f5ef;--sel:#e9e4d7;--good:#3f6146;--warnc:#94600f;--bad:#a23b2a;--hl:rgba(122,90,48,.2)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--warm);outline-offset:2px;border-radius:4px}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--warm) 45%,transparent) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--warm) 45%,transparent);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--warm) 70%,transparent)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:15px;height:15px}
kbd{font:11px/1 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:2px 5px;color:var(--dim)}
.dim{color:var(--dim)}.warm{color:var(--warm)}
.honest{display:inline-block;margin:4px 0 0 10px;font-size:12.5px;color:var(--warnc)}
.honest::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;border:1.5px solid currentColor;margin-right:6px;vertical-align:1px}
.tag{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.tag.agent{color:var(--warm);border-color:color-mix(in srgb,var(--warm) 40%,var(--line))}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;font-weight:500;color:var(--ink);background:var(--paper)}
.btn:hover{border-color:color-mix(in srgb,var(--warm) 50%,var(--line))}
.btn.primary{background:var(--warm);color:var(--bg);border-color:var(--warm);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.quiet{background:none;border-color:transparent;color:var(--dim)}.btn.quiet:hover{color:var(--ink)}
.lnk{color:var(--warm);font-weight:500;font-size:13.5px}.lnk:hover{text-decoration:underline}

/* ---------- frame ---------- */
.app{display:grid;height:100dvh;grid-template-columns:var(--rackw,216px) minmax(0,1fr) var(--undw,312px);grid-template-rows:48px minmax(0,1fr)}
body.rack-min .app{--rackw:58px}
body.und-off .app{--undw:0px}
body.focus .app{--rackw:0px;--undw:0px}
#top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--rail)}
#switch{display:flex;align-items:center;gap:9px;height:34px;padding:0 10px 0 8px;border-radius:7px;min-width:0;max-width:340px}
#switch:hover{background:var(--sel)}
#switch .nm{min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#switch .dot{width:9px;height:9px;border-radius:2px;background:var(--warm);flex:none}
#switch .dot.all{background:none;border:1.5px solid var(--warm)}
.top-sp{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 9px;border-radius:7px;color:var(--dim);font-size:13px}
.tbtn:hover,.tbtn.on{color:var(--ink);background:var(--sel)}
#rack{grid-row:2;grid-column:1;border-right:1px solid var(--line);background:var(--rail);overflow-y:auto;overflow-x:hidden;padding:10px 8px 8px;display:flex;flex-direction:column}
body.focus #rack,body.focus #und{display:none}
.rk{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 9px;border-radius:7px;color:var(--dim);text-align:left;white-space:nowrap}
.rk:hover{color:var(--ink);background:var(--sel)}
.rk.on{color:var(--ink);background:var(--sel);box-shadow:inset 2px 0 0 var(--warm)}
.rk .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.rk .n{font-size:11px;color:var(--dim);width:16px;flex:none;font-variant-numeric:tabular-nums}
.cnt{min-width:20px;height:19px;padding:0 6px;border-radius:5px;background:color-mix(in srgb,var(--warm) 22%,transparent);color:var(--warm);font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.rk-gl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:14px 9px 5px;opacity:.85}
.rk-foot{margin-top:auto;padding-top:10px}
body.rack-min .rk .lbl,body.rack-min .rk .n,body.rack-min .rk-gl span{display:none}
body.rack-min .rk{justify-content:center;padding:0;position:relative}
body.rack-min .rk .cnt{position:absolute;top:1px;right:2px;min-width:15px;height:15px;font-size:10px;padding:0 3px}
body.rack-min .rk-gl{height:12px;padding:8px 0 0;border-top:1px solid var(--line);margin:8px 6px 4px}
main{grid-row:2;grid-column:2;overflow-y:auto;overflow-x:hidden;min-width:0;background:var(--bg)}
.wrap{padding:22px 28px 80px;max-width:1180px;margin:0 auto}
.thead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.retrow{flex-basis:100%;display:flex;align-items:center;gap:10px;font-size:12.5px;margin:-4px 0 -2px}
.retb{height:30px;font-size:13px;color:var(--warm)}
.since h4 .tag,.sec .tag{text-transform:none;letter-spacing:0;font-weight:400;margin-left:4px}
.note b .tag{font-size:10.5px;padding:0 4px;margin-left:4px;font-weight:400}
.thead h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
.thead h1 .n{color:var(--dim);font-weight:500;margin-right:8px;font-size:15px}
.thead .sp{flex:1}
.pstrip{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:-6px 0 16px;color:var(--dim)}
.pstrip button{color:var(--dim);padding:3px 0;border-bottom:1.5px solid transparent}
.pstrip button.on{color:var(--ink);border-color:var(--warm)}
.pstrip button:hover{color:var(--ink)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:34px 24px;text-align:center;color:var(--dim)}
.empty h3{color:var(--ink);font-size:16px;font-weight:600;margin:0 0 6px}
h2.sec{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.flash{animation:fl 1.8s ease-out}
@keyframes fl{0%,30%{background:var(--hl)}100%{background:transparent}}

/* ---------- understanding ---------- */
#und{grid-row:2;grid-column:3;border-left:1px solid var(--line);background:var(--rail);overflow-y:auto;overflow-x:hidden;padding:16px 16px 40px}
body.und-off #und{display:none}
.u-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.u-head b{font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-sec{border-top:1px solid var(--line);padding:12px 0}
.u-sec h4{margin:0 0 7px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600;display:flex;gap:6px;align-items:center}
.u-sec p{margin:0;font-size:13.5px;line-height:1.55}
.u-list{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.u-list li{font-size:13px;line-height:1.45}
.u-list .w{display:block;font-size:11.5px;color:var(--dim)}
.u-list .q{font-family:Lora,Georgia,serif}
.mine{border:1px solid color-mix(in srgb,var(--warm) 45%,var(--line));border-radius:9px;background:var(--paper);padding:10px 11px}
.mine .who{font-size:11.5px;color:var(--warm);font-weight:600;display:flex;justify-content:space-between}
.mine textarea{width:100%;min-height:74px;resize:vertical;border:0;background:none;outline:none;font-size:14px;line-height:1.55;padding:4px 0 0}
.addt{display:flex;gap:6px;margin-top:8px}
.addt input{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:0 9px;font-size:13px}
.thoughts{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.thoughts li{font-size:13px;border-left:2px solid var(--warm);padding-left:8px}
.thoughts li span{display:block;font-size:11px;color:var(--dim)}
.u-foot{font-size:11.5px;color:var(--dim);margin-top:10px}

/* ---------- bench ---------- */
.pickup{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px}
.pickup .lab{font-size:12px;color:var(--warm);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pickup h2{font-size:24px;margin:6px 0 2px;letter-spacing:-.015em;font-weight:600}
.pickup .meta{font-size:13px;color:var(--dim)}
.pickup blockquote{margin:16px 0 18px;padding:0 0 0 14px;border-left:2px solid var(--warm);font-size:16.5px;line-height:1.6;max-width:62ch}
.since h4{margin:0 0 8px;font-size:12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.since ul{list-style:none;padding:0;margin:0;display:grid;gap:9px}
.since li{font-size:13px;line-height:1.4;display:grid;grid-template-columns:8px 1fr;gap:8px}
.since li i{width:7px;height:7px;border-radius:50%;margin-top:6px;background:var(--dim)}
.since li i.agent{background:var(--warm)}
.since li small{display:block;color:var(--dim)}
.bench-cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;margin-top:28px}
.moves{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.moves li{border-bottom:1px solid var(--line)}
.move{display:grid;grid-template-columns:22px minmax(0,1fr) 18px;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 6px;border-radius:6px}
.move:hover{background:var(--sel)}
.move .t{font-size:14.5px;font-weight:500}
.move .w{font-size:12.5px;color:var(--dim)}
.move .ic{color:var(--dim)}
.search{display:flex;align-items:center;gap:8px;height:34px;border:1px solid var(--line);border-radius:7px;padding:0 9px;background:var(--paper);margin-bottom:6px}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:13.5px}
.alist{list-style:none;margin:0;padding:0}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;padding:8px 8px;border-radius:6px}
.arow:hover,.arow.sel{background:var(--sel)}
.arow.sel{box-shadow:inset 2px 0 0 var(--warm)}
.arow b{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .k{font-size:12px;color:var(--dim);white-space:nowrap}
.arow .s{grid-column:1/-1;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- material ---------- */
.drop{border:1.5px dashed color-mix(in srgb,var(--warm) 40%,var(--line));border-radius:11px;padding:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.drop.over{background:var(--hl)}
.drop .t{flex:1;min-width:200px}
.drop b{display:block;font-size:15px}
.mrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:start;padding:12px 4px;border-bottom:1px solid var(--line)}
.thumb{width:52px;height:52px;border-radius:7px;background:var(--sel);display:grid;place-items:center;color:var(--dim)}
.mrow b{font-weight:600}
.mrow .m{font-size:12.5px;color:var(--dim)}
.mrow .pv{margin-top:8px;font-family:Lora,Georgia,serif;font-size:14px;color:var(--ink);background:var(--paper);border-radius:7px;padding:9px 11px;border:1px solid var(--line)}
.mrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:300px}
.state{font-size:12px;font-weight:600}
.state.new{color:var(--warm)}.state.processed,.state.transcribed{color:var(--good)}
.review{margin-top:26px;border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--lift)}
.review .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn[aria-disabled="true"]{opacity:.55}

/* ---------- source ---------- */
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tline{display:grid;grid-template-columns:52px 64px minmax(0,1fr);gap:10px;padding:9px 8px;border-radius:7px;cursor:pointer;align-items:baseline}
.tline:hover{background:var(--sel)}
.tline .tm{font:12px ui-monospace,Menlo,monospace;color:var(--dim)}
.tline .who{font-size:12.5px;font-weight:600;color:var(--dim)}
.tline .tx{font-family:Lora,Georgia,serif;font-size:16px;line-height:1.6}
.unc{text-decoration:underline dotted var(--warnc) 2px;text-underline-offset:4px}
.tline .fx{font-size:11.5px;color:var(--good);margin-left:8px;font-family:"Plus Jakarta Sans",sans-serif}
.fix{grid-column:3;margin-top:8px}
.fix textarea{width:100%;min-height:62px;border:1px solid var(--warm);border-radius:7px;background:var(--paper);padding:8px 10px;font:16px/1.55 Lora,Georgia,serif;outline:none}
.fix .row{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}

/* ---------- research ---------- */
.rgrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.pbtn{display:grid;grid-template-columns:10px 1fr;gap:10px;width:100%;text-align:left;padding:10px;border-radius:7px}
.pbtn:hover,.pbtn.on{background:var(--sel)}
.pbtn.on{box-shadow:inset 2px 0 0 var(--warm)}
.lv{width:9px;height:9px;border-radius:50%;margin-top:5px}
.lv.settled{background:var(--good)}.lv.likely{background:var(--dim)}.lv.unsure{background:var(--warnc)}.lv.disputed{background:var(--bad)}
.pbtn small{display:block;color:var(--dim);font-size:12px}
.pdet h3{font-size:19px;margin:0 0 10px;font-weight:600;line-height:1.35}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:6px 11px;font-size:13px;color:var(--dim);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--sel);color:var(--ink);font-weight:600}
.ev{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.ev li{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.ev q{font-family:Lora,Georgia,serif;font-size:15.5px;line-height:1.55;display:block;quotes:none}
.ev .src{font-size:12px;color:var(--dim);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.thread{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.msg{padding:9px 12px;border-radius:9px;margin-bottom:8px;font-size:14px;max-width:560px}
.msg.you{background:var(--paper);border:1px solid color-mix(in srgb,var(--warm) 40%,var(--line))}
.msg.sys{color:var(--warnc);font-size:13px;padding:2px 0}
.msg small{display:block;color:var(--dim);font-size:11.5px}
.compose{display:flex;gap:8px;align-items:flex-end;margin-top:8px;max-width:600px}
.compose textarea{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px 10px;resize:vertical;font-size:14px;outline:none}

/* ---------- direction ---------- */
.angles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:10px}
.angle{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--paper)}
.angle.chosen{border-color:var(--warm);box-shadow:inset 0 0 0 1px var(--warm)}
.angle.rej{opacity:.6}
.angle h3{margin:0 0 6px;font-size:16px}
.angle p{margin:0 0 12px;font-size:14px;color:var(--dim)}
.angle .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- write ---------- */
.wbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.doc h1.dt{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px;max-width:700px;outline:none}
.doc .by{font-size:13px;color:var(--dim);margin-bottom:22px}
.wrow{display:grid;grid-template-columns:minmax(0,700px) 230px;gap:34px;align-items:start}
body.focus .wrow{grid-template-columns:minmax(0,700px)}
body.focus .margin{display:none}
body.focus .doc{margin:0 auto;max-width:700px}
.para{font:17px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0 0 1.05em;outline:none;border-radius:4px;padding:1px 4px;margin-left:-4px}
.para:focus{background:color-mix(in srgb,var(--sel) 50%,transparent)}
.para mark{background:var(--hl);color:inherit;border-radius:3px;box-shadow:0 0 0 2px var(--hl)}
.para.last{box-shadow:-10px 0 0 -8px var(--warm)}
.prot{border-bottom:1.5px solid color-mix(in srgb,var(--good) 70%,transparent)}
.margin{display:grid;gap:8px;padding-top:3px}
.note{display:block;width:100%;text-align:left;border-left:2px solid var(--line);padding:4px 0 4px 10px;font-size:12.5px;line-height:1.45;color:var(--dim)}
.note:hover,.note.on{border-color:var(--warm);color:var(--ink)}
.note b{display:block;font-size:11.5px;font-weight:600;color:var(--dim)}
.note.agent b{color:var(--warm)}
.note .r{display:inline-block;margin-top:4px;color:var(--warm);font-weight:600}
.legend{font-size:12px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap;margin-top:24px;border-top:1px solid var(--line);padding-top:10px}

/* ---------- read ---------- */
.reader{max-width:680px;margin:0 auto}
.reader h1{font-size:34px;letter-spacing:-.02em;line-height:1.2;margin:10px 0 6px}
.reader p{font:18px/1.7 system-ui,-apple-system,sans-serif;margin:0 0 1.1em}

/* ---------- media ---------- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.asset{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.asset.new{border-color:color-mix(in srgb,var(--warm) 55%,var(--line))}
.ph{aspect-ratio:4/3;display:grid;place-items:center;color:rgba(255,255,255,.55);position:relative}
.ph .tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.35);color:#eee;border:0}
.ph .dur{position:absolute;bottom:8px;right:8px;font-size:11px;color:#eee;background:rgba(0,0,0,.4);padding:1px 5px;border-radius:4px}
.asset .b{padding:10px 12px}
.asset .cap{font-size:13.5px;font-weight:500}
.asset .by{font-size:11.5px;color:var(--dim)}
.used{margin-top:6px;font-size:12.5px}
.used span{color:var(--dim)}
.used button{color:var(--warm);margin-right:8px}
.used button:hover{text-decoration:underline}
.asset .acts{display:flex;gap:6px;margin-top:8px}
.asset .acts .btn{height:28px;font-size:12.5px;padding:0 9px}
.filt{display:flex;gap:16px;font-size:13px}
.filt button{color:var(--dim);border-bottom:1.5px solid transparent;padding:3px 0}
.filt button.on{color:var(--ink);border-color:var(--warm)}

/* ---------- arrange ---------- */
.seq{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}
.slide{position:relative;aspect-ratio:4/5;border:1px solid var(--line);border-radius:10px;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
.slide.draft{border:1.5px dashed var(--warm)}
.slide.dragging,.lblock.dragging{opacity:.55;outline:2px solid var(--warm)}
.slide .sh{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:11.5px;color:var(--dim);border-bottom:1px solid var(--line)}
.handle{cursor:grab;touch-action:none;color:var(--dim);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:5px}
.handle:hover{background:var(--sel);color:var(--ink)}
.slide .img{height:38%;flex:none}
.slide .st{flex:1;padding:10px 11px;font-size:15px;line-height:1.35;font-weight:600;outline:none;overflow:auto}
.slide .df{padding:7px 8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--warm);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.slide .df .btn{height:26px;font-size:12px;padding:0 8px}
.addslide{aspect-ratio:4/5;border:1.5px dashed var(--line);border-radius:10px;color:var(--dim);display:grid;place-items:center;width:100%}
.addslide:hover{color:var(--ink);border-color:var(--warm)}
.lblocks{display:grid;gap:8px;max-width:760px}
.lblock{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);font-size:13.5px}
.lblock .x{color:var(--dim);font-size:12px}

/* ---------- audience ---------- */
.aud{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px;align-items:start}
.phone{width:320px;max-width:100%;margin:0 auto;border:1px solid var(--line);border-radius:28px;padding:14px 10px 18px;background:var(--rail)}
.phone .hdr{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:0 6px 10px}
.phone .av{width:26px;height:26px;border-radius:50%;background:var(--warm)}
.swipe{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:6px}
.swipe>div{flex:0 0 100%;aspect-ratio:4/5;scroll-snap-align:start;background:var(--paper);display:flex;flex-direction:column}
.swipe .img{height:45%}
.swipe p{margin:0;padding:14px;font-size:17px;font-weight:600;line-height:1.35}
.cap2{font-size:13px;padding:10px 6px 0}
.page{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:34px 36px;max-width:680px}
.page h1{font-size:28px;margin:0 0 8px;letter-spacing:-.02em}
.page p{font:17px/1.7 system-ui,sans-serif;margin:0 0 1em}

/* ---------- outputs ---------- */
.origin{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--lift);display:flex;gap:12px;align-items:center}
.otree{margin:0 0 0 26px;padding:0;list-style:none;border-left:1px solid var(--line)}
.otree li{position:relative;padding:12px 0 12px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;border-bottom:1px solid var(--line)}
.otree li::before{content:"";position:absolute;left:0;top:24px;width:16px;border-top:1px solid var(--line)}
.otree b{font-weight:600}
.otree small{grid-column:1;color:var(--dim);font-size:12.5px}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.exp .x{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:var(--paper)}
.exp .x b{display:block;font-size:14px}
.exp .x span{display:block;color:var(--dim);font-size:12.5px;margin:2px 0 8px}

/* ---------- finder / sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:40}
.scrim.on{display:block}
#finder{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 24px));background:var(--paper);border:1px solid var(--line);border-radius:12px;z-index:50;display:none;box-shadow:0 24px 60px rgba(0,0,0,.45);overflow:hidden}
#finder.on{display:block}
#finder .fi{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
#finder input{flex:1;height:50px;border:0;background:none;outline:none;font-size:15.5px}
#finder ul{list-style:none;margin:0;padding:6px;max-height:min(420px,60vh);overflow:auto}
#finder li button{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:7px}
#finder li button.sel{background:var(--sel)}
#finder li .s{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#finder .gh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);padding:8px 10px 4px}
#bbar{display:none}
#gsheet{display:none}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--paper);border:1px solid var(--line);color:var(--ink);padding:9px 14px;border-radius:9px;font-size:13px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.35)}

 if(S.scope!=='all')return S.scope;

/* ---------------- main render ---------------- */
function render(keepScroll){
 const main=$('#main');const st=main.scrollTop;
 document.body.className=document.body.className.replace(/\bv-\S+/g,'').trim();document.body.classList.add('v-'+S.view);
 renderTop();renderRack();renderUnd();
 main.innerHTML=(V[S.view]||V.bench)();
 if(keepScroll)main.scrollTop=st;else main.scrollTop=0;
 afterRender();
}
function afterRender(){
 const x=S.target;S.target=null;
 if(x){
  let el=null;
  if(x==='first-unclear'&&S.view==='source'){const p=resolveProj('source');const i=SRC[p].lines.findIndex(l=>l.unclear&&!l.fixed);if(i>=0)el=$('#ln-'+i);}
  else if(x==='notes'){el=document.querySelector('.note.agent');}
  else if(S.view==='source'){const p=resolveProj('source');const i=SRC[p].lines.findIndex(l=>l.t===x);if(i>=0)el=$('#ln-'+i);}
  else el=$('#pa-'+x)||$('#sl-'+x)||$('#it-'+x)||$('#as-'+x);
  if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('flash');if(el.classList.contains('para')){placeCaretEnd(el);}}
 }
 const drop=$('#drop');
 if(drop){
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');addFiles(e.dataTransfer.files);});
 }
}
function placeCaretEnd(el){try{el.focus({preventScroll:true});const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);}catch(e){}}
function addFiles(files){
 const p=S.scope==='all'?resolveProj('material'):S.scope;
 [...files].forEach((f,i)=>{const k=/audio/.test(f.type)?'audio':/image/.test(f.type)?'image':/video/.test(f.type)?'video':/pdf/.test(f.type)?'doc':'text';
  MAT.unshift({id:'u'+Date.now()+i,p,name:f.name,kind:k,meta:`${Math.max(1,Math.round(f.size/1024))} KB · kept in this page only — nothing uploaded`,by:'You · just now',state:'new',preview:'Preview of new files isn’t connected in this prototype.'});});
 if(files.length){toast(`${files.length} added to ${PN(p)} — prototype, nothing uploaded`);render(true);}
}
let toastT;
function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}t.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600);}
function honest(btn,msg){
 const host=btn.closest('.acts,.row,.thead,.tbar,.x,p,.empty,div')||btn.parentElement;
 let s=host.querySelector(':scope > .honest');
 if(!s){s=document.createElement('span');s.className='honest';s.setAttribute('role','status');host.appendChild(s);}
 s.textContent=msg;
}

/* ---------------- navigation ---------------- */
function go(tool,p,x){
 closeSheets();
 // leaving Write remembers the exact paragraph, so every tool can offer the way back
 if(S.view==='write'&&tool!=='write'){const wp=resolveProj('write');const d=DOCS[wp];if(d){const i=d.paras.findIndex(q=>q.id===d.last);S.ret={p:wp,pid:d.last,n:i+1};}}
 if(p){ if(S.scope!=='all'&&S.scope!==p)S.scope=p; if(S.scope==='all')S.toolProj={[tool]:p}; S.work=p; }
 if(tool==='write'&&!x){const d=DOCS[p||resolveProj('write')];if(d&&d.last)x=d.last;}
 if(tool==='write')S.ret=null;
 S.view=tool;S.target=x||null;S.fixing=null;S.activeNote=null;
 if(tool!=='write')document.body.classList.remove('focus');
 render();
}
function setScope(p){S.scope=p;if(p!=='all')S.work=p;S.sel=0;closeSheets();render();}
function closeSheets(){document.body.classList.remove('und-sheet');$('#gsheet').classList.remove('on');$('.scrim.f').classList.remove('on');}
const isPhone=()=>matchMedia('(max-width:760px)').matches;
const narrowAside=()=>matchMedia('(min-width:761px) and (max-width:1360px)').matches&&(S.view==='write'||S.view==='arrange');
const undShown=()=>!document.body.classList.contains('und-off')&&!(narrowAside()&&!document.body.classList.contains('und-pin'));
function toggleUnd(){
 if(isPhone()){document.body.classList.toggle('und-sheet');return;}
 if(narrowAside()){const on=undShown();document.body.classList.toggle('und-pin',!on);if(!on)document.body.classList.remove('und-off');renderTop();return;}
 document.body.classList.toggle('und-off');renderTop();
}
function openThought(){
 if(isPhone())document.body.classList.add('und-sheet');else{document.body.classList.remove('und-off','focus');if(narrowAside())document.body.classList.add('und-pin');}
 renderTop();
 setTimeout(()=>{const q=$('#quickT');if(q)q.focus();},30);
}

/* ---------------- finder ---------------- */
let fsel=0,fitems=[];
function openFinder(){$('#finder').classList.add('on');$('.scrim.f').classList.add('on');const q=$('#fq');q.value='';fsel=0;fillFinder();q.focus();}
function closeFinder(){$('#finder').classList.remove('on');$('.scrim.f').classList.remove('on');}
function fillFinder(){
 const q=$('#fq').value.trim().toLowerCase();
 const pr=[{type:'scope',id:'all',label:'All projects',sub:'Everything active, one bench'}].concat(P.map(p=>({type:'scope',id:p.id,label:p.name,sub:stateLine(p.id)})));
 const tl=[{type:'tool',id:'bench',label:'The bench',sub:'Pick up and next moves'}].concat(TOOLS.map(t=>({type:'tool',id:t.id,label:`${t.n} ${t.label}`,sub:t.g})));
 const f=a=>a.filter(x=>!q||(x.label+' '+x.sub).toLowerCase().includes(q));
 const a=f(pr),b=f(tl);fitems=a.concat(b);if(fsel>=fitems.length)fsel=0;
 let i=0;const row=x=>{const k=i++;return `<li><button class="${k===fsel?'sel':''}" data-act="fpick" data-k="${k}">${x.type==='scope'?`<span style="width:9px;height:9px;border-radius:2px;${x.id==='all'?'border:1.5px solid var(--warm)':'background:var(--warm)'}"></span>`:ic(x.id)}<span><b style="font-weight:600">${esc(x.label)}</b><br><span class="s">${esc(x.sub)}</span></span>${x.type==='scope'&&x.id===S.scope?'<span class="tag">current</span>':''}</button></li>`;};
 $('#flist').innerHTML=(a.length?`<li class="gh">Projects</li>`+a.map(row).join(''):'')+(b.length?`<li class="gh">Tools</li>`+b.map(row).join(''):'')+(!fitems.length?'<li class="dim" style="padding:12px">Nothing matches.</li>':'');
}
function pickFinder(k){const x=fitems[k];if(!x)return;closeFinder();if(x.type==='scope')setScope(x.id);else go(x.id);}

/* ---------------- drag reorder (pointer, works with touch) ---------------- */
let drag=null;
document.addEventListener('pointerdown',e=>{
 const h=e.target.closest('[data-handle]');if(!h)return;
 const item=h.closest('[data-idx]');if(!item)return;
 e.preventDefault();drag={item,box:item.parentElement};item.classList.add('dragging');
});
document.addEventListener('pointermove',e=>{
 if(!drag)return;
 const el=document.elementFromPoint(e.clientX,e.clientY);const over=el&&el.closest('[data-idx]');
 if(!over||over===drag.item||over.parentElement!==drag.box)return;
 const kids=[...drag.box.children];const oi=kids.indexOf(over),di=kids.indexOf(drag.item);
 drag.box.insertBefore(drag.item,oi>di?over.nextSibling:over);
});
function endDrag(){
 if(!drag)return;
 const order=[...drag.box.children].map(c=>+c.dataset.idx);const key=drag.box.dataset.sortable;
 drag.item.classList.remove('dragging');drag=null;
 const p=resolveProj('arrange');
 if(key==='car'){const s=CAR[p].slides;CAR[p].slides=order.map(i=>s[i]);}
 if(key==='art'){const s=DOCS[p].paras;DOCS[p].paras=order.map(i=>s[i]);}
 render(true);
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

/* ---------------- actions ---------------- */
const A={
 go:el=>go(el.dataset.tool,el.dataset.p||null,el.dataset.x||null),
 ret:()=>{const r=S.ret;if(r)go('write',r.p,r.pid);},
 scope:el=>setScope(el.dataset.p),
 toolproj:el=>{S.toolProj[S.view]=el.dataset.p;S.work=el.dataset.p;S.fixing=null;render();},
 finder:()=>openFinder(),
 fpick:el=>pickFinder(+el.dataset.k),
 closeall:()=>{closeFinder();closeSheets();},
 und:()=>toggleUnd(),
 thought:()=>openThought(),
 theme:()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('arc-c-theme',r.dataset.theme);}catch(e){}renderTop();},
 focus:()=>{document.body.classList.toggle('focus');render(true);},
 rackmin:()=>{document.body.classList.toggle('rack-min');renderRack();},
 gsheet:el=>{const g=el.dataset.g;const sh=$('#gsheet');if(sh.classList.contains('on')&&sh.dataset.g===g){sh.classList.remove('on');return;}sh.dataset.g=g;sh.innerHTML=`<div class="rk-gl"><span>${g}</span></div>`+TOOLS.filter(t=>t.g===g).map(rackBtn).join('');sh.classList.add('on');},
 honest:el=>honest(el,el.dataset.msg),
 addthought:()=>{const q=$('#quickT');const v=q&&q.value.trim();if(!v){q&&q.focus();return;}U[curProj()].thoughts.unshift({t:v,w:'You · just now (not saved)'});renderUnd();setTimeout(()=>{const n=$('#quickT');n&&n.focus();},0);},
 pickfile:()=>$('#filein').click(),
 processed:el=>{const m=MAT.find(x=>x.id===el.dataset.id);if(m)m.state='processed';render(true);},
 pv:el=>{S.openPv[el.dataset.id]=!S.openPv[el.dataset.id];render(true);},
 fixline:el=>{const i=+el.dataset.i;if(S.fixing===i)return;S.fixing=i;render(true);const b=$('#fixBox');if(b){b.focus();b.select();}},
 cancelfix:()=>{S.fixing=null;render(true);},
 savefix:el=>{const p=resolveProj('source');const l=SRC[p].lines[+el.dataset.i];const v=$('#fixBox').value.trim();
  if(v&&v!==l.text){U[p].corrections.unshift({t:`${l.t} “${l.text.slice(0,40)}${l.text.length>40?'…':''}” → “${v.slice(0,40)}${v.length>40?'…':''}”`,w:'From Source · carries into Research, Write and outputs'});l.text=v;}
  l.fixed=true;S.fixing=null;render(true);},
 rpoint:el=>{S.research[resolveProj('research')]=el.dataset.id;render(true);},
 level:el=>{const p=resolveProj('research');const r=RES[p].find(x=>x.id===el.dataset.id);r.level=el.dataset.l;S.research[p]=r.id;render(true);},
 discuss:el=>{const p=resolveProj('research');const r=RES[p].find(x=>x.id===el.dataset.id);const v=$('#discuss').value.trim();if(!v)return;
  r.thread.push({who:'you',text:v,when:'just now'});r.thread.push({who:'sys',text:'AI isn’t connected here yet — no answer was generated. Your question is kept with this point.'});S.research[p]=r.id;render(true);},
 choose:el=>{const p=resolveProj('direction');const d=DIR[p];d.chosen=el.dataset.id;const a=d.angles.find(x=>x.id===d.chosen);
  U[p].decisions.unshift({t:`Angle: ${a.title}`,w:'Just now · Direction'});
  d.angles.filter(x=>x.id!==d.chosen).forEach(x=>{if(!U[p].rejected.some(r=>r.t===x.title))U[p].rejected.unshift({t:x.title,w:'Every piece in this project'});});
  render(true);},
 unchoose:()=>{const p=resolveProj('direction');DIR[p].chosen=null;render(true);},
 newdir:()=>{const p=resolveProj('direction');DIR[p]={mine:'',chosen:null,angles:[]};render(true);},
 newdoc:()=>{const p=resolveProj('write');DOCS[p]={title:'Untitled',kind:'Piece',last:'x1',paras:[{id:'x1',text:'Start here.'}],notes:[]};S.target='x1';render();},
 note:(el,e)=>{
  if(e&&e.target.closest('[data-act="resolve"]'))return;
  const p=resolveProj('write');const n=DOCS[p].notes.find(x=>x.id===el.dataset.id);if(!n)return;
  document.querySelectorAll('.para mark').forEach(m=>{const t=document.createTextNode(m.textContent);m.replaceWith(t);});
  document.querySelectorAll('.note.on').forEach(x=>x.classList.remove('on'));el.classList.add('on');S.activeNote=n.id;
  const para=$('#pa-'+n.pid);if(!para)return;
  if(!wrapPhrase(para,n.phrase))para.classList.add('flash');
  para.scrollIntoView({block:'center',behavior:'smooth'});
 },
 resolve:el=>{const p=resolveProj('write');const n=DOCS[p].notes.find(x=>x.id===el.dataset.id);if(n)n.done=1;render(true);},
 mfilt:el=>{S.mediaF=el.dataset.f;render(true);},
 keepasset:el=>{const m=MEDIA.find(x=>x.id===el.dataset.id);if(m){m.isNew=0;m.by=m.by.replace('imported','imported')+' · kept by you';}render(true);},
 setaside:el=>{const i=MEDIA.findIndex(x=>x.id===el.dataset.id);if(i>=0)MEDIA.splice(i,1);toast('Set aside — still in the Library, not in this project (prototype)');render(true);},
 keepall:()=>{MEDIA.forEach(m=>{if(m.isNew&&(S.scope==='all'||m.p===S.scope)){m.isNew=0;m.by+=' · kept by you';}});render(true);},
 amode:el=>{S.arrangeMode[resolveProj('arrange')]=el.dataset.m;render(true);},
 aumode:el=>{S.audMode[resolveProj('audience')]=el.dataset.m;render(true);},
 accept:el=>{const s=CAR[resolveProj('arrange')].slides.find(x=>x.id===el.dataset.id);if(s){delete s.draft;delete s.prev;}render(true);},
 discard:el=>{const s=CAR[resolveProj('arrange')].slides.find(x=>x.id===el.dataset.id);if(s){s.text=s.prev||'';delete s.draft;delete s.prev;}render(true);},
 addslide:()=>{const c=CAR[resolveProj('arrange')];c.slides.push({id:'s'+Date.now(),text:'New slide — type here'});render(true);}
};
function wrapPhrase(el,phrase){
 const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let node;
 while((node=walker.nextNode())){const i=node.nodeValue.indexOf(phrase);if(i>=0){const r=document.createRange();r.setStart(node,i);r.setEnd(node,i+phrase.length);const m=document.createElement('mark');try{r.surroundContents(m);}catch(e){return false;}return true;}}
 // phrase may span a protected-phrase span: fall back to whole-text search
 if(el.textContent.includes(phrase)){el.classList.add('flash');return true;}
 return false;
}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 if(e.target.closest('[data-stop]')&&el.dataset.act==='fixline')return;
 if(el.dataset.act==='honest'||el.getAttribute('aria-disabled')==='true'){e.preventDefault();honest(el,el.dataset.msg||'Not connected yet.');return;}
 const f=A[el.dataset.act];if(f){if(el.tagName==='A')e.preventDefault();f(el,e);}
});

/* ---------------- editing binds (no re-render while typing) ---------------- */
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='mineBox'){U[curProj()].mine=t.value;return;}
 if(t.id==='aq'){S.q=t.value;S.sel=0;const pos=t.selectionStart;render(true);const n=$('#aq');if(n){n.focus();n.setSelectionRange(pos,pos);}return;}
 if(t.id==='fq'){fsel=0;fillFinder();return;}
 if(t.dataset.bind==='dir'){DIR[resolveProj('direction')].mine=t.value;return;}
 if(t.dataset.bind==='title'){DOCS[resolveProj('write')].title=t.textContent;return;}
 if(t.dataset.pid){const p=resolveProj('write');const x=DOCS[p].paras.find(q=>q.id===t.dataset.pid);if(x){x.text=t.innerText.replace(/\n+$/,'');DOCS[p].last=x.id;}return;}
 if(t.dataset.sid){const s=CAR[resolveProj('arrange')].slides.find(q=>q.id===t.dataset.sid);if(s)s.text=t.innerText;return;}
});
document.addEventListener('focusin',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.pid&&S.view==='write'){const d=DOCS[resolveProj('write')];if(d)d.last=t.dataset.pid;}});
$('#filein').addEventListener('change',e=>{addFiles(e.target.files);e.target.value='';});

/* ---------------- keyboard ---------------- */
const typing=t=>t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
document.addEventListener('keydown',e=>{
 const k=e.key;
 if((e.metaKey||e.ctrlKey)&&k.toLowerCase()==='k'){e.preventDefault();$('#finder').classList.contains('on')?closeFinder():openFinder();return;}
 if($('#finder').classList.contains('on')){
  if(k==='Escape'){closeFinder();return;}
  if(k==='ArrowDown'){e.preventDefault();fsel=Math.min(fitems.length-1,fsel+1);fillFinder();return;}
  if(k==='ArrowUp'){e.preventDefault();fsel=Math.max(0,fsel-1);fillFinder();return;}
  if(k==='Enter'){e.preventDefault();pickFinder(fsel);return;}
  return;
 }
 if(k==='Escape'){if(document.body.classList.contains('focus')){document.body.classList.remove('focus');render(true);}closeSheets();if(S.fixing!=null){S.fixing=null;render(true);}return;}
 if(e.target.id==='quickT'&&k==='Enter'){e.preventDefault();A.addthought();return;}
 if(e.target.id==='aq'&&(k==='ArrowDown'||k==='ArrowUp'||k==='Enter')){e.preventDefault();benchKey(k==='ArrowDown'?'j':k==='ArrowUp'?'k':'Enter');return;}
 if(e.target.classList&&e.target.classList.contains('tline')&&k==='Enter'){A.fixline(e.target);return;}
 if(typing(e.target)||e.metaKey||e.ctrlKey||e.altKey)return;
 if(k==='t'||k==='T'){e.preventDefault();openThought();return;}
 if(k==='['){document.body.classList.toggle('rack-min');renderRack();return;}
 if(k===']'){toggleUnd();return;}
 if(k==='/'&&S.view==='bench'){e.preventDefault();const a=$('#aq');a&&a.focus();return;}
 if(S.view==='bench'&&(k==='j'||k==='k'||k==='Enter'))benchKey(k);
});
function benchKey(k){
 const rows=[...document.querySelectorAll('#alist .arow')];if(!rows.length)return;
 if(k==='j')S.sel=Math.min(rows.length-1,S.sel+1);
 else if(k==='k')S.sel=Math.max(0,S.sel-1);
 else if(k==='Enter'){rows[S.sel]&&setScope(rows[S.sel].dataset.p);return;}
 rows.forEach((r,i)=>r.classList.toggle('sel',i===S.sel));rows[S.sel].scrollIntoView({block:'nearest'});
}

if(isPhone())document.body.classList.remove('und-off');
render();
})();
</script>
