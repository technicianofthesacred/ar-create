<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Create — The Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#141310;--paper:#1d1b16;--ink:#e7e1d3;--dim:#a39e8e;--line:#2d2a23;--warm:#c9a874;--rail:#191813;--lift:#191813;--sel:#2c2a22;--good:#8fb08a;--warnc:#d9a95a;--bad:#e08a74;
  --ui:"Plus Jakarta Sans",system-ui,sans-serif;--doc:system-ui,-apple-system,"Segoe UI",sans-serif;--quote:"Lora",Georgia,serif;color-scheme:dark}
:root[data-theme="light"]{--bg:#efede6;--paper:#fffefb;--ink:#2d302a;--dim:#686c61;--line:#e2e0d8;--warm:#7a5a30;--rail:#f7f5ef;--lift:#f7f5ef;--sel:#e9e4d7;--good:#3f6146;--warnc:#94600f;--bad:#a23b2a;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--ui);overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--warm);outline-offset:2px;border-radius:4px}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--warm) 45%,transparent) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--warm) 45%,transparent);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--warm) 70%,transparent)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.ic.sm svg{width:13px;height:13px}
.dim{color:var(--dim)}
.tag{font-size:11px;letter-spacing:.02em;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.tag.warm{color:var(--warm);border-color:color-mix(in srgb,var(--warm) 40%,transparent)}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-weight:500;background:var(--paper);white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--warm) 50%,var(--line))}
.btn.primary{background:var(--warm);color:var(--bg);border-color:var(--warm)}
.btn.ghost{background:none}
.btn.on{border-color:var(--warm);color:var(--warm)}
.link{color:var(--warm);font-weight:500;font-size:13px}
.link:hover{text-decoration:underline}
.tone-good{color:var(--good)}.tone-warn{color:var(--warnc)}.tone-bad{color:var(--bad)}.tone-dim{color:var(--dim)}
.who{font-size:11px;font-weight:600;letter-spacing:.03em;padding:1px 6px;border-radius:4px;background:var(--sel);color:var(--dim);white-space:nowrap}
.who.claude{color:var(--warm)}.who.codex{color:var(--good)}.who.you{color:var(--ink)}

/* ---------- frame ---------- */
.top{height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--rail)}
.brand{font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand span{color:var(--warm);font-weight:500}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;font-size:13px;color:var(--dim)}
.crumbs button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.crumbs button:hover{color:var(--ink)}
.crumbs .cur{color:var(--ink);font-weight:500}
.crumbs .sep{opacity:.5}
.top .sp{flex:1}
.iconbtn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--dim)}
.iconbtn:hover{background:var(--sel);color:var(--ink)}
.phone-only{display:none!important}
.app{display:grid;grid-template-columns:288px minmax(0,1fr);height:calc(100dvh - 48px)}
.app.rail{grid-template-columns:56px minmax(0,1fr)}
#main{overflow:auto;min-width:0;position:relative}

/* ---------- side ---------- */
.side{border-right:1px solid var(--line);background:var(--rail);display:flex;flex-direction:column;min-height:0}
.side-head{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px}
.search{display:flex;align-items:center;gap:6px;height:34px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:var(--bg);color:var(--dim)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:13px;color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:4px}
.filters button{font-size:12px;padding:3px 8px;border-radius:5px;color:var(--dim);border:1px solid transparent}
.filters button:hover{color:var(--ink)}
.filters button.on{color:var(--ink);border-color:var(--line);background:var(--bg)}
.filters .n{color:var(--warm);margin-left:3px}
.plist{overflow:auto;flex:1;padding:4px 6px 12px}
.prow{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:6px;border-left:2px solid transparent}
.prow:hover{background:var(--sel)}
.prow.on{background:var(--sel);border-left-color:var(--warm)}
.prow .t{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px}
.prow .t .wait{width:7px;height:7px;border-radius:50%;background:var(--warnc);flex:none}
.prow .marks{display:flex;gap:3px;margin:4px 0 3px;color:var(--dim)}
.prow .st{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .touch{font-size:11px;color:var(--dim);margin-top:2px}
.side-foot{padding:8px 12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.rail .side-head .search,.rail .filters,.rail .prow .marks,.rail .prow .st,.rail .prow .touch,.rail .side-foot .lbl{display:none}
.rail .side-head{padding:10px 6px}
.rail .prow{padding:8px 0;text-align:center;border-left:0}
.rail .prow .t{justify-content:center;position:relative}
.rail .prow .t .full{display:none}
.mono{display:none;width:32px;height:32px;border-radius:6px;background:var(--bg);border:1px solid var(--line);align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--dim)}
.rail .mono{display:inline-flex}
.rail .prow.on .mono{border-color:var(--warm);color:var(--warm)}
.rail .prow .t .wait{position:absolute;top:0;right:8px}
.empty-list{padding:16px 10px;color:var(--dim);font-size:13px}

/* ---------- context tabs ---------- */
.ctx{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:stretch;gap:2px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.ctx::-webkit-scrollbar{display:none}
.ctx .g{display:flex;align-items:center;gap:1px;padding-right:10px;margin-right:6px;border-right:1px solid var(--line)}
.ctx .g:last-child{border-right:0}
.ctx .gl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);opacity:.75;margin-right:6px;white-space:nowrap}
.ctx button{font-size:13px;color:var(--dim);padding:11px 8px 10px;border-bottom:2px solid transparent;white-space:nowrap}
.ctx button:hover{color:var(--ink)}
.ctx button.on{color:var(--ink);border-bottom-color:var(--warm);font-weight:500}
.ctx .board-tab{font-weight:600}
.secwrap{padding:20px 24px 60px;max-width:1400px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h2{margin:0;font-size:20px;font-weight:600}
.sec-head .num{font-size:12px;color:var(--warm);font-weight:600}
.sec-head p{margin:0;color:var(--dim);font-size:13.5px;flex:1;min-width:200px}
.sec-head .acts{display:flex;gap:6px;flex-wrap:wrap}
.pick{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 16px;align-items:center}
.pick .lbl{font-size:12px;color:var(--dim);margin-right:4px}
.pick button{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 9px;border:1px solid var(--line);border-radius:5px;color:var(--dim)}
.pick button.on{color:var(--ink);border-color:var(--warm)}
.honest{font-size:12.5px;color:var(--dim);display:flex;gap:6px;align-items:flex-start}
.honest .ic{color:var(--warnc);margin-top:1px}

/* ---------- home ---------- */
.home{padding:28px 28px 60px;max-width:1400px}
.home h1{font-size:26px;font-weight:600;margin:0 0 4px}
.home .lede{color:var(--dim);margin:0 0 24px;font-size:14.5px}
.strip{margin-bottom:28px}
.strip h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 10px;font-weight:600;display:flex;gap:8px;align-items:center}
.wait-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.wcard{text-align:left;border:1px solid var(--line);border-left:3px solid var(--warnc);border-radius:6px;padding:12px 14px;background:var(--paper)}
.wcard:hover{border-color:color-mix(in srgb,var(--warm) 50%,var(--line));border-left-color:var(--warnc)}
.wcard .s{font-size:12px;color:var(--dim)}
.wcard .a{font-weight:500;margin-top:3px}
.wcard .go{font-size:12.5px;color:var(--warm);margin-top:6px}
.feed{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.feed button{display:flex;gap:10px;align-items:baseline;text-align:left;padding:9px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.feed button:hover .what{color:var(--warm)}
.feed .when{font-size:12px;color:var(--dim);margin-left:auto;white-space:nowrap}
.feed .subj{font-weight:600}
.feed .what{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tile{text-align:left;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--paper);display:flex;flex-direction:column;gap:10px;min-width:0}
.tile:hover{border-color:color-mix(in srgb,var(--warm) 50%,var(--line))}
.tile h4{margin:0;font-size:15.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.tile .left{font-size:12.5px;color:var(--dim)}
.tile .left b{color:var(--ink);font-weight:500}
.tile .minis{display:flex;gap:8px;overflow:hidden;min-height:74px}
.tile .foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);gap:8px}
.tile.new{align-items:center;justify-content:center;border-style:dashed;color:var(--dim);min-height:180px;text-align:center}

/* miniatures */
.mini{flex:none;width:96px;height:74px;border:1px solid var(--line);border-radius:5px;background:var(--bg);padding:6px;overflow:hidden;display:flex;flex-direction:column;gap:3px;font-size:9px;line-height:1.25;color:var(--dim)}
.mini b{color:var(--ink);font-size:9.5px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini.car{flex-direction:row;gap:3px;padding:6px 5px;align-items:flex-start}
.mini.car i{display:block;width:21px;aspect-ratio:4/5;border:1px solid var(--line);border-radius:2px;background:var(--sel)}
.mini.car i.e{background:none;border-style:dashed}
.mini .k{display:flex;align-items:center;gap:3px;color:var(--dim)}
.mini .k .ic svg{width:10px;height:10px}

/* ---------- board ---------- */
.bhead{padding:20px 24px 4px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
.bhead h1{margin:0;font-size:24px;font-weight:600;outline:0;min-width:120px}
.bhead .lo{font-size:13px;color:var(--dim);flex:1;min-width:240px}
.bhead .lo b{color:var(--ink);font-weight:500}
.board{display:grid;grid-template-columns:minmax(240px,.9fr) 22px minmax(300px,1.25fr) 22px minmax(300px,1.25fr);gap:28px 0;padding:16px 24px 60px;align-items:start}
.arrow{align-self:start;margin-top:14px;color:var(--dim);display:flex;justify-content:center}
.band{min-width:0}
.band>header{display:flex;align-items:center;gap:8px;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.band>header h3{margin:0;font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.band>header .c{font-size:12px;color:var(--dim)}
.band>header .sp{flex:1}
.ocard{display:flex;gap:10px;width:100%;text-align:left;padding:10px;border:1px solid var(--line);border-radius:7px;margin-bottom:8px;background:var(--paper)}
.ocard:hover{border-color:color-mix(in srgb,var(--warm) 50%,var(--line))}
.ocard .ty{width:30px;height:30px;border-radius:6px;background:var(--sel);display:flex;align-items:center;justify-content:center;color:var(--warm);flex:none}
.ocard .tt{font-weight:500;font-size:13.5px}
.ocard .mm{font-size:12px;color:var(--dim);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ublock{margin-bottom:18px}
.ublock h4{margin:0 0 6px;font-size:12px;color:var(--dim);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.under{font-size:14.5px;line-height:1.6;margin:0}
.rp{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.rp:hover{color:var(--warm)}
.unc{flex:none;font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:1px 6px;border-radius:4px;border:1px solid currentColor;margin-top:2px;text-transform:uppercase}
.unc.solid{color:var(--good)}.unc.unsure{color:var(--warnc)}.unc.disputed{color:var(--bad)}
.thoughts{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:10px 12px;font-size:14px;line-height:1.55;font-family:var(--doc)}
.thoughts:focus{outline:2px solid var(--warm);outline-offset:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 8px;border-radius:5px;border:1px solid var(--line);background:var(--paper);max-width:100%}
.chip.dec{border-left:3px solid var(--good)}
.chip.pro{border-left:3px solid var(--warm);font-family:var(--quote);font-style:italic}
.chip.rej{color:var(--dim);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 70%,transparent)}
.chip.cor{border-left:3px solid var(--dim)}
.chip .x{color:var(--dim);display:inline-flex}
.chip .x:hover{color:var(--bad)}
.ecard{border:1px solid var(--line);border-radius:8px;background:var(--paper);margin-bottom:10px;overflow:hidden}
.ecard .eh{display:flex;align-items:center;gap:8px;padding:10px 12px 0;font-size:12px;color:var(--dim)}
.ecard .eh .sp{flex:1}
.ecard .et{font-weight:600;font-size:14.5px;padding:4px 12px 0}
.ecard .ebody{padding:8px 12px 10px}
.ecard .ef{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--line);font-size:12.5px}
.art-lines{font-family:var(--doc);font-size:13px;line-height:1.55;color:var(--dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.carstrip{display:flex;gap:6px;overflow:hidden}
.carstrip .s{flex:none;width:58px;aspect-ratio:4/5;border:1px solid var(--line);border-radius:3px;background:var(--bg);font-size:8.5px;line-height:1.25;padding:4px;overflow:hidden;position:relative;color:var(--ink)}
.carstrip .s.e{border-style:dashed;color:var(--dim)}
.carstrip .s .art{position:absolute;inset:0;opacity:.55}
.carstrip .s span{position:relative}
.lcard{display:flex;gap:10px;align-items:center}
.lcard .art{width:56px;height:56px;border-radius:5px;flex:none}
.lcard .n{font-weight:500;font-size:13px}
.lcard .p{font-size:12.5px;margin-top:2px}
.newexp{width:100%;border:1px dashed var(--line);border-radius:8px;padding:12px;color:var(--dim);display:flex;align-items:center;gap:8px;justify-content:center;font-size:13.5px}
.newexp:hover{color:var(--warm);border-color:var(--warm)}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.kinds button{display:flex;align-items:center;gap:6px;padding:8px;border-radius:5px;font-size:13px;border:1px solid var(--line)}
.kinds button:hover{border-color:var(--warm);color:var(--warm)}
.kinds .honest{grid-column:1/-1}

/* media art */
.art{position:relative;overflow:hidden;background:var(--sel)}
.art svg{display:block;width:100%;height:100%}
.a-bg{fill:var(--sel)}.a-gr{fill:var(--line)}.a-cup{fill:var(--dim);opacity:.55}.a-rim{fill:var(--ink);opacity:.55}.a-play circle{fill:var(--bg);opacity:.75}.a-play path{fill:var(--ink)}
.dur{position:absolute;right:4px;bottom:4px;font-size:10px;background:var(--bg);color:var(--ink);padding:0 4px;border-radius:3px}

/* ---------- studio (write) ---------- */
.studio{display:grid;grid-template-columns:minmax(0,1fr) 270px;min-height:100%}
.studio.focus{grid-template-columns:minmax(0,1fr)}
.studio.focus .inherit,.studio.focus .margin{display:none}
.docpane{padding:16px 24px 80px;min-width:0}
.doctools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:12.5px;color:var(--dim)}
.doctools .sp{flex:1}
.docgrid{display:grid;grid-template-columns:minmax(0,700px) 230px;gap:28px;justify-content:center}
.studio.focus .docgrid{grid-template-columns:minmax(0,700px)}
.doc{font-family:var(--doc);font-size:16.5px;line-height:1.65;min-width:0}
.doc h1{font-family:var(--doc);font-size:28px;line-height:1.25;margin:0 0 18px;font-weight:650;outline:0}
.doc p{margin:0 0 1em;outline:0;border-radius:3px}
.doc p:focus{box-shadow:-10px 0 0 -8px var(--warm)}
.doc [contenteditable]:empty::before{content:attr(data-ph);color:var(--dim);opacity:.7}
.doc mark{background:color-mix(in srgb,var(--warm) 32%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.doc figure{margin:4px 0 1.2em}
.doc figure .art{aspect-ratio:16/9;border-radius:6px}
.doc figcaption{font-size:12.5px;color:var(--dim);margin-top:6px;font-family:var(--ui)}
.margin{position:relative;font-size:13px}
.margin .mh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:8px;font-weight:600}
.note{display:block;width:100%;text-align:left;padding:8px 10px;border-left:2px solid var(--line);margin-bottom:10px;border-radius:0 5px 5px 0;line-height:1.45}
.note:hover{background:var(--sel)}
.note.on{border-left-color:var(--warm);background:var(--sel)}
.note .nb{display:flex;gap:6px;align-items:center;margin-bottom:3px;font-size:11.5px;color:var(--dim)}
.note q{display:block;font-family:var(--quote);font-style:italic;color:var(--dim);font-size:12.5px;margin-bottom:3px;quotes:"\201C" "\201D"}
@media(min-width:1101px){.margin.abs .note{position:absolute;left:0;right:0}}
@media(min-width:1101px){.inherit{position:sticky;top:42px;align-self:start;max-height:calc(100dvh - 92px);overflow:auto}}
.inherit{border-left:1px solid var(--line);background:var(--rail);padding:16px 16px 60px;font-size:13px;min-width:0}
.inherit h3{margin:0 0 2px;font-size:13px;font-weight:600}
.inherit .sub{font-size:12px;color:var(--dim);margin-bottom:14px}
.inherit .grp{margin-bottom:16px}
.inherit .grp h5{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600}
.inherit .src{display:flex;gap:6px;align-items:center;padding:3px 0;color:var(--ink);text-align:left}
.inherit .src:hover{color:var(--warm)}
.inherit p{margin:0;line-height:1.5;color:var(--dim)}

/* carousel sequence */
.seq{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.slide{border:1px solid var(--line);border-radius:8px;background:var(--paper);overflow:hidden;transition:transform .15s,opacity .15s}
.slide.dragging{opacity:.4}
.slide.over{outline:2px solid var(--warm);outline-offset:2px}
.slide .sh{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--line)}
.grip{cursor:grab;touch-action:none;display:inline-flex;padding:4px;margin:-4px;border-radius:4px;color:var(--dim)}
.grip:hover{color:var(--warm);background:var(--sel)}
.grip:active{cursor:grabbing}
.slide .sh .sp{flex:1}
.face{aspect-ratio:4/5;position:relative;background:var(--bg)}
.face .art{position:absolute;inset:0;opacity:.5}

.dgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}

function miniHTML(s, e){
  const k = `<span class="k">${ic(e.kind)}${KIND[e.kind]}</span>`;
  if (e.kind === 'carousel') return `<div class="mini car" title="${esc(e.title)}">${e.slides.slice(0,4).map(x => `<i class="${x.text.trim()?'':'e'}"></i>`).join('')}</div>`;
  if (e.kind === 'listing') return `<div class="mini">${k}<b>${esc(e.fields.name)}</b><span class="tone-${tone(e)}">${esc(e.fields.price || 'Price missing')}</span></div>`;
  const first = (e.blocks.find(b => b.t === 'p' && b.text) || {}).text || '';
  return `<div class="mini">${k}<b>${esc(e.title)}</b><span>${esc(first.slice(0,60))}</span></div>`;
}
function homeHTML(){
  const waiting = SUBJECTS.filter(s => s.waiting);
  return `<div class="home">
    <h1>Studio</h1>
    <p class="lede">${SUBJECTS.length} subjects, ${SUBJECTS.reduce((n,s) => n + s.expressions.length, 0)} pieces growing from them. ${waiting.length} ${waiting.length===1?'is':'are'} waiting on you.</p>
    <section class="strip"><h3>Waiting on you</h3><div class="wait-row">
      ${waiting.map(s => `<button class="wcard" data-act="go" data-sid="${s.id}" data-sec="${s.waitSec}" data-pid="${s.waitPid||''}"><div class="s">${esc(s.title)}</div><div class="a">${esc(s.waitText)}</div><div class="go">Go to ${SECNAME[s.waitSec]} →</div></button>`).join('')}
    </div></section>
    <section class="strip"><h3>Since you left — Claude and Codex did</h3><div class="feed">
      ${FEED.map(f => { const s = SUBJECTS.find(x => x.id === f.sid); return `<button data-act="go" data-sid="${f.sid}" data-sec="${f.sec}" data-pid="${f.pid||''}">${whoTag(f.actor)}<span class="subj">${esc(s.title)}</span><span class="what">${esc(f.what)}</span><span class="when">${esc(f.when)}</span></button>`; }).join('')}
    </div></section>
    <section class="strip"><h3>Subjects</h3><div class="tiles">
      ${SUBJECTS.map(s => `<button class="tile" data-act="subject" data-sid="${s.id}">
        <h4>${esc(s.title)}${s.waiting?'<span class="tag warm">waiting on you</span>':''}${s.state==='resting'?'<span class="tag">resting</span>':''}</h4>
        <div class="minis">${s.expressions.length ? s.expressions.slice(0,3).map(e => miniHTML(s,e)).join('') : `<div class="mini" style="width:100%"><span class="k">${ic('photos')}${s.origins.length} origins</span><span>No pieces yet. Open to start one.</span></div>`}</div>
        <div class="left">Where you left off: <b>${esc(s.lastLeft.text)}</b></div>
        <div class="foot"><span>${esc(stateLine(s))}</span><span>${whoTag(s.touched.actor)} ${esc(s.touched.when)}</span></div>
      </button>`).join('')}
      <button class="tile new" data-act="newsubject">${ic('plus')}<span>New subject<br><span class="dim" style="font-size:12.5px">Start from a recording, a photo, a conversation or an idea</span></span></button>
    </div></section>
  </div>`;
}

/* ================= tabs ================= */
function tabsHTML(){
  return `<nav class="ctx" aria-label="Sections"><div class="g"><button class="board-tab ${S.sec==='board'?'on':''}" data-act="sec" data-sec="board">Board</button></div>
    ${GROUPS.map(([g, items]) => `<div class="g"><span class="gl">${g}</span>${items.map(([k,n]) => `<button class="${S.sec===k?'on':''}" data-act="sec" data-sec="${k}" title="${SECNUM[k]} ${n} — ${esc(PURPOSE[k])}">${n}</button>`).join('')}</div>`).join('')}
  </nav>`;
}
function secHead(k, acts=''){
  return `<div class="sec-head"><span class="num">${SECNUM[k]}</span><h2>${SECNAME[k]}</h2><p>${esc(PURPOSE[k])}</p>${acts?`<div class="acts">${acts}</div>`:''}</div>`;
}
function pickerHTML(){
  const s = subj();
  return `<div class="pick"><span class="lbl">Piece</span>${s.expressions.map(e => `<button class="${S.pid===e.id?'on':''}" data-act="pick" data-pid="${e.id}">${ic(e.kind,'sm')}${esc(e.title)}</button>`).join('')}</div>`;
}

/* ================= board ================= */
function expCardHTML(s, e){
  let body = '';
  if (e.kind === 'carousel') body = `<div class="carstrip">${e.slides.map(x => `<div class="s ${x.text.trim()?'':'e'}">${x.img?art(mediaOf(s,x.img)):''}<span>${esc(x.text || 'empty')}</span></div>`).join('')}</div>`;
  else if (e.kind === 'listing') body = `<div class="lcard">${art(mediaOf(s,e.media))}<div><div class="n">${esc(e.fields.name)}</div><div class="p tone-${tone(e)}">${esc(e.fields.price || 'Price missing — waiting on you')}</div></div></div>`;
  else { const ps = e.blocks.filter(b => b.t === 'p' && b.text).map(b => b.text); body = `<p class="art-lines">${esc(ps.join(' ') || 'Empty — nothing written yet.')}</p>`; }
  return `<div class="ecard"><div class="eh">${ic(e.kind,'sm')}${KIND[e.kind]}<span class="sp"></span>${whoTag(e.by)}<span>${esc(e.when)}</span></div>
    <div class="et">${esc(e.title)}</div><div class="ebody">${body}</div>
    <div class="ef"><span class="tone-${tone(e)}">${esc(status(e))}</span><span style="display:flex;gap:10px"><button class="link" data-act="openpiece" data-pid="${e.id}" data-sec="audience">Preview</button><button class="btn" data-act="openpiece" data-pid="${e.id}">Open</button></span></div></div>`;
}
function chipList(s, key, cls, removable){
  const arr = s[key];
  if (!arr.length) return `<span class="dim" style="font-size:12.5px">None yet</span>`;
  return arr.map((t,i) => `<span class="chip ${cls}">${cls==='pro'?'“'+esc(t)+'”':esc(t)}${removable?`<button class="x" data-act="chipdel" data-key="${key}" data-i="${i}" aria-label="Remove">${ic('close','sm')}</button>`:''}</span>`).join('');
}
function boardHTML(){
  const s = subj();
  const ll = s.lastLeft;
  return `<div class="bhead"><h1 contenteditable="true" spellcheck="false" data-bind="stitle">${esc(s.title)}</h1>
    <div class="lo">Where you left off: <b>${esc(ll.text)}</b> · last touched by ${whoTag(s.touched.actor)} ${esc(s.touched.when)}</div>
    <button class="btn primary" data-act="resume">Resume ${ic('arrow','sm')}</button></div>
  <div class="board">
    <section class="band origins"><header>${ic('photos')}<h3>Origins</h3><span class="c">${s.origins.length}</span><span class="sp"></span><button class="link" data-act="sec" data-sec="material">Material</button></header>
      <div class="olist">${s.origins.map(o => `<button class="ocard" data-act="origin" data-oid="${o.id}"><span class="ty">${ic(o.type)}</span><span style="min-width:0"><div class="tt">${esc(o.title)}</div><div class="mm">${esc(o.meta)} ${o.from==='you'?whoTag('You'):'<span>from</span>'+whoTag(o.from)}</div></span></button>`).join('')}</div>
      ${s.inbox.length ? `<button class="link" data-act="sec" data-sec="material">${s.inbox.length} new item${s.inbox.length>1?'s':''} not sorted yet →</button>` : ''}
      <label class="newexp" style="margin-top:6px;cursor:pointer">${ic('upload')}Bring in material<input type="file" multiple hidden data-act-file="intake"></label>
    </section>
    <div class="arrow" aria-hidden="true">${ic('arrow')}</div>
    <section class="band"><header>${ic('circle')}<h3>Understanding</h3><span class="sp"></span><button class="link" data-act="sec" data-sec="direction">Direction</button></header>
      <div class="ublock"><h4>Current understanding</h4><p class="under">${esc(s.understanding)}</p></div>
      <div class="ublock"><h4>Key points <button class="link" data-act="sec" data-sec="research">Research</button></h4>
        ${s.points.length ? s.points.map(p => `<button class="rp" data-act="point" data-rid="${p.id}"><span class="unc ${p.unc}">${p.unc}</span><span>${esc(p.title)}</span></button>`).join('') : '<span class="dim" style="font-size:12.5px">No research points yet.</span>'}</div>
      <div class="ublock"><h4>Your thoughts</h4><textarea class="thoughts" data-bind="thoughts" placeholder="What you think, feel or want from this — in your own words.">${esc(s.thoughts)}</textarea></div>
      <div class="ublock"><h4>Decisions</h4><div class="chips">${chipList(s,'decisions','dec')}</div></div>
      <div class="ublock"><h4>Protected phrases</h4><div class="chips">${chipList(s,'protected','pro')}</div></div>
      <div class="ublock"><h4>Rejected angles</h4><div class="chips">${chipList(s,'rejected','rej')}</div></div>
    </section>
    <div class="arrow" aria-hidden="true">${ic('arrow')}</div>
    <section class="band"><header>${ic('article')}<h3>Expressions</h3><span class="c">${s.expressions.length}</span><span class="sp"></span><button class="link" data-act="sec" data-sec="outputs">Outputs</button></header>
      ${s.expressions.map(e => expCardHTML(s,e)).join('')}
      <button class="newexp" data-act="newmenu" aria-expanded="${S.newMenu}">${ic('plus')}New expression from this</button>
      ${S.newMenu ? `<div class="kinds">${Object.keys(KIND).map(k => `<button data-act="newpiece" data-kind="${k}">${ic(k)}${KIND[k]}</button>`).join('')}<p class="honest">${ic('alert','sm')}<span>A new piece starts empty and inherits this subject’s decisions and protected phrases. Prototype — nothing is saved.</span></p></div>` : ''}
    </section>
  </div>`;
}

/* ================= sections ================= */
function materialHTML(){
  const s = subj();
  const all = [...s.inbox.map(o => ({...o, inbox:true})), ...s.origins];
  const sel = all.find(o => o.id === S.matSel) || all[0];
  let prev = '<div class="dim">Nothing here yet.</div>';
  if (sel) {
    if (sel.type === 'recording') prev = `<div class="wave">${Array.from({length:70}, (_,i) => `<i style="height:${12 + (hash(sel.id+i) % 80)}%"></i>`).join('')}</div><p class="dim" style="margin:0 0 12px;font-size:13px">Waveform is a sample drawing.</p><button class="btn" data-act="sec" data-sec="source">Open in Source ${ic('arrow','sm')}</button>`;
    else if (sel.type === 'photos') prev = `<div class="thumbs">${(s.media.length ? s.media : [{id:sel.id,title:sel.title,type:'photo'}]).map(m => art(m)).join('')}</div>`;
    else prev = `<p class="quote">${esc(sel.preview)}</p><div class="cite">${esc(sel.meta)}</div>`;
  }
  const row = o => `<button class="mitem ${sel&&sel.id===o.id?'on':''}" data-act="matsel" data-oid="${o.id}"><span class="ty">${ic(o.type)}</span><span style="min-width:0;flex:1"><div class="tt">${esc(o.title)}</div><div class="mm">${esc(o.meta)}</div></span>${o.from!=='you'?whoTag(o.from):''}</button>`;
  return `<div class="secwrap">${secHead('material')}
  <div class="two">
    <div class="panel"><div class="pb">
      <div class="drop">${ic('upload')} Drop recordings, photos, video or notes here, or <label>choose files<input type="file" multiple data-act-file="intake"></label>.<br><span style="font-size:12px">Prototype — files stay in this tab and are not uploaded.</span></div>
      ${s.inbox.length ? `<div class="grouplbl">Just arrived — not sorted</div>${s.inbox.map(o => row({...o})).join('')}` : ''}
      <div class="grouplbl">In this subject</div>${s.origins.map(row).join('')}
    </div></div>
    <div class="panel">${sel ? `<div class="ph">${ic(sel.type)}${esc(sel.title)}<span class="sp"></span>${sel.from==='you'?whoTag('You'):whoTag(sel.from)}</div>
      <div class="pb">${prev}
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
          <button class="btn" data-act="honest" data-msg="Processing is not connected here — ask Claude in conversation and the result appears in this subject.">Process</button>
          ${sel.inbox ? `<button class="btn" data-act="sortin" data-oid="${sel.id}">Sort into this subject</button>` : ''}
        </div>
        <p class="honest" style="margin-top:12px">${ic('alert','sm')}<span>Keep / remove review is not connected yet.</span></p>
      </div>` : '<div class="pb dim">Nothing selected.</div>'}</div>
  </div></div>`;
}
function sourceHTML(){
  const s = subj();
  const rec = s.origins.find(o => o.type === 'recording');
  if (!s.transcript.length) return `<div class="secwrap">${secHead('source')}<div class="emptyst"><b>No transcript in this subject yet.</b>${rec ? `“${esc(rec.title)}” has not been transcribed.` : 'Bring in a recording in Material.'}<div style="margin-top:12px"><button class="btn" data-act="sec" data-sec="material">Go to Material</button></div></div></div>`;
  return `<div class="secwrap">${secHead('source', `<button class="btn ghost" data-act="honest" data-msg="Bilingual view is not connected yet.">Bilingual view</button>`)}
  <div class="two" style="grid-template-columns:minmax(0,1fr) minmax(240px,320px)">
    <div>
      <div class="player"><button class="iconbtn" data-act="honest" data-msg="Recording playback is not connected in this prototype.">${ic('play')}</button><span style="font-weight:500">${esc(rec ? rec.title : 'Recording')}</span><span class="bar"><i></i></span><span class="dim" style="font-size:12px">Playback not connected</span></div>
      <p class="dim" style="font-size:12.5px;margin:0 0 8px">Click any line to correct it. Dotted lines are low-confidence.</p>
      ${s.transcript.map((l,i) => S.editLine === i ? `<div class="tline" style="background:var(--sel)"><span class="ts">${l.t}</span><span class="sp">${esc(l.who)}</span><div class="tedit"><textarea id="tedit" aria-label="Correct this line">${esc(l.text)}</textarea><div class="row"><button class="btn primary" data-act="tsave" data-i="${i}">Keep correction</button><button class="btn ghost" data-act="tcancel">Cancel</button><span class="dim" style="font-size:12px;align-self:center">Kept in this tab only</span></div></div></div>`
        : `<button class="tline" data-act="tedit" data-i="${i}"><span class="ts">${l.t}</span><span class="sp">${esc(l.who)}</span><span class="tx ${l.lc && !l.fixed?'lc':''}">${esc(l.text)}${l.fixed?'<span class="fixed">corrected</span>':''}</span></button>`).join('')}
    </div>
    <div class="panel"><div class="ph">Corrections<span class="sp"></span><span class="dim" style="font-weight:400;font-size:12px">carry into every piece</span></div><div class="pb">
      ${s.corrections.length ? s.corrections.map(c => `<div style="margin-bottom:10px;font-size:13px"><span class="dim" style="text-decoration:line-through">${esc(c.from)}</span> → <b style="font-weight:500">${esc(c.to)}</b><div class="cite">${esc(c.at)}</div></div>`).join('') : '<span class="dim">None yet.</span>'}
    </div></div>
  </div></div>`;
}
function researchHTML(){
  const s = subj();
  if (!s.points.length) return `<div class="secwrap">${secHead('research')}<div class="emptyst"><b>No research points yet.</b>Points appear here when Claude or you pull them out of the origins. Broad AI research is not connected yet.</div></div>`;
  const p = s.points.find(x => x.id === S.rpSel) || s.points[0];
  return `<div class="secwrap">${secHead('research', `<button class="btn ghost" data-act="honest" data-msg="Broad AI research and retrieval is not connected yet.">Find more evidence</button>`)}
  <div class="two">
    <div class="panel rlist"><div class="pb" style="padding:6px">${s.points.map(x => `<button class="${x.id===p.id?'on':''}" data-act="point" data-rid="${x.id}"><span class="unc ${x.unc}">${x.unc}</span><span>${esc(x.title)}</span></button>`).join('')}</div></div>
    <div class="panel"><div class="ph">${esc(p.title)}</div><div class="pb">
      <p style="margin:0 0 14px;font-size:14.5px;line-height:1.6">${esc(p.claim)}</p>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px"><span class="dim" style="font-size:12.5px">How sure are we?</span>
        <div class="seg">${['solid','unsure','disputed'].map(u => `<button class="${p.unc===u?'on':''}" data-act="unc" data-u="${u}">${u[0].toUpperCase()+u.slice(1)}</button>`).join('')}</div></div>
      <h4 style="margin:0 0 8px;font-size:12px;color:var(--dim);font-weight:600">Evidence</h4>
      ${p.evidence.length ? p.evidence.map(ev => `<div style="border-left:2px solid var(--line);padding:2px 0 2px 12px;margin-bottom:12px"><p class="quote">“${esc(ev.q)}”</p><div class="cite">${esc(ev.src)}</div></div>`).join('') : '<p class="dim">No evidence attached yet.</p>'}
      <div class="thread"><h4 style="margin:0 0 8px;font-size:13px;font-weight:600">Discuss this point</h4>
        ${p.thread.map(m => `<div class="msg ${m.sys?'sys':''}"><div class="nb">${m.sys?'Note':'You'}</div>${esc(m.text)}</div>`).join('')}
        <div class="compose"><textarea id="rmsg" placeholder="Ask or argue about this one point…"></textarea><button class="btn" data-act="rsend">Send</button></div>
        <p class="honest" style="margin-top:8px">${ic('alert','sm')}<span>AI discussion is not connected here yet — what you write is kept with this point.</span></p>
      </div>
    </div></div>
  </div></div>`;
}
function directionHTML(){
  const s = subj();
  const ed = (key, cls, label, ph) => `<div class="panel" style="margin-bottom:14px"><div class="ph">${label}</div><div class="pb"><div class="chips">${chipList(s,key,cls,true)}</div><div class="addrow"><input data-add="${key}" placeholder="${ph}"><button class="btn" data-act="chipadd" data-key="${key}">Add</button></div></div></div>`;
  const q = s.origins.find(o => o.from === 'Claude' && o.type === 'note');
  return `<div class="secwrap">${secHead('direction')}
  ${q ? `<div class="cbanner" style="border-left:3px solid var(--warnc)">${whoTag('Claude')}<span><b>Asked you:</b> ${esc(q.preview)}</span></div>` : ''}
  <div class="dgrid">
    <div>
      <div class="panel" style="margin-bottom:14px"><div class="ph">Your thoughts<span class="sp"></span><span class="dim" style="font-weight:400;font-size:12px">only your words</span></div><div class="pb"><textarea class="thoughts" style="min-height:180px" data-bind="thoughts" placeholder="What you think, feel, question or want from this.">${esc(s.thoughts)}</textarea></div></div>
      <div class="panel"><div class="ph">Current understanding</div><div class="pb"><textarea class="understand" data-bind="understanding">${esc(s.understanding)}</textarea></div></div>
    </div>
    <div>
      ${ed('decisions','dec','Decisions','Add a decision')}
      ${ed('protected','pro','Protected phrases','Add a phrase to keep exactly')}
      ${ed('rejected','rej','Rejected angles','Add an angle to avoid')}
      <p class="dim" style="font-size:12.5px">Everything here shows beside every piece in this subject.</p>
    </div>
  </div></div>`;
}
function noPieceHTML(k){
  return `<div class="secwrap">${secHead(k)}<div class="emptyst"><b>No pieces in this subject yet.</b>Start one from the board — it will inherit everything decided here.<div style="margin-top:12px"><button class="btn primary" data-act="boardnew">New expression from this</button></div></div></div>`;
}
function inheritHTML(s, e){
  const srcs = s.origins;
  return `<aside class="inherit" aria-label="What this piece inherits">
    <h3>${esc(s.title)}</h3><div class="sub">This piece inherits — <button class="link" data-act="sec" data-sec="direction">change in Direction</button></div>
    <div class="grp"><h5>Decisions</h5><div class="chips">${chipList(s,'decisions','dec')}</div></div>
    <div class="grp"><h5>Protected phrases</h5><div class="chips">${chipList(s,'protected','pro')}</div></div>
    <div class="grp"><h5>Rejected angles</h5><div class="chips">${chipList(s,'rejected','rej')}</div></div>
    <div class="grp"><h5>Corrections from Source</h5>${s.corrections.length ? s.corrections.map(c => `<div style="font-size:12.5px;margin-bottom:4px"><span class="dim" style="text-decoration:line-through">${esc(c.from)}</span> → ${esc(c.to)}</div>`).join('') : '<p>None.</p>'}</div>
    <div class="grp"><h5>Sources used</h5>${srcs.map(o => `<button class="src" data-act="origin" data-oid="${o.id}">${ic(o.type,'sm')}<span>${esc(o.title)}</span></button>`).join('')}</div>
    <div class="grp"><h5>Understanding</h5><p>${esc(s.understanding)}</p></div>
  </aside>`;
}
function writeHTML(){
  const s = subj(), e = piece();
  if (!e) return noPieceHTML('write');
  const tools = `<div class="doctools">${ic(e.kind,'sm')}<span>${KIND[e.kind]}</span>·<span class="tone-${tone(e)}" id="pstatus">${esc(status(e))}</span>
    <span class="sp"></span><span>Edits kept in this tab · Prototype — nothing is saved</span>
    ${e.blocks ? `<button class="btn ghost" data-act="addnote">${ic('note','sm')}Note on selection</button>` : ''}
    <button class="btn ${S.focus?'on':''}" data-act="focus" aria-pressed="${S.focus}">${ic('focus','sm')}Focus</button></div>`;
  let main = '';
  if (e.kind === 'carousel') {
    main = `<p class="dim" style="font-size:12.5px;margin:0 0 12px" id="seqcount">${e.slides.length} slides · ${emptySlides(e)} empty · drag the handle to reorder · type straight onto a slide</p>
    <div class="seq" data-dnd-list="slides">${e.slides.map((x,i) => `<div class="slide" data-dnd-item="${i}"><div class="sh"><span class="grip" data-dnd-handle aria-label="Drag to reorder">${ic('grip')}</span><span>${i===0?'Cover':'Slide '+(i+1)}</span><span class="sp"></span>${x.img?`<span title="Image: ${esc(mediaOf(s,x.img).title)}">${ic('photos','sm')}</span>`:''}<button class="iconbtn" style="width:24px;height:24px" data-act="slidedel" data-i="${i}" aria-label="Remove slide">${ic('close','sm')}</button></div>
      <div class="face ${x.text.trim()||x.img?'':'e'}">${x.img?art(mediaOf(s,x.img)):''}<div class="stext" contenteditable="true" data-slide="${i}">${esc(x.text)}</div></div></div>`).join('')}
      <button class="addslide" data-act="slideadd">${ic('plus')}Add slide</button></div>`;
  } else if (e.kind === 'listing') {
    const f = e.fields;
    main = `<div class="lform doc"><h1 contenteditable="true" data-bind="ptitle">${esc(e.title)}</h1>
      <div style="display:flex;gap:14px;align-items:center">${art(mediaOf(s,e.media),'')}<span class="dim" style="font-size:13px;font-family:var(--ui)">Main photo: ${esc((mediaOf(s,e.media)||{}).title||'none')} · <button class="link" data-act="sec" data-sec="media">change in Media</button></span></div>

function placeNotes(){

    case 'chipdel': s[d.key].splice(+d.i, 1); render(true); break;
    case 'mfilter': S.mediaFilter = d.k; render(true); break;
    case 'aud': S.aud = d.k; render(true); break;
    case 'aslide': S.audSlide = Math.max(0, S.audSlide + (+d.d)); render(true); break;
    case 'honest': toast(d.msg); break;
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.matches('[data-add]')) { ev.preventDefault(); const b = document.querySelector(`[data-act="chipadd"][data-key="${ev.target.dataset.add}"]`); if (b) b.click(); }
  if (ev.key === 'Enter' && ev.target.matches('[data-bind="stitle"],[data-bind="ptitle"]')) { ev.preventDefault(); ev.target.blur(); }
  if (ev.key === 'Escape' && S.sheet) { S.sheet = false; renderTop(); }
  if (ev.key === 'Enter' && (ev.target.matches('.tline') || ev.target.matches('.note'))) { /* native button handles */ }
});
let placeT, lastSel = null;
document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || sel.isCollapsed) return;
  const n = sel.anchorNode, el = n && (n.nodeType === 1 ? n : n.parentElement);
  const p = el && el.closest && el.closest('.doc p[data-block]');
  if (p) lastSel = {q: sel.toString().trim().slice(0, 200), block: p.dataset.block};
});
document.addEventListener('input', ev => {
  const t = ev.target, s = subj(), e = piece();
  if (t.id === 'q') { S.q = t.value; renderSide(); return; }
  if (t.dataset.bind === 'thoughts') { s.thoughts = t.value; return; }
  if (t.dataset.bind === 'understanding') { s.understanding = t.value; return; }
  if (t.dataset.bind === 'stitle') { s.title = t.textContent.trim() || 'Untitled subject'; renderSide(); return; }
  if (t.dataset.bind === 'ptitle' && e) { e.title = t.textContent.trim() || 'Untitled'; return; }
  if (t.dataset.block && e && e.blocks) { const b = e.blocks.find(x => x.id === t.dataset.block); if (b) b.text = t.textContent; clearTimeout(placeT); placeT = setTimeout(placeNotes, 120); return; }
  if (t.dataset.slide != null && e && e.slides) {
    e.slides[+t.dataset.slide].text = t.textContent;
    t.parentElement.classList.toggle('e', !t.textContent.trim() && !e.slides[+t.dataset.slide].img);
    const c = $('#seqcount'); if (c) c.textContent = `${e.slides.length} slides · ${emptySlides(e)} empty · drag the handle to reorder · type straight onto a slide`;
    const st = $('#pstatus'); if (st) { st.textContent = status(e); st.className = 'tone-' + tone(e); }
    renderSide(); return;
  }
  if (t.dataset.field && e && e.fields) { e.fields[t.dataset.field] = t.textContent; const st = $('#pstatus'); if (st) { st.textContent = status(e); st.className = 'tone-' + tone(e); } renderSide(); return; }
});
document.addEventListener('change', ev => {
  const t = ev.target; if (!t.dataset.actFile) return;
  const n = t.files ? t.files.length : 0; if (!n) return;
  const s = subj();
  if (t.dataset.actFile === 'intake') {
    Array.from(t.files).forEach(f => s.inbox.push({id:'f' + (++bid), type: /^image|^video/.test(f.type) ? 'photos' : /^audio/.test(f.type) ? 'recording' : 'note', title:f.name, meta:`${Math.max(1, Math.round(f.size/1024))} KB · not sorted`, from:'you', preview:'Chosen just now. Kept in this tab only — not uploaded.'}));
    S.matSel = s.inbox[s.inbox.length - 1].id; setSec('material');
  } else {
    Array.from(t.files).forEach(f => s.media.push({id:'f' + (++bid), type: /^video/.test(f.type) ? 'video' : 'photo', title:f.name, dur:'—'}));
    render(true);
  }
  toast(`${n} file${n>1?'s':''} added in this tab — not uploaded. Prototype, nothing is saved.`);
});

/* ---------- drag to reorder (pointer based: mouse + touch) ---------- */
let drag = null;
document.addEventListener('pointerdown', ev => {
  const h = ev.target.closest('[data-dnd-handle]'); if (!h) return;
  const item = h.closest('[data-dnd-item]'), list = h.closest('[data-dnd-list]'); if (!item || !list) return;
  ev.preventDefault();
  drag = {list, key:list.dataset.dndList, from:+item.dataset.dndItem, to:+item.dataset.dndItem, item};
  item.classList.add('dragging');
  try { h.setPointerCapture(ev.pointerId); } catch(e) {}
});
document.addEventListener('pointermove', ev => {
  if (!drag) return;
  const el = document.elementFromPoint(ev.clientX, ev.clientY);
  const over = el && el.closest('[data-dnd-item]');
  $$('[data-dnd-item].over', drag.list).forEach(x => x.classList.remove('over'));
  if (over && drag.list.contains(over)) { drag.to = +over.dataset.dndItem; if (over !== drag.item) over.classList.add('over'); }
});
function endDrag(){
  if (!drag) return;
  const {key, from, to} = drag; drag = null;
  if (from !== to) {
    const e = piece(); const arr = key === 'slides' ? e.slides : e.blocks;
    const [x] = arr.splice(from, 1); arr.splice(to, 0, x);
    toast('Reordered in this tab — Prototype, nothing is saved.');
  }
  render(true);
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => { clearTimeout(placeT); placeT = setTimeout(placeNotes, 100); });

$$('[data-i]').forEach(el => { el.outerHTML = ic(el.dataset.i); });
render();
</script>
